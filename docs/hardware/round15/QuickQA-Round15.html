<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>PokeBank NX QuickQA</title>
<style>
:root{--bg:#f6f7f9;--fg:#15171a;--card:#fff;--line:#d9dde3;--mut:#5b6470;--pass:#1f8a3b;--fail:#c62828;--nt:#6b7280;--acc:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#e8eaed;--card:#171a20;--line:#2b303a;--mut:#9aa3ad;--acc:#60a5fa}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;z-index:2}
h1{font-size:17px;margin:0 0 4px}.id{font:12px ui-monospace,monospace;color:var(--mut);word-break:break-all}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
button,label.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:12px 16px 80px}h2{font-size:15px;margin:22px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.c h3{margin:0 0 6px;font-size:15px}.k{color:var(--mut);font-weight:600}
.r{display:flex;gap:6px;margin:8px 0 6px}.r button.on.PASS{background:var(--pass);color:#fff;border-color:var(--pass)}
.r button.on.FAIL{background:var(--fail);color:#fff;border-color:var(--fail)}.r button.on.NT{background:var(--nt);color:#fff;border-color:var(--nt)}
textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);padding:6px;font:inherit}
.sum{font-weight:600}.note{color:var(--mut);font-size:13px}
</style></head><body><header><h1 id="t"></h1><div class="id" id="ident"></div>
<div class="bar"><span class="sum" id="sum"></span><button id="exp">Export JSON</button>
<label class="btn">Import JSON<input type="file" id="imp" accept="application/json" hidden></label>
<button id="clr">Clear all</button></div>
<div class="note">NOT DEVICE TESTED until you test this exact NRO. Focused retest, not the full #313 release acceptance. Results save in this browser automatically.</div>
</header><main id="m"></main>
<script>
const SPEC={"title": "PokeBank NX Round 15 QuickQA", "identity": {"NRO file": "PokeBank-NX-Gen1-5-Candidate-11ea9790.nro", "NRO SHA-256": "8658ef117cdde0dfcfed473918b583961c1fac6cf33f08c48cae2d1f29772fa4", "Source commit": "11ea9790ca31c6b8bb5d02c984e3293df7c21f2b", "Source tree": "eb36b0aa2fe8362725dc151d066297ada263726b", "Build run / artifact": "41565071576 / 13198671780", "Status": "NOT DEVICE TESTED"}, "items": [{"id": "S01", "section": "1. Saves and profiles (P0)", "name": "No save: A opens the save chooser, never an editor", "game": "Pokémon White 2 (with no White 2 save on the SD card)", "where": "Product Home → White 2 card", "do": "Press A. Press B. Press +. Press B. Press Items on the HOME dock. Press B. Open Quick Games and choose White 2.", "expect": "Every route shows White 2's save chooser (Save Instances / file browser). Party, Boxes, Bag or the editor never open."}, {"id": "S02", "section": "1. Saves and profiles (P0)", "name": "Gen I–III first open asks for a save once", "game": "Pokémon Red (or any Gen I–III game you have)", "where": "Product Home → Red card", "do": "Press A. In Save Instances pick your Red save with A. Go back Home and press A again.", "expect": "First time: Save Instances opens and picking your save opens the game. Second time: the game opens directly."}, {"id": "S03", "section": "1. Saves and profiles (P0)", "name": "Assigned save opens from every route", "game": "Pokémon Red (assigned in S02)", "where": "Product Home → Red card", "do": "Press A, then B. Press +, then B. Press Items on the HOME dock, then B. Open it from Quick Games.", "expect": "Each route opens your Red save (the hub, the Game Workspace menu, the Bag). Never a different save."}, {"id": "S04", "section": "1. Saves and profiles (P0)", "name": "Forget (unassign) a save", "game": "Pokémon Red", "where": "Red card → + → Source / Game File (or Save Instances)", "do": "Press − (Forget). Read the question and press Y. Back Home, press A on Red.", "expect": "Forget asks first; Y removes only the app's link. Red then shows the chooser again. The save file on the SD card is unchanged (same size and date)."}, {"id": "S05", "section": "1. Saves and profiles (P0)", "name": "Profile B never sees Profile A's save", "game": "Pokémon Red and Pokémon Black 2", "where": "Product Home, Profile A has saves assigned", "do": "Tap the profile icon and switch to Profile B. Press A and Items on Red. Then A and Items on Black 2.", "expect": "Profile B gets the chooser (or 'Matching saves belong to another profile'). Profile A's saves never open on Profile B."}, {"id": "S06", "section": "1. Saves and profiles (P0)", "name": "Switching back keeps Profile A's assignment", "game": "Pokémon Black 2", "where": "Switch back to Profile A", "do": "Press Items on the HOME dock for Black 2. Then press A on Black 2.", "expect": "Items opens Black 2's Bag from A's Black 2 save (not a list of every DS save). The assignment is still there; no 'belongs to someone else' error."}, {"id": "S07", "section": "1. Saves and profiles (P0)", "name": "Moved or renamed save is refused, not replaced", "game": "Any game with an assigned save", "where": "SD card, then Product Home", "do": "On a PC, rename the assigned save (keep a copy). Open PokeBank and press A on that game. Rename it back afterwards.", "expect": "The chooser opens and says the save is missing or moved. No other save is opened in its place."}, {"id": "S08", "section": "1. Saves and profiles (P0)", "name": "Wrong game's save is refused", "game": "Pokémon White and White 2 (or Black / Black 2)", "where": "White card → chooser → file browser", "do": "In White's file browser, pick a White 2 save file.", "expect": "Refused with a reason; White does not open with White 2's save."}, {"id": "S09", "section": "1. Saves and profiles (P0)", "name": "Uninitialized emulator file is not editable", "game": "Any Gen IV/V game (e.g. White 2)", "where": "Chooser → file browser", "do": "Start a new game in the emulator but quit before saving in-game, so the emulator makes an empty save. Pick that file in PokeBank.", "expect": "Shows 'not an initialized save'. Nothing opens and the file is unchanged."}, {"id": "W01", "section": "2. White 2 Create and Import", "name": "First-boot White 2 offers no Add or Import", "game": "Pokémon White 2 save made before the first in-game save (no trainer yet)", "where": "Boxes → empty slot", "do": "Press A on an empty slot. Then press X.", "expect": "No Add Pokémon and no Import from file. The slot explains why (no trainer yet)."}, {"id": "W02", "section": "2. White 2 Create and Import", "name": "After a real save, Add and Import work", "game": "Pokémon White 2 after saving in-game once", "where": "Boxes → empty slot", "do": "Press A on an empty slot (Add Pokémon is listed). Press B. Press X (Import from file).", "expect": "Add Pokémon is offered; X opens Import from file. A and X agree."}, {"id": "W03", "section": "2. White 2 Create and Import", "name": "Gen V Import lists only .pk5 / .ek5", "game": "Pokémon White 2 (or Black)", "where": "Boxes → empty slot → X (Import from file)", "do": "Browse to a folder that also has .pk1/.pk3/.pk4 files (for example your Gen I import folder).", "expect": "Only .pk5 and .ek5 files are listed. Other generations' files do not appear."}, {"id": "E01", "section": "3. Editor and shared controls", "name": "Footers are the same in every game", "game": "Red, Gold, FireRed, Platinum, Black", "where": "Items (Bag) with an item highlighted", "do": "Read the footer in each game. Press X (Add item) and read that footer.", "expect": "Same words everywhere: Navigate, A Edit Amount, X Add Item, Y Remove Item, L/R Category, ZR Top Up, + Review, − Help, B Back. Add picker: Navigate, Add / Select, Cancel, Page, Sort."}, {"id": "E02", "section": "3. Editor and shared controls", "name": "+ opens Review from the game's main menu", "game": "Any Gen I–IV game", "where": "Change one item amount, then B back to the game's main menu (hub)", "do": "Press +. Then press B.", "expect": "Review opens with your change; B returns to the main menu."}, {"id": "E03", "section": "3. Editor and shared controls", "name": "Crystal Add needs a Met Location", "game": "Pokémon Crystal", "where": "Boxes → empty slot → A → Add Pokémon", "do": "Pick a species and one move. Press B, then A (Keep / Add). Then open Location, pick a place, B, A.", "expect": "First A: 'Choose a Met Location before Add', nothing added. After choosing a location the Pokémon is added."}, {"id": "B01", "section": "4. Bag, Top Up, TMs and moves", "name": "Top Up says how many fit", "game": "Pokémon Ruby or Emerald", "where": "Items → ZR → Bag + PC Items → Preview", "do": "Read the first lines, scroll the list, press A.", "expect": "Lines like 'Items: 30 native slots, 5 used. Only 25 fit; N missing items won't fit'. Every item listed once with a reason. A shows a Result list."}, {"id": "B02", "section": "4. Bag, Top Up, TMs and moves", "name": "Gen I TM tab adds TMs", "game": "Pokémon Red or Blue", "where": "Items → TM/HM tab → ZR → All Bag → Preview", "do": "Read the preview, press A, then +.", "expect": "The items being added are TMs/HMs, and the preview says the Bag has 20 slots shared by every category."}, {"id": "B03", "section": "4. Bag, Top Up, TMs and moves", "name": "Move chooser and moves still work", "game": "Any Gen III–V game", "where": "Edit a Pokémon → Moves", "do": "Open a move slot, pick a move, Keep, then Review.", "expect": "Only learnable moves are listed; the move change shows in Review."}, {"id": "X01", "section": "5. EXP, species and data", "name": "Species change keeps the level", "game": "Any Gen III–V game (e.g. Emerald)", "where": "Edit an existing Lv 50 Rattata → Species", "do": "Change the species to Magikarp. Read the status line. Keep, then Review.", "expect": "Still Lv 50, note 'Kept Lv. 50; EXP 125000 -> 156250'. Review shows separate Species and Experience rows (no Level row)."}, {"id": "X02", "section": "5. EXP, species and data", "name": "Gen I species change keeps the level", "game": "Pokémon Red", "where": "Edit an existing Lv 50 Pikachu → Species", "do": "Change to Magikarp. Keep. Review. Export Copy.", "expect": "Still Lv 50; Review lists Species and Experience. Untouched Pokémon in the export are byte-identical (nothing else changed)."}, {"id": "X03", "section": "5. EXP, species and data", "name": "Event Pokémon say access unverified", "game": "Pokémon Black (Victini) or Black 2 (Regirock / Registeel)", "where": "Add Pokémon → Victini Lv 15 (Black) → Met Location", "do": "Read the Victini row and the Met evidence line. In Black 2, compare Regirock with Registeel.", "expect": "Victini: 'access unverified', evidence Incomplete (Liberty Pass). Black 2 Regirock is a normal row; Registeel says access unverified (Iron Key)."}, {"id": "L01", "section": "6. Names and language", "name": "Unsupported characters are refused", "game": "Pokémon FireRed (English save)", "where": "Any Pokémon → Edit → OT (or Nickname)", "do": "On the ?123 page type A×B and press OK. Then type BOB and press OK.", "expect": "A×B is refused with a message and nothing changes. BOB is stored exactly."}, {"id": "L02", "section": "6. Names and language", "name": "Name follows Language", "game": "Pokémon Platinum (or any Gen IV)", "where": "Add Pokémon → Pikachu (no nickname) → Language", "do": "Change Language to Japanese, then Korean, then English.", "expect": "The name at the top changes to ピカチュウ, 피카츄, PIKACHU. Level and stats do not change."}, {"id": "M01", "section": "7. Move, Clone, Release, Review, Export", "name": "Move and Clone", "game": "Any Gen I–V game", "where": "Boxes", "do": "Y on a Pokémon, move to an empty slot, A. Then A → Clone, place the copy with A.", "expect": "Both land where chosen, with no pop-up; an occupied slot is never overwritten."}, {"id": "M02", "section": "7. Move, Clone, Release, Review, Export", "name": "Review, Discard and Export Copy", "game": "Any game with staged changes", "where": "+ Review", "do": "Discard (B then Y), make one change again, then Export Copy.", "expect": "Discard asks first and restores everything. Export Copy says 'Verified copy exported: … (original save unchanged)'."}, {"id": "T01", "section": "8. Touch, stick and D-pad", "name": "Touch carry places and cancels", "game": "Any Gen I–V game", "where": "Boxes", "do": "Drag a finger over 2×2 Pokémon and lift. Tap an empty cell. Pick up again and tap outside the grid.", "expect": "The tap places the group (no pop-up); the outside tap returns it. The box arrows only change the box."}, {"id": "R01", "section": "9. RetroArch quit (Needs Switch Evidence)", "name": "RetroArch quit diagnostic", "game": "Pokémon Red", "where": "Red card → launch the game", "do": "Launch Red from PokeBank, then quit RetroArch. Note where you land and any error code. Copy sdmc:/switch/PokeBank-NX/runtime/last-launch.txt and any new file in sdmc:/atmosphere/crash_reports/.", "expect": "Not a fix: this collects evidence. Comment with: where you landed, error code, how you start PokeBank (Homebrew Menu / Album / forwarder), and attach last-launch.txt."}]};const KEY="pokebanknx-quickqa-"+SPEC.identity["Source commit"];
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){st={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}summ()}
function summ(){let p=0,f=0,n=0;for(const it of SPEC.items){const r=(st[it.id]||{}).result;if(r==="PASS")p++;else if(r==="FAIL")f++;else if(r==="NOT TESTED")n++}
document.getElementById("sum").textContent=`PASS ${p} · FAIL ${f} · NOT TESTED ${n} · open ${SPEC.items.length-p-f-n} / ${SPEC.items.length}`}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
document.getElementById("t").textContent=SPEC.title;
document.getElementById("ident").innerHTML=Object.entries(SPEC.identity).map(([k,v])=>esc(k)+": "+esc(v)).join("<br>");
const m=document.getElementById("m");let sec=null;
for(const it of SPEC.items){if(it.section!==sec){sec=it.section;const h=document.createElement("h2");h.textContent=sec;m.appendChild(h)}
const c=document.createElement("div");c.className="c";
c.innerHTML=`<h3>${esc(it.id)} · ${esc(it.name)}</h3><div><span class="k">Game:</span> ${esc(it.game)}</div>
<div><span class="k">Get there:</span> ${esc(it.where)}</div><div><span class="k">Do:</span> ${esc(it.do)}</div>
<div><span class="k">Expected:</span> ${esc(it.expect)}</div>
<div class="r">${["PASS","FAIL","NOT TESTED"].map(x=>`<button data-v="${x}" class="${x==="NOT TESTED"?"NT":x}">${x}</button>`).join("")}</div>
<textarea placeholder="Comment / bug details"></textarea>`;
const s=st[it.id]||{};const bs=c.querySelectorAll(".r button");
function paint(){bs.forEach(b=>b.classList.toggle("on",(st[it.id]||{}).result===b.dataset.v))}
bs.forEach(b=>b.onclick=()=>{st[it.id]=st[it.id]||{};st[it.id].result=st[it.id].result===b.dataset.v?undefined:b.dataset.v;paint();save()});
const ta=c.querySelector("textarea");ta.value=s.comment||"";ta.oninput=()=>{st[it.id]=st[it.id]||{};st[it.id].comment=ta.value;save()};
paint();m.appendChild(c)}
document.getElementById("exp").onclick=()=>{const out={format:"pokebanknx-quickqa-v1",title:SPEC.title,identity:SPEC.identity,
exported_at:new Date().toISOString(),items:Object.fromEntries(SPEC.items.map(it=>[it.id,{name:it.name,result:(st[it.id]||{}).result||null,comment:(st[it.id]||{}).comment||""}]))};
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:"application/json"}));
a.download="PokeBank-NX-QuickQA-"+SPEC.identity["Source commit"].slice(0,8)+".json";a.click()};
document.getElementById("imp").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);
if(d.identity&&d.identity["NRO SHA-256"]!==SPEC.identity["NRO SHA-256"]&&!confirm("This file is for a different NRO. Import anyway?"))return;
for(const [k,v] of Object.entries(d.items||{}))st[k]={result:v.result||undefined,comment:v.comment||""};save();location.reload()})};
document.getElementById("clr").onclick=()=>{if(confirm("Clear every result and comment?")){st={};save();location.reload()}};
summ();
</script></body></html>

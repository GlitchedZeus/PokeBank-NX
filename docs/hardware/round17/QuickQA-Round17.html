<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>PokeBank NX QuickQA</title>
<style>
:root{--bg:#f6f7f9;--fg:#15171a;--card:#fff;--line:#d9dde3;--mut:#5b6470;--pass:#1f8a3b;--fail:#c62828;--nt:#6b7280;--acc:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#e8eaed;--card:#171a20;--line:#2b303a;--mut:#9aa3ad;--acc:#60a5fa}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;z-index:2}
h1{font-size:17px;margin:0 0 4px}.id{font:12px ui-monospace,monospace;color:var(--mut);word-break:break-all}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
button,label.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:12px 16px 80px}h2{font-size:15px;margin:22px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.c h3{margin:0 0 6px;font-size:15px}.k{color:var(--mut);font-weight:600}
.r{display:flex;gap:6px;margin:8px 0 6px}.r button.on.PASS{background:var(--pass);color:#fff;border-color:var(--pass)}
.r button.on.FAIL{background:var(--fail);color:#fff;border-color:var(--fail)}.r button.on.NT{background:var(--nt);color:#fff;border-color:var(--nt)}
textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);padding:6px;font:inherit}
.sum{font-weight:600}.note{color:var(--mut);font-size:13px}
</style></head><body><header><h1 id="t"></h1><div class="id" id="ident"></div>
<div class="bar"><span class="sum" id="sum"></span><button id="exp">Export JSON</button>
<label class="btn">Import JSON<input type="file" id="imp" accept="application/json" hidden></label>
<button id="clr">Clear all</button></div>
<div class="note">NOT DEVICE TESTED until you test this exact NRO. Focused retest, not the full #313 release acceptance. Results save in this browser automatically.</div>
</header><main id="m"></main>
<script>
const SPEC={"title": "PokeBank NX Round 17 Hardware-Only QuickQA", "identity": {"NRO file": "PokeBank-NX-Gen1-5-Candidate-95d0579b.nro", "NRO SHA-256": "86648d4b500eb4953296560c785193a96527379bb012374fffe01c157950462a", "NRO size": "177,290,929 bytes", "Source commit": "95d0579b307e6af4b423d17232d1d1c55e68ffcf", "Source tree": "87459a0ef5a30365c89d3231563e59f7177f9590", "Build run / artifact": "43571489940 / 14104911047", "Replaces": "231e8497 (never device tested) and 11ea9790 (failed on hardware)", "Status": "NOT DEVICE TESTED"}, "items": [{"id": "H01", "section": "1. Things only a Switch can show", "name": "The app starts and Home draws correctly", "game": "None", "where": "Homebrew Menu (or your forwarder)", "do": "Start PokeBank NX handheld. Look at Home: game cards, artwork, text, footer. Then dock the Switch and look again.", "expect": "No crash or black screen. Nothing clipped, overlapping or missing in handheld or docked mode."}, {"id": "H02", "section": "1. Things only a Switch can show", "name": "Your real saves are found", "game": "Every Gen I-V game you have saves for", "where": "Product Home", "do": "Do NOT delete anything in sdmc:/switch/PokeBank-NX first. Scroll through the game cards.", "expect": "Each game you have a save for has a card. Comment with any game whose save is on the card but not found, and where the file is (emulator and folder)."}, {"id": "H03", "section": "1. Things only a Switch can show", "name": "Save Instances opens a real save (the Round 15 failure)", "game": "Pokémon Yellow or Blue (RetroArch, Gambatte folder)", "where": "Product Home → that game's card", "do": "Press A. If Save Instances appears, pick your save with A.", "expect": "The game opens. If Home later says 'Save choices are kept until PokeBank NX closes; they could not be stored [...]', copy the text in [...] into the comment."}, {"id": "H04", "section": "1. Things only a Switch can show", "name": "The choice survives closing the app", "game": "The game from H03, plus one Gen III, one Gen IV and one Gen V game", "where": "HOME menu", "do": "Open each game once (pick its save if asked). Close PokeBank NX completely. Start it again and press A on each.", "expect": "Every one opens directly, with no chooser."}, {"id": "H05", "section": "1. Things only a Switch can show", "name": "Touch works on the real screen", "game": "Any game", "where": "Boxes", "do": "Tap a Pokémon. Tap an empty slot. Drag across four Pokémon and lift. Tap outside a pop-up.", "expect": "Taps hit what you touched (not a neighbour). The drag selects the group. A tap outside closes the pop-up."}, {"id": "H06", "section": "1. Things only a Switch can show", "name": "Controller: stick, D-pad and held buttons", "game": "Any game", "where": "Boxes, then Items", "do": "Move with the left stick, then with the D-pad. Hold Down for two seconds in a long list. Try a detached Joy-Con or Pro Controller if you have one.", "expect": "Stick and D-pad do the same thing. Holding repeats smoothly and never skips or sticks."}, {"id": "H07", "section": "1. Things only a Switch can show", "name": "RetroArch launch and quit (R04, evidence only)", "game": "Pokémon Red", "where": "Red card → launch the game", "do": "Launch Red from PokeBank NX, then quit RetroArch. Note where you land and any error code. Copy sdmc:/switch/PokeBank-NX/runtime/last-launch.txt and any new file in sdmc:/atmosphere/crash_reports/.", "expect": "Not fixed in this build. Comment: where you landed, the error code, how you start PokeBank NX (Homebrew Menu / Album / forwarder), and attach last-launch.txt."}, {"id": "H08", "section": "1. Things only a Switch can show", "name": "An exported copy loads in the emulator", "game": "Any game", "where": "Edit one item amount → + Review → Export Copy", "do": "Copy the exported save over a COPY of your emulator save (never the original) and start the game in the emulator.", "expect": "The game loads the exported save and shows your change. Your original save is unchanged (same size and date)."}, {"id": "N01", "section": "2. New fixes to confirm on the Switch", "name": "Legacy Storage: Save bank changes? can be answered", "game": "Any Gen I-IV game", "where": "Open the game → Legacy Storage", "do": "Keep the cursor on the LEFT (game save) side. Tap the bank box name on the right and rename it. Press B. Then press Down and A (Discard changes).", "expect": "'Save bank changes?' appears and your answer is taken: you leave Legacy Storage. No Pokémon Actions or Empty Slot menu opens on top of the question."}, {"id": "N02", "section": "2. New fixes to confirm on the Switch", "name": "Profile B cannot see Profile A's backups", "game": "Any game assigned on Profile A", "where": "Profile A: game card → + → Backups → Create backup now", "do": "Switch to Profile B. On the same card press A (chooser), then + (Backups). Then press X (Recovery files).", "expect": "Profile B's Backups and Recovery files do not list Profile A's backup. Back on Profile A, the backup is still listed."}, {"id": "N03", "section": "2. New fixes to confirm on the Switch", "name": "A file named for the other version is refused", "game": "Pokémon Red (or Gold, Ruby, FireRed)", "where": "Red card → chooser → file browser", "do": "Pick a save file whose name says the sibling version (for Red: a file named '... Blue Version ...').", "expect": "Refused: 'the file is named as a Pokemon Blue save; choose it from that game's card'. A file with a neutral name (for example save1.srm) can still be assigned."}, {"id": "N04", "section": "2. New fixes to confirm on the Switch", "name": "Gen V type badges", "game": "Pokémon Black or White 2", "where": "Edit a Ninjask, a Charizard and a Gengar", "do": "Look at the type badges under the portrait.", "expect": "Ninjask Bug/Flying, Charizard Fire/Flying, Gengar Ghost/Poison."}, {"id": "D01", "section": "3. If anything failed", "name": "Send the diagnostics", "game": "Any failing game", "where": "Settings → Enable Debug Logging (ON), then repeat the failing step", "do": "Copy sdmc:/switch/PokeBank-NX/logs/debug_*.log and list the files in sdmc:/switch/PokeBank-NX/config (names and sizes).", "expect": "The log has an 'Assignment storage: ...' line and a line naming the failing step. Attach both. Never delete the config files."}]};const KEY="pokebanknx-quickqa-"+SPEC.identity["Source commit"];
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){st={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}summ()}
function summ(){let p=0,f=0,n=0;for(const it of SPEC.items){const r=(st[it.id]||{}).result;if(r==="PASS")p++;else if(r==="FAIL")f++;else if(r==="NOT TESTED")n++}
document.getElementById("sum").textContent=`PASS ${p} · FAIL ${f} · NOT TESTED ${n} · open ${SPEC.items.length-p-f-n} / ${SPEC.items.length}`}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
document.getElementById("t").textContent=SPEC.title;
document.getElementById("ident").innerHTML=Object.entries(SPEC.identity).map(([k,v])=>esc(k)+": "+esc(v)).join("<br>");
const m=document.getElementById("m");let sec=null;
for(const it of SPEC.items){if(it.section!==sec){sec=it.section;const h=document.createElement("h2");h.textContent=sec;m.appendChild(h)}
const c=document.createElement("div");c.className="c";
c.innerHTML=`<h3>${esc(it.id)} · ${esc(it.name)}</h3><div><span class="k">Game:</span> ${esc(it.game)}</div>
<div><span class="k">Get there:</span> ${esc(it.where)}</div><div><span class="k">Do:</span> ${esc(it.do)}</div>
<div><span class="k">Expected:</span> ${esc(it.expect)}</div>
<div class="r">${["PASS","FAIL","NOT TESTED"].map(x=>`<button data-v="${x}" class="${x==="NOT TESTED"?"NT":x}">${x}</button>`).join("")}</div>
<textarea placeholder="Comment / bug details"></textarea>`;
const s=st[it.id]||{};const bs=c.querySelectorAll(".r button");
function paint(){bs.forEach(b=>b.classList.toggle("on",(st[it.id]||{}).result===b.dataset.v))}
bs.forEach(b=>b.onclick=()=>{st[it.id]=st[it.id]||{};st[it.id].result=st[it.id].result===b.dataset.v?undefined:b.dataset.v;paint();save()});
const ta=c.querySelector("textarea");ta.value=s.comment||"";ta.oninput=()=>{st[it.id]=st[it.id]||{};st[it.id].comment=ta.value;save()};
paint();m.appendChild(c)}
document.getElementById("exp").onclick=()=>{const out={format:"pokebanknx-quickqa-v1",title:SPEC.title,identity:SPEC.identity,
exported_at:new Date().toISOString(),items:Object.fromEntries(SPEC.items.map(it=>[it.id,{name:it.name,result:(st[it.id]||{}).result||null,comment:(st[it.id]||{}).comment||""}]))};
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:"application/json"}));
a.download="PokeBank-NX-QuickQA-"+SPEC.identity["Source commit"].slice(0,8)+".json";a.click()};
document.getElementById("imp").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);
if(d.identity&&d.identity["NRO SHA-256"]!==SPEC.identity["NRO SHA-256"]&&!confirm("This file is for a different NRO. Import anyway?"))return;
for(const [k,v] of Object.entries(d.items||{}))st[k]={result:v.result||undefined,comment:v.comment||""};save();location.reload()})};
document.getElementById("clr").onclick=()=>{if(confirm("Clear every result and comment?")){st={};save();location.reload()}};
summ();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>PokeBank NX QuickQA</title>
<style>
:root{--bg:#f6f7f9;--fg:#15171a;--card:#fff;--line:#d9dde3;--mut:#5b6470;--pass:#1f8a3b;--fail:#c62828;--nt:#6b7280;--acc:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#e8eaed;--card:#171a20;--line:#2b303a;--mut:#9aa3ad;--acc:#60a5fa}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;z-index:2}
h1{font-size:17px;margin:0 0 4px}.id{font:12px ui-monospace,monospace;color:var(--mut);word-break:break-all}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
button,label.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:12px 16px 80px}h2{font-size:15px;margin:22px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.c h3{margin:0 0 6px;font-size:15px}.k{color:var(--mut);font-weight:600}
.r{display:flex;gap:6px;margin:8px 0 6px}.r button.on.PASS{background:var(--pass);color:#fff;border-color:var(--pass)}
.r button.on.FAIL{background:var(--fail);color:#fff;border-color:var(--fail)}.r button.on.NT{background:var(--nt);color:#fff;border-color:var(--nt)}
textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);padding:6px;font:inherit}
.sum{font-weight:600}.note{color:var(--mut);font-size:13px}
</style></head><body><header><h1 id="t"></h1><div class="id" id="ident"></div>
<div class="bar"><span class="sum" id="sum"></span><button id="exp">Export JSON</button>
<label class="btn">Import JSON<input type="file" id="imp" accept="application/json" hidden></label>
<button id="clr">Clear all</button></div>
<div class="note">NOT DEVICE TESTED until you test this exact NRO. Focused retest, not the full #313 release acceptance. Results save in this browser automatically.</div>
</header><main id="m"></main>
<script>
const SPEC={"title": "PokeBank NX Round 16 Recovery QuickQA", "identity": {"NRO file": "PokeBank-NX-Gen1-5-Candidate-231e8497.nro", "NRO SHA-256": "e5ccb0110de68f539521b7e7569dfa479b921a5aec4dbd2142395e18597664a9", "Source commit": "231e84976f86b8c07b0652221f2507481087fc0f", "Source tree": "7314c5535a00f22391765afceb6c313dd9b4c18b", "Build run / artifact": "41581848484 / 13206448035", "NRO size": "177,282,737 bytes", "Replaces": "11ea9790 (failed on hardware: Gen I-IV saves could not be opened)", "Status": "NOT DEVICE TESTED"}, "items": [{"id": "A01", "section": "1. Opening saves again (P0)", "name": "Save Instances opens your Yellow/Blue save (the Round 15 failure)", "game": "Pokémon Yellow (or Blue) with its RetroArch save in sdmc:/retroarch/cores/savefiles/Gambatte", "where": "Product Home → Yellow card", "do": "Do NOT delete anything in sdmc:/switch/PokeBank-NX first. Press A. In Save Instances pick your Yellow save with A.", "expect": "The game opens (hub / Party / Boxes). Never 'Couldn't remember that exact save choice'. If Home later says 'Save choices are kept until PokeBank NX closes; they could not be stored [...]', the game still opened but the choice was not saved: copy the text in [...] into the comment."}, {"id": "A02", "section": "1. Opening saves again (P0)", "name": "SD browser opens the same .srm", "game": "Pokémon Yellow", "where": "Yellow card → + → Source / Game File → − Forget → Y, then A → file browser", "do": "In the browser open Gambatte and pick the Yellow .srm.", "expect": "The game opens. Never 'The save assignment could not be stored safely'. Any failure now shows the reason in [...]: copy it into the comment."}, {"id": "A03", "section": "1. Opening saves again (P0)", "name": "Assignment survives a restart", "game": "Pokémon Yellow and Blue", "where": "HOME menu", "do": "Close PokeBank NX completely from the HOME menu. Start it again. Press A on Yellow, then B, then A on Blue.", "expect": "Both open directly, no chooser. (If Home showed 'Save choices are kept until PokeBank NX closes', the chooser appearing again here is expected: say so.)"}, {"id": "A04", "section": "1. Opening saves again (P0)", "name": "Every route opens the same save", "game": "Pokémon Yellow", "where": "Product Home → Yellow card", "do": "Press A, then B. Press +, then B. Press Items on the HOME dock, then B. Open Yellow from Quick Games.", "expect": "Every route opens your Yellow save. None shows a chooser or another save."}, {"id": "A05", "section": "1. Opening saves again (P0)", "name": "Gen II and Gen III open", "game": "Pokémon Crystal (or Gold/Silver) and FireRed (or any Gen III)", "where": "Product Home", "do": "For each card press A; if Save Instances appears, pick your save.", "expect": "Both open. Restart PokeBank: both open directly."}, {"id": "A06", "section": "1. Opening saves again (P0)", "name": "Gen IV opens", "game": "Pokémon Platinum (or any Gen IV you have)", "where": "Product Home → Gen IV card", "do": "Press A. If the chooser appears, pick your save (Save Instances or file browser).", "expect": "The game opens; after a restart it opens directly."}, {"id": "A07", "section": "1. Opening saves again (P0)", "name": "Gen V assignments kept", "game": "Pokémon Black / White / Black 2 / White 2 you assigned before", "where": "Product Home", "do": "Press A on each Gen V card you used before.", "expect": "Each opens its previously assigned save without asking again (or, if never assigned, assigning works and opens)."}, {"id": "A08", "section": "1. Opening saves again (P0)", "name": "Profile B never opens Profile A's saves", "game": "Pokémon Yellow", "where": "Tap the profile icon → switch to Profile B", "do": "Press A on Yellow. Then switch back to Profile A and press A on Yellow.", "expect": "Profile B: chooser or 'already linked to another profile', never Profile A's save. Profile A: opens directly."}, {"id": "A09", "section": "1. Opening saves again (P0)", "name": "Forget then reassign", "game": "Pokémon Blue", "where": "Blue card → + → Source / Game File", "do": "Press − (Forget), read the question, press Y. Back Home press A on Blue and pick the save again.", "expect": "Forget removes only the app's link (the .srm keeps its size and date). Picking it again opens Blue."}, {"id": "A10", "section": "1. Opening saves again (P0)", "name": "Wrong game is refused", "game": "Pokémon White and a White 2 save (or Red with a Crystal save)", "where": "White card → chooser → file browser", "do": "Pick the other game's save file.", "expect": "Refused with a reason; nothing opens; the file is unchanged."}, {"id": "A11", "section": "1. Opening saves again (P0)", "name": "If anything above failed: diagnostics", "game": "Any failing game", "where": "Settings → Enable Debug Logging (ON), then repeat the failing step", "do": "After reproducing, copy sdmc:/switch/PokeBank-NX/logs/debug_*.log and list the files in sdmc:/switch/PokeBank-NX/config (names and sizes, including any legacy_source_bindings.cfg.corrupt-1).", "expect": "The log has a line 'Assignment storage: bindings db=... load=... probe=...' and an 'Assignment (...)' line naming the failing step. Attach both. Never delete the config files."}, {"id": "V01", "section": "2. Gen V fixes", "name": "Ninjask shows Bug/Flying", "game": "Pokémon Black (any Gen V)", "where": "A Ninjask (or Add Pokémon → Ninjask) → Edit", "do": "Look at the type badges under the portrait. Also check Fearow (Normal/Flying), Arbok (Poison), Gengar (Ghost/Poison), Charizard (Fire/Flying).", "expect": "Ninjask Bug/Flying (not Ghost/Flying). Fire, Water and the other types now show their badges too."}, {"id": "V02", "section": "2. Gen V fixes", "name": "Gender edit keeps shininess", "game": "Pokémon Black or White 2", "where": "Edit a SHINY Pokémon with both genders (e.g. Shiny Pikachu) → Gender row", "do": "Press A on Gender. Read the status line. Check the Shiny row and sprite. Press A on Gender again.", "expect": "Gender changes, still Shiny, nature and ability unchanged, and the line says so. If it ever could not keep them, it says 'Gender not changed: it would also change ...' and nothing changes."}, {"id": "V03", "section": "2. Gen V fixes", "name": "Met Location for species not found in Black", "game": "Pokémon Black", "where": "Add Pokémon → Ninjask (then Fearow, Arbok) Lv 5 → Met Location", "do": "Read the default list, then open 'Unknown location' (the unverified list).", "expect": "Default list: only None / Link Trade / Unknown location (none of these species is caught in the wild in Black). No wild route is presented as verified. Comment if you expected a specific place."}, {"id": "V04", "section": "2. Gen V fixes", "name": "White 2 / Black 2 Add and Import unchanged", "game": "Pokémon White 2 (after an in-game save) and Black 2", "where": "Boxes → empty slot", "do": "Press A (Add Pokémon), B, then X (Import from file).", "expect": "Add Pokémon is offered; Import lists only .pk5/.ek5. A first-boot White 2 (no in-game save) offers neither and says why."}, {"id": "R01", "section": "3. RetroArch quit (unresolved, evidence only)", "name": "RetroArch quit diagnostic", "game": "Pokémon Red", "where": "Red card → launch the game", "do": "Launch Red from PokeBank, then quit RetroArch. Note where you land and any error code. Copy sdmc:/switch/PokeBank-NX/runtime/last-launch.txt and any new file in sdmc:/atmosphere/crash_reports/.", "expect": "Not fixed in this build. This only collects evidence: where you landed, the error code, how you start PokeBank (Homebrew Menu / Album / forwarder), and last-launch.txt."}]};const KEY="pokebanknx-quickqa-"+SPEC.identity["Source commit"];
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){st={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}summ()}
function summ(){let p=0,f=0,n=0;for(const it of SPEC.items){const r=(st[it.id]||{}).result;if(r==="PASS")p++;else if(r==="FAIL")f++;else if(r==="NOT TESTED")n++}
document.getElementById("sum").textContent=`PASS ${p} · FAIL ${f} · NOT TESTED ${n} · open ${SPEC.items.length-p-f-n} / ${SPEC.items.length}`}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
document.getElementById("t").textContent=SPEC.title;
document.getElementById("ident").innerHTML=Object.entries(SPEC.identity).map(([k,v])=>esc(k)+": "+esc(v)).join("<br>");
const m=document.getElementById("m");let sec=null;
for(const it of SPEC.items){if(it.section!==sec){sec=it.section;const h=document.createElement("h2");h.textContent=sec;m.appendChild(h)}
const c=document.createElement("div");c.className="c";
c.innerHTML=`<h3>${esc(it.id)} · ${esc(it.name)}</h3><div><span class="k">Game:</span> ${esc(it.game)}</div>
<div><span class="k">Get there:</span> ${esc(it.where)}</div><div><span class="k">Do:</span> ${esc(it.do)}</div>
<div><span class="k">Expected:</span> ${esc(it.expect)}</div>
<div class="r">${["PASS","FAIL","NOT TESTED"].map(x=>`<button data-v="${x}" class="${x==="NOT TESTED"?"NT":x}">${x}</button>`).join("")}</div>
<textarea placeholder="Comment / bug details"></textarea>`;
const s=st[it.id]||{};const bs=c.querySelectorAll(".r button");
function paint(){bs.forEach(b=>b.classList.toggle("on",(st[it.id]||{}).result===b.dataset.v))}
bs.forEach(b=>b.onclick=()=>{st[it.id]=st[it.id]||{};st[it.id].result=st[it.id].result===b.dataset.v?undefined:b.dataset.v;paint();save()});
const ta=c.querySelector("textarea");ta.value=s.comment||"";ta.oninput=()=>{st[it.id]=st[it.id]||{};st[it.id].comment=ta.value;save()};
paint();m.appendChild(c)}
document.getElementById("exp").onclick=()=>{const out={format:"pokebanknx-quickqa-v1",title:SPEC.title,identity:SPEC.identity,
exported_at:new Date().toISOString(),items:Object.fromEntries(SPEC.items.map(it=>[it.id,{name:it.name,result:(st[it.id]||{}).result||null,comment:(st[it.id]||{}).comment||""}]))};
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:"application/json"}));
a.download="PokeBank-NX-QuickQA-"+SPEC.identity["Source commit"].slice(0,8)+".json";a.click()};
document.getElementById("imp").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);
if(d.identity&&d.identity["NRO SHA-256"]!==SPEC.identity["NRO SHA-256"]&&!confirm("This file is for a different NRO. Import anyway?"))return;
for(const [k,v] of Object.entries(d.items||{}))st[k]={result:v.result||undefined,comment:v.comment||""};save();location.reload()})};
document.getElementById("clr").onclick=()=>{if(confirm("Clear every result and comment?")){st={};save();location.reload()}};
summ();
</script></body></html>

name: One-shot hardware repair

on:
  push:
    branches:
      - feature/gen4-full-editor-20260928
    paths:
      - '.github/workflows/one-shot-hardware-repair.yml'
      - 'tools/one_shot_hardware_repair.py'
      - 'tools/one_shot_hardware_contract_repair.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: feature/gen4-full-editor-20260928
          fetch-depth: 20
          submodules: recursive

      - name: Apply guarded repair and focused tests
        run: |
          set -euo pipefail
          python3 tools/one_shot_hardware_repair.py
          python3 tools/one_shot_hardware_contract_repair.py
          git diff --check
          make -f Makefile.host build-host/test_game_launch_model
          ./build-host/test_game_launch_model
          make -f Makefile.host product-ui-test
          python3 tests/test_game_hub_contract.py

      - name: Commit repair and remove helpers
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-hardware-repair.yml
          rm -f tools/one_shot_hardware_repair.py tools/one_shot_hardware_contract_repair.py
          git diff --check
          git config user.name 'GlitchedZeus'
          git config user.email 'user91746@protonmail.com'
          git add -A
          git commit -m 'fix(ui): repair hardware launch resolution and quick preview'
          git push origin HEAD:feature/gen4-full-editor-20260928

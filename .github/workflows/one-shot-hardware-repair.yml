name: One-shot hardware launch repair

on:
  pull_request:
    branches:
      - integration/gen4-polish-hardware-20260928
    paths:
      - '.github/workflows/one-shot-hardware-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokebank-one-shot-hardware-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: feature/gen4-full-editor-20260928
          fetch-depth: 20
          submodules: recursive

      - name: Apply bounded hardware repair
        env:
          EXPECTED_PARENT: eeda23c0f45689d480574b54001db106cb9fafdb
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one repair target, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1) Normalize the official Pokémon spelling in ROM/save stems. Hardware Red/Blue
          # playlists can contain UTF-8 é; dropping those bytes produced "pokmon..." and made the
          # release-specific matcher miss a perfectly valid ROM.
          replace_once(
              "include/UI/GameLaunchModel.h",
              '''    for (size_t i = first; i < last; ++i) {
        const unsigned char c = static_cast<unsigned char>(path[i]);
        if (std::isalnum(c)) out.push_back(static_cast<char>(std::tolower(c)));
    }
    return out;
}''',
              '''    for (size_t i = first; i < last; ++i) {
        const unsigned char c = static_cast<unsigned char>(path[i]);
        // ROM libraries and RetroArch playlists commonly use the official “Pokémon” spelling.
        // Normalize UTF-8 é/É instead of dropping both bytes and turning it into “pokmon”.
        if (c == 0xC3 && i + 1 < last) {
            const unsigned char next = static_cast<unsigned char>(path[i + 1]);
            if (next == 0xA9 || next == 0x89) {
                out.push_back('e');
                ++i;
                continue;
            }
        }
        if (c < 0x80 && std::isalnum(c))
            out.push_back(static_cast<char>(std::tolower(c)));
    }
    return out;
}''')

          # Give multiple valid content candidates a deterministic strength score. The matcher is
          # still the safety boundary; scoring can only rank paths already proven to match the exact
          # release identity, so Red/FireRed and Gold/HeartGold remain collision-safe.
          replace_once(
              "include/UI/GameLaunchModel.h",
              '''    return compact.size() >= 5 && candidate.find(compact) != std::string::npos;
}

inline std::string gameLaunchBindingFamilyPrefix''',
              '''    return compact.size() >= 5 && candidate.find(compact) != std::string::npos;
}

inline int gameLaunchCandidateScore(std::string_view gameId,
                                    std::string_view savePath,
                                    std::string_view contentPath) {
    if (!gameLaunchContentSupported(gameId, contentPath) ||
        !gameLaunchCandidateStemMatches(gameId, savePath, contentPath))
        return -1;

    const std::string wanted = normalizedLaunchStem(savePath);
    const std::string candidate = normalizedLaunchStem(contentPath);
    int score = 100;
    if (!wanted.empty() && candidate == wanted) {
        score += 10000;
    } else if (!wanted.empty()) {
        if (candidate.find(wanted) != std::string::npos ||
            wanted.find(candidate) != std::string::npos)
            score += 4000;
        size_t prefix = 0;
        while (prefix < wanted.size() && prefix < candidate.size() &&
               wanted[prefix] == candidate[prefix]) ++prefix;
        score += static_cast<int>(std::min<size_t>(prefix, 200) * 4);
    }

    // For DS providers prefer the raw ROM and the emulator-owned library over duplicate archives
    // or generic mirrors. A genuine equal-strength tie still fails closed and is shown in-app.
    if (gameId.size() >= 4 && gameId.substr(gameId.size() - 4) == "_nds") {
        const std::string ext = lowerLaunchExtension(contentPath);
        if (ext == ".nds") score += 600;
        else if (ext == ".zip") score += 250;
        else if (ext == ".rar") score += 150;

        std::string lower(contentPath);
        std::transform(lower.begin(), lower.end(), lower.begin(),
            [](unsigned char c) { return static_cast<char>(std::tolower(c)); });
        if (lower.find("/switch/drastic/games/") != std::string::npos) score += 900;
        else if (lower.find("/switch/drastic/roms/") != std::string::npos) score += 800;
        else if (lower.find("/roms/nds/") != std::string::npos) score += 500;
    }
    return score;
}

inline std::string gameLaunchBindingFamilyPrefix''')

          # 2) Rank multiple RetroArch/DraStic candidates instead of rejecting all plurality.
          replace_once(
              "src/UI/GameLauncher.cpp",
              '''        if (matches.size() == 1) {
            result.contentPath = std::move(matches.front().content);
            result.corePath = std::move(matches.front().core);
            result.state = GameLaunchState::Ready;
            result.detail = "RetroArch playlist matched this save to its game file and core.";
            return result;
        }
        if (matches.size() > 1) {
            result.detail =
                "More than one matching RetroArch game/core entry was found; link the exact game file.";
        } else if (sawFamilyCompatibleContent) {''',
              '''        if (!matches.empty()) {
            int bestScore = -1;
            size_t bestIndex = 0;
            bool tiedContent = false;
            for (size_t i = 0; i < matches.size(); ++i) {
                int score = gameLaunchCandidateScore(gameId, sourcePath, matches[i].content);
                if (matches[i].core == result.corePath) score += 25;
                if (score > bestScore) {
                    bestScore = score;
                    bestIndex = i;
                    tiedContent = false;
                } else if (score == bestScore &&
                           matches[i].content != matches[bestIndex].content) {
                    tiedContent = true;
                }
            }
            if (bestScore >= 0 && !tiedContent) {
                result.contentPath = matches[bestIndex].content;
                result.corePath = matches[bestIndex].core;
                result.state = GameLaunchState::Ready;
                result.detail = matches.size() == 1
                    ? "RetroArch playlist matched this save to its game file and core."
                    : "Selected the strongest exact-release RetroArch playlist match.";
                return result;
            }
        }
        if (matches.size() > 1) {
            result.detail =
                "More than one equally strong RetroArch game match remains; choose the exact game file.";
        } else if (sawFamilyCompatibleContent) {''')

          replace_once(
              "src/UI/GameLauncher.cpp",
              '''    if (matches.size() == 1)
        return directDescriptor(kind, gameId, providerId, launcher, matches.front(),
                                "Matched the validated save to its game file.");

    GameLaunchDescriptor result;''',
              '''    if (matches.size() == 1)
        return directDescriptor(kind, gameId, providerId, launcher, matches.front(),
                                "Matched the validated save to its game file.");

    if (matches.size() > 1) {
        int bestScore = -1;
        size_t bestIndex = 0;
        bool tied = false;
        for (size_t i = 0; i < matches.size(); ++i) {
            const int score = gameLaunchCandidateScore(gameId, sourcePath, matches[i]);
            if (score > bestScore) {
                bestScore = score;
                bestIndex = i;
                tied = false;
            } else if (score == bestScore && matches[i] != matches[bestIndex]) {
                tied = true;
            }
        }
        if (bestScore >= 0 && !tied)
            return directDescriptor(kind, gameId, providerId, launcher, matches[bestIndex],
                                    "Selected the strongest exact-release game-file match.");
    }

    GameLaunchDescriptor result;''')

          # If RetroArch cannot resolve a playlist on hardware, an exact installed HOME forwarder
          # is a safe release-specific fallback. This is only reached on explicit ZR launch after
          # provider resolution has already failed, so it does not reintroduce navigation scans.
          replace_once(
              "src/UI/GameLauncher.cpp",
              '''    if (kind == GameLaunchProviderKind::RetroArch)
        return resolveRetroArch(gameId, sourcePath, bindingKey);
    if (kind == GameLaunchProviderKind::MGBA ||''',
              '''    if (kind == GameLaunchProviderKind::RetroArch) {
        auto resolved = resolveRetroArch(gameId, sourcePath, bindingKey);
#ifdef __SWITCH__
        if (resolved.state == GameLaunchState::NeedsContentLink) {
            if (const uint64_t forwarderTitle = installedGameForwarderTitle(gameId);
                forwarderTitle != 0) {
                GameLaunchDescriptor forwarder;
                forwarder.backend = GameLaunchBackend::SwitchTitle;
                forwarder.titleId = forwarderTitle;
                forwarder.providerId = std::string(providerId);
                forwarder.state = GameLaunchState::Ready;
                forwarder.detail = "Launch the installed HOME forwarder for this exact game.";
                return forwarder;
            }
        }
#endif
        return resolved;
    }
    if (kind == GameLaunchProviderKind::MGBA ||''')

          # Restore the historically working Switch direct-core handoff first. Keep the frontend
          # -L path as a synchronous fallback if hbloader rejects the direct target.
          replace_once(
              "src/UI/GameLauncher.cpp",
              '''        std::string argv = quoted(descriptor.launcherPath);
        if (descriptor.state != GameLaunchState::LauncherOnly && !descriptor.corePath.empty())
            argv += " -L " + quoted(descriptor.corePath);
        if (descriptor.state != GameLaunchState::LauncherOnly && !descriptor.contentPath.empty())
            argv += " " + quoted(descriptor.contentPath);
        const Result rc = envSetNextLoad(descriptor.launcherPath.c_str(), argv.c_str());
        if (R_FAILED(rc)) {
            char buf[96];
            std::snprintf(buf, sizeof(buf), "RetroArch game launch failed (0x%08X).", static_cast<unsigned>(rc));
            error = buf;
            return false;
        }
        return true;''',
              '''        if (descriptor.state != GameLaunchState::LauncherOnly &&
            !descriptor.corePath.empty()) {
            std::string coreArgv = quoted(descriptor.corePath);
            if (!descriptor.contentPath.empty())
                coreArgv += " " + quoted(descriptor.contentPath);
            const Result directRc = envSetNextLoad(descriptor.corePath.c_str(), coreArgv.c_str());
            if (R_SUCCEEDED(directRc)) return true;
        }

        // Compatibility fallback: some hbloader/RetroArch combinations prefer entering through
        // the frontend and selecting the libretro core with -L.
        std::string argv = quoted(descriptor.launcherPath);
        if (descriptor.state != GameLaunchState::LauncherOnly && !descriptor.corePath.empty())
            argv += " -L " + quoted(descriptor.corePath);
        if (descriptor.state != GameLaunchState::LauncherOnly && !descriptor.contentPath.empty())
            argv += " " + quoted(descriptor.contentPath);
        const Result rc = envSetNextLoad(descriptor.launcherPath.c_str(), argv.c_str());
        if (R_FAILED(rc)) {
            char buf[96];
            std::snprintf(buf, sizeof(buf), "RetroArch game launch failed (0x%08X).", static_cast<unsigned>(rc));
            error = buf;
            return false;
        }
        return true;''')

          # 3) Quick Games must restore the real selected save presentation, but without launch
          # target discovery. Keep the cache call to preserve the existing non-I/O contract, then
          # use the same presentation-only refresh already proven by Product Home L/R navigation.
          replace_once(
              "src/UI/SaveSelectScreen.cpp",
              '''                    // Quick Games is selection/navigation only. Never mount a save, parse a
                    // provider, scan HOME applications, or resolve ROMs on the A-button frame.
                    refreshHubSelectionFromCache();
                    overlay = Overlay::None;''',
              '''                    // Keep launch discovery off the A-button frame, but hydrate the selected
                    // game's real trainer/dex/party presentation just like Product Home L/R.
                    refreshHubSelectionFromCache();
                    overlay = Overlay::None;
                    refreshHubPreview(false);''')

          # 4) NeedsContentLink must never be a dead-end. If automatic ranking cannot prove one
          # exact file, open the existing safe in-app file picker directly from ZR.
          replace_once(
              "src/UI/SaveSelectScreen.cpp",
              '''        if (launchDescriptor.state == GameLaunchState::NeedsContentLink) {
            hubNotice = launchDescriptor.detail.empty()
                ? "Direct launch could not resolve this game's ROM. Use X / Save-Source to set it up."
                : launchDescriptor.detail;
            return false;
        }''',
              '''        if (launchDescriptor.state == GameLaunchState::NeedsContentLink) {
            const std::string launchProblem = launchDescriptor.detail.empty()
                ? "Direct launch could not prove one exact game file. Choose it once."
                : launchDescriptor.detail;
            if (beginLaunchLinkForCurrentTitle()) {
                launchFileNotice = launchProblem;
                return false;
            }
            hubNotice = launchProblem;
            return false;
        }''')
          PY

          git diff --check
          make -f Makefile.host build-host/test_game_launch_model
          ./build-host/test_game_launch_model
          make -f Makefile.host product-ui-test
          python3 tests/test_game_hub_contract.py

      - name: Commit repair and remove helper
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-hardware-repair.yml
          git diff --check
          git config user.name "GlitchedZeus"
          git config user.email "user91746@protonmail.com"
          git add include/UI/GameLaunchModel.h src/UI/GameLauncher.cpp src/UI/SaveSelectScreen.cpp .github/workflows/one-shot-hardware-repair.yml
          git commit -m "fix(ui): repair hardware launch resolution and quick preview"
          git push origin HEAD:feature/gen4-full-editor-20260928

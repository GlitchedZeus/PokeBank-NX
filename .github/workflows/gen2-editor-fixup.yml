name: Gen II Editor Finish Patch

on:
  push:
    branches:
      - dev/gen2-pokemon-editor-20260912

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[gen2-finish-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final deterministic milestone patch
        run: python3 tools/dev_finish_gen2_milestone.py
      - name: Commit patch if needed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "PokeBank NX CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            Makefile.host Makefile.host.gsc Makefile.host.machine \
            include/Save/EditableSaveCapabilities.h include/UI/TrainerViewScreen.h \
            include/Names/MachineDisplay.h \
            src/Integration/Gen2/Gen2StagedEditor.cpp src/Names/TMMoves.cpp src/Names/MachineDisplay.cpp \
            src/UI/TrainerViewScreenGSCOverlay.cpp src/UI/Panels/ItemsPanel.cpp src/UI/Dialogs/PickerDialog.cpp \
            src/UI/Dialogs/SaveConfirmDialog.cpp tests/test_gsc_pokemon_editor.cpp tests/test_machine_display.cpp
          git commit -m "gen2: finish boxed pokemon UI and machine names [gen2-finish-applied]"
          git push origin HEAD:dev/gen2-pokemon-editor-20260912

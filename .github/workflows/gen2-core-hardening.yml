name: Gen II Core Hardening Patch

on:
  push:
    branches:
      - dev/gen2-pokemon-editor-20260912

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic hardening patch
        run: python3 tools/dev_gen2_core_hardening.py
      - name: Commit patch if needed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- src/Integration/Gen2/Gen2StagedEditor.cpp include/Integration/Gen2/Gen2StagedEditor.h Makefile.host.editor tests/test_gsc_pokemon_editor.cpp; then
            exit 0
          fi
          git config user.name "PokeBank NX CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/Integration/Gen2/Gen2StagedEditor.cpp include/Integration/Gen2/Gen2StagedEditor.h Makefile.host.editor tests/test_gsc_pokemon_editor.cpp
          git commit -m "gen2: harden text encoding and creation defaults"
          git push origin HEAD:dev/gen2-pokemon-editor-20260912

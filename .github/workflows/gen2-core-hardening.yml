name: Gen II Acceptance Test Hardening

on:
  push:
    branches:
      - dev/gen2-pokemon-editor-20260912

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[gen2-tests-hardened]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final acceptance test hardening
        run: python3 tools/dev_gen2_test_hardening.py
      - name: Commit patch if needed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- tests/test_gsc_pokemon_editor.cpp tests/test_machine_display.cpp; then
            exit 0
          fi
          git config user.name "PokeBank NX CI"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_gsc_pokemon_editor.cpp tests/test_machine_display.cpp
          git commit -m "test: harden gen2 pokemon and machine acceptance [gen2-tests-hardened]"
          git push origin HEAD:dev/gen2-pokemon-editor-20260912

name: One-time native touch runtime v4

on:
  push:
    branches: [feature/touch-controls-20261005]
    paths:
      - .github/workflows/one-time-native-touch-runtime-v4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact branch head
        run: |
          set -euo pipefail
          git fetch origin feature/touch-controls-20261005
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/feature/touch-controls-20261005)" = "$GITHUB_SHA"
      - name: Apply exact direct-touch transform
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/one-time-native-touch-direct-v2.yml').read_text().splitlines()
          body=[]; capture=False
          for line in src:
              if line == "          python3 - <<'PY'": capture=True; continue
              if capture and line == '          PY': break
              if capture: body.append(line[10:] if line.startswith('          ') else line)
          script='\n'.join(body)+'\n'
          needle="bad = [x for x in stale if x in s]\n"
          fix="s = s.replace('        g_touchCardHits.clear();\\n', '')\ns = s.replace('        g_touchCardAccum.clear();\\n', '')\n"
          if needle not in script: raise SystemExit('v2 guard anchor missing')
          Path('/tmp/direct_touch.py').write_text(script.replace(needle,fix+needle,1))
          PY
          python3 /tmp/direct_touch.py
          git diff --check
          ! grep -R -n -E 'TouchCardHit|g_touchCardAccum|g_touchCardHits|g_productHomeCardTap|g_cardTapQueue|queueSpatialCardTap|emitQueuedCardTap|coordinateRank' include/UI src/UI
      - name: Commit runtime files only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include/UI/ScreenChrome.h include/UI/AppShellScreen.h src/UI/AppShellScreen.cpp src/UI/SaveSelectScreen.cpp src/UI/ClassicInventoryOverlay.cpp
          git diff --cached --quiet && { echo 'No direct-touch runtime changes'; exit 1; }
          git commit -m 'feat(ui): replace controller-emulated touch with direct touch'
          git push origin HEAD:feature/touch-controls-20261005

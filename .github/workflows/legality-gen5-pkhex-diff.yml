name: Gen V legality vs PKHeX

# Gen V (Black, White, Black 2, White 2) PK5 legality:
#  - the generated tables match the pinned PKHeX.Core sources,
#  - the PKHeX-backed fixture, malformed-record and fuzz tests pass with GCC and
#    Clang, normal and ASan/UBSan,
#  - a libFuzzer run finds no crash, sanitizer report or input write,
#  - every Gen V encounter, in-game trade (all languages) and PGF card PKHeX can build,
#    Gen III/IV encounters converted the way Pal Park / Poke Transfer do, grown copies
#    and single-field mutations of each get no false Invalid and no false Valid
#    ("No problems found" where PKHeX rejects) from PokeBank NX against PKHeX.Core's
#    own verdict, and the text helpers and the Gen III/IV trade-name table agree with
#    .NET / PKHeX.

on:
  pull_request:
    paths:
      - 'src/Legality/Gen5*'
      - 'include/Legality/Gen5*'
      # Gen III/IV-origin transfers are checked by the Gen IV analyzer (Gen4::analyzeOrigin5).
      - 'src/Legality/Gen4Legality*'
      - 'include/Legality/Gen4Legality*'
      - 'include/Legality/Legality.h'
      - 'include/Encryption/Encryption5.h'
      - 'src/Names/SpeciesNames.cpp'
      - 'tests/test_legality_gen5.cpp'
      - 'tests/test_legality_gen5_adapter.cpp'
      - 'tests/legality_gen5_test_helpers.h'
      - 'tests/fuzz/fuzz_legality_gen5.cpp'
      - 'tools/gen_legality_gen5_data.py'
      - 'tools/pkhex_gen5_diff/**'
      - 'Makefile.host.gen5-legality'
      - '.github/workflows/legality-gen5-pkhex-diff.yml'
  workflow_dispatch:

concurrency:
  group: legality-gen5-pkhex-diff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PKHEX_SHA: 6501f0ab46e8f8ca048539dbaf8cae8cb104e722

jobs:
  gen5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kwsch/PKHeX
          ref: ${{ env.PKHEX_SHA }}
          path: _ref/PKHeX
          persist-credentials: false
      - name: Exact heads
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C _ref/PKHeX rev-parse HEAD)" = "$PKHEX_SHA"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generated Gen V tables are up to date
        run: python3 -I tools/gen_legality_gen5_data.py --pkhex _ref/PKHeX --check

      - name: Gen V tests (GCC and Clang, normal and ASan/UBSan)
        run: |
          set -euo pipefail
          for cxx in g++ clang++; do
            make -f Makefile.host CXX=$cxx HOST_BUILD=build/host-$cxx \
              build/host-$cxx/test_legality_gen5 build/host-$cxx/test_legality_gen5_sanitize \
              build/host-$cxx/test_legality_gen5_adapter build/host-$cxx/test_legality_gen5_adapter_sanitize
            GEN5_FUZZ_ROUNDS=200000 build/host-$cxx/test_legality_gen5
            GEN5_FUZZ_ROUNDS=50000 build/host-$cxx/test_legality_gen5_adapter
            ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
              build/host-$cxx/test_legality_gen5_sanitize
            ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
              build/host-$cxx/test_legality_gen5_adapter_sanitize
          done

      - name: libFuzzer (Clang, ASan/UBSan, 10 minutes)
        run: |
          set -euo pipefail
          sudo apt-get install -y libclang-rt-18-dev
          clang++ -std=c++20 -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=undefined -Iinclude \
            tests/fuzz/fuzz_legality_gen5.cpp src/Legality/Gen5Legality.cpp src/Legality/Gen5LegalityData.cpp \
            src/Legality/Gen5Text.cpp src/Names/SpeciesNames.cpp src/Names/MoveNames.cpp src/Pokemon/Experience.cpp \
            src/Legality/Gen4Legality.cpp src/Legality/Gen4LegalityData.cpp src/Legality/Gen4LegalityEncounters.cpp \
            src/Legality/Gen4LegalityMoves.cpp src/Legality/Gen4LegalityPalPark.cpp src/Legality/Gen4LegalityRng.cpp \
            src/Legality/Gen4LegalityText.cpp src/Legality/Gen3Legality.cpp src/Legality/Gen3LegalityData.cpp \
            src/Legality/Gen3LegalityDataCxd.cpp -o build/fuzz_gen5
          mkdir -p build/fuzz_corpus
          python3 -I -c "import re,sys; [open(f'build/fuzz_corpus/s{i}','wb').write(b'\0'+bytes.fromhex(h)) for i,h in enumerate(re.findall(r'\"([0-9A-F]{272})\"', open('tests/test_legality_gen5.cpp').read()))]"
          build/fuzz_gen5 -max_total_time=600 -max_len=221 build/fuzz_corpus

      - name: PK5 verdicts against PKHeX (native, trades, events, transfers; 4 seeds)
        run: |
          set -euo pipefail
          for seed in 1 2 7 11; do
            tools/pkhex_gen5_diff/run.sh _ref/PKHeX "$seed" 4
          done

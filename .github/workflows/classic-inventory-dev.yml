name: Classic Inventory Dev Validation

on:
  push:
    branches:
      - dev/classic-inventory-20260912

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identity
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
      - name: Catalog tests
        run: make -f Makefile.host.classic_inventory host-classic-inventory
      - name: Diff check
        run: git diff --check HEAD^

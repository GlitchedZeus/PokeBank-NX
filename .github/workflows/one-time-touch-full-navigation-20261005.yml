name: ONE-TIME full touch navigation tranche

on:
  push:
    branches:
      - feature/touch-controls-20261005
    paths:
      - '.github/workflows/one-time-touch-full-navigation-20261005.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live touch branch
        uses: actions/checkout@v4
        with:
          ref: feature/touch-controls-20261005
          fetch-depth: 0

      - name: Apply natural touch navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/touch-full-navigation-patch.py
          git diff --check
          grep -q 'navTouchButton(touch, true)' src/UI/AppShellScreen.cpp
          grep -q 'navTouchButton(touch, true)' src/UI/BackupSelectionScreen.cpp
          grep -q 'navTouchButton(touch, true)' src/UI/SaveSelectScreen.cpp
          grep -q 'kContentSwipeDistance = 72' include/UI/ScreenChrome.h
          grep -q 'Touch the cover itself to choose it' src/UI/SaveSelectScreen.cpp

      - name: Commit touch tranche and clean temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/touch-full-navigation-patch.py
          rm .github/workflows/one-time-touch-full-navigation-20261005.yml
          git config user.name 'PokeBank NX CI'
          git config user.email 'actions@users.noreply.github.com'
          git add include/UI/ScreenChrome.h src/UI/AppShellScreen.cpp src/UI/BackupSelectionScreen.cpp src/UI/SaveSelectScreen.cpp .github/touch-full-navigation-patch.py .github/workflows/one-time-touch-full-navigation-20261005.yml
          git commit -m 'feat(ui): add natural touch navigation'
          git push origin HEAD:feature/touch-controls-20261005

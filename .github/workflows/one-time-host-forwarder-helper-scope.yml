name: One-time host forwarder helper scope fix

on:
  push:
    branches:
      - feature/gen4-full-editor-20260928
    paths:
      - .github/workflows/one-time-host-forwarder-helper-scope.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live branch
        uses: actions/checkout@v4
        with:
          ref: feature/gen4-full-editor-20260928
          fetch-depth: 0

      - name: Preserve live head and scope Switch-only helpers
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/gen4-full-editor-20260928
          git checkout feature/gen4-full-editor-20260928
          git merge --ff-only origin/feature/gen4-full-editor-20260928
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/UI/GameLauncher.cpp')
          text = p.read_text(encoding='utf-8')
          start = '\n\nstd::string compactGameTitle(std::string_view value) {'
          boundary = '\n#ifdef __SWITCH__\nstruct InstalledApplicationName {'
          if start not in text:
              raise SystemExit('compactGameTitle boundary not found; refusing blind edit')
          if boundary not in text:
              raise SystemExit('InstalledApplicationName boundary not found; refusing blind edit')
          text = text.replace(start, '\n\n#ifdef __SWITCH__\nstd::string compactGameTitle(std::string_view value) {', 1)
          text = text.replace(boundary, '\nstruct InstalledApplicationName {', 1)
          p.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- src/UI/GameLauncher.cpp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/UI/GameLauncher.cpp
          git commit -m 'fix(build): scope forwarder helpers to Switch'
          git push origin HEAD:feature/gen4-full-editor-20260928

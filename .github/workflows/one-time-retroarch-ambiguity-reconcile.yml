name: One-time RetroArch ambiguity reconcile

on:
  push:
    branches:
      - feature/gen4-full-editor-20260928
    paths:
      - tools/retroarch_ambiguity_reconcile_trigger.txt

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gen4-full-editor-20260928
          fetch-depth: 0

      - name: Verify exact forward ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 408a56446f9dda611732c8186d6ce4148100d65f HEAD
          git merge-base --is-ancestor f61ba29de2dcd0f069885624d67f72f9c1f1f4e3 HEAD

      - name: Apply narrow ambiguity reconciliation
        run: python3 tools/apply_retroarch_ambiguity_reconcile.py

      - name: Prove launch safety and current Product contracts
        run: |
          set -euo pipefail
          make -f Makefile.host host-clean
          make -f Makefile.host build-host/test_retroarch_launch_resolution
          ./build-host/test_retroarch_launch_resolution
          python3 tests/test_product_performance_contract.py
          python3 tests/test_game_hub_contract.py
          python3 tests/test_ci_repository_safety_contract.py
          python3 tests/test_engineering_authority_contract.py
          git diff --check

      - name: Commit and push runtime reconciliation
        run: |
          set -euo pipefail
          git config user.name GlitchedZeus
          git config user.email user91746@protonmail.com
          git add src/UI/GameLauncher.cpp
          git commit -m "fix(launch): preserve RetroArch ambiguity safety"
          git push origin HEAD:feature/gen4-full-editor-20260928

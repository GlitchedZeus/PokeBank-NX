name: One-time AppShell touch macOS runner

on:
  push:
    branches: [feature/touch-controls-20261005]
    paths:
      - .github/workflows/touch-appshell-macos.yml

permissions:
  contents: write

jobs:
  patch-touch:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact touch head
        run: |
          set -euo pipefail
          git fetch origin feature/touch-controls-20261005
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/feature/touch-controls-20261005)" = "$GITHUB_SHA"
      - name: Execute reviewed AppShell patch and self-clean
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          workflow = Path('.github/workflows/one-time-product-freeze-party-cleanup.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/appshell_touch_patch.py').write_text(script)
          subprocess.run(['python3', '/tmp/appshell_touch_patch.py'], check=True)
          PY
          rm -f .github/workflows/touch-appshell-macos.yml
          git diff --check
      - name: Commit direct AppShell touch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No touch changes produced"; exit 1; }
          git commit -m "feat(ui): make AppShell cards direct-touch"
          git push origin HEAD:feature/touch-controls-20261005

name: Gen V-IX Legality Foundation (Exact Head)

on:
  pull_request:
    paths:
      - 'include/Legality/Gen59FormatDomainEvidence.h'
      - 'include/Enums/GameVersion.h'
      - 'include/Legality/Gen56NativeEnvelopeEvidence.h'
      - 'tests/test_legality_gen59_native_foundation.cpp'
      - 'tests/test_legality_gen5_product_reader_bridge.cpp'
      - 'src/Legality/Gen5RecordAnalysis.cpp'
      - 'include/Legality/Gen5ProductNativeEvidence.h'
      - 'include/Pokemon/Pokemon5ReadOnly.h'
      - 'include/Encryption/Encryption5.h'
      - 'include/Legality/Legality.h'
      - 'tools/legality_pkhex_source_pin.py'
      - 'tests/test_legality_pkhex_source_pin.py'
      - 'tools/legality_pkhex_oracle/**'
      - 'tools/legality_gen5_oracle_vectors.cpp'
      - 'tools/compare_legality_pk5_oracle.py'
      - 'docs/legality/research/pkhex/PKHEX_USER_ARCHIVE_SOURCE_MAP.json'
      - 'src/Legality/Legality.cpp'
      - 'tools/audit_legality_gen59_wiring.py'
      - '.github/workflows/legality-gen5-9-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gen59-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-foundation:
    name: Native domain & bounds / ${{ matrix.compiler }} / normal + sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: ['g++', 'clang++']
    steps:
      - name: Checkout actual head, not synthetic PR merge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
          ${{ matrix.compiler }} --version
      - name: Compile and execute native format and transport contracts
        env:
          CXX: ${{ matrix.compiler }}
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        shell: bash
        run: |
          set -euo pipefail
          test -d include/Enums
          python3 tools/audit_legality_gen59_wiring.py --source-root .
          python3 tools/legality_pkhex_source_pin.py --repo-root . --product-only
          python3 tests/test_legality_pkhex_source_pin.py
          mkdir -p /tmp/pbnx-gen59
          "$CXX" -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -Iinclude \
            tests/test_legality_gen59_native_foundation.cpp -o /tmp/pbnx-gen59/domain
          /tmp/pbnx-gen59/domain
          "$CXX" -std=c++20 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude \
            tests/test_legality_gen59_native_foundation.cpp -o /tmp/pbnx-gen59/domain-san
          /tmp/pbnx-gen59/domain-san
          "$CXX" -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -Iinclude \
            src/Legality/Gen5RecordAnalysis.cpp tests/test_legality_gen5_product_reader_bridge.cpp \
            -o /tmp/pbnx-gen59/product-pk5
          /tmp/pbnx-gen59/product-pk5
          "$CXX" -std=c++20 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude \
            src/Legality/Gen5RecordAnalysis.cpp tests/test_legality_gen5_product_reader_bridge.cpp \
            -o /tmp/pbnx-gen59/product-pk5-san
          /tmp/pbnx-gen59/product-pk5-san
          git diff --check

  pkhex-host-oracle:
    name: Pinned original PKHeX.Core and native PK5 differential
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact coordinator expansion head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout immutable upstream candidate (verification mandatory)
        uses: actions/checkout@v4
        with:
          repository: kwsch/PKHeX
          ref: 66ef5983a5d349efa2dd615f2926a1b1ee97306e
          path: third_party/PKHeX
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Reject source trees that do not match owner's ZIP SHA map
        run: |
          set -euo pipefail
          test "$(git -C third_party/PKHeX rev-parse HEAD)" = 66ef5983a5d349efa2dd615f2926a1b1ee97306e
          python3 tools/legality_pkhex_source_pin.py --repo-root . --upstream-source-root third_party/PKHeX
      - name: Differential native Product PK5 against original PKHeX Core
        run: |
          set -euo pipefail
          mkdir -p /tmp/pbnx-oracle
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -Iinclude \
            tools/legality_gen5_oracle_vectors.cpp -o /tmp/pbnx-oracle/native-vectors
          /tmp/pbnx-oracle/native-vectors > /tmp/pbnx-oracle/vectors.tsv
          dotnet run --configuration Release \
            --project tools/legality_pkhex_oracle/LegalityOracle.csproj \
            -p:PKHeXSourceRoot="$GITHUB_WORKSPACE/third_party/PKHeX" \
            -- /tmp/pbnx-oracle/vectors.tsv > /tmp/pbnx-oracle/oracle.jsonl
          python3 tools/compare_legality_pk5_oracle.py \
            --vectors /tmp/pbnx-oracle/vectors.tsv \
            --oracle /tmp/pbnx-oracle/oracle.jsonl
          git diff --check

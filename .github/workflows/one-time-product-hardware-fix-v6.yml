name: One-time Product Home hardware fix v6
on:
  push:
    branches: [feature/gen4-full-editor-20260928]
    paths: [.github/workflows/one-time-product-hardware-fix-v6.yml]
permissions:
  contents: write
jobs:
  patch-forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gen4-full-editor-20260928
          fetch-depth: 0
      - name: Verify exact live head
        run: |
          set -euo pipefail
          git fetch origin feature/gen4-full-editor-20260928
          test "$(git rev-parse origin/feature/gen4-full-editor-20260928)" = "$GITHUB_SHA"
      - name: Update stale hardware contracts
        run: python3 tools/one_time_hotpath_contract_fix_20261005.py
      - name: Focused validation
        run: |
          set -euo pipefail
          git diff --check
          make -f Makefile.host product-ui-test
          python3 tests/test_reachable_ui_consistency.py
          python3 tests/test_game_hub_contract.py
      - name: Commit forward
        run: |
          set -euo pipefail
          git fetch origin feature/gen4-full-editor-20260928
          test "$(git rev-parse origin/feature/gen4-full-editor-20260928)" = "$GITHUB_SHA"
          git config user.name GlitchedZeus
          git config user.email user91746@protonmail.com
          git add tests/test_game_hub_contract.py
          git commit -m "test(ui): cover hardware hotpath regression fixes"
          git push origin HEAD:feature/gen4-full-editor-20260928

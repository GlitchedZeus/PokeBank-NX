name: One-time Product Home hardware fix v6
on:
  push:
    branches: [feature/gen4-full-editor-20260928]
    paths: [.github/workflows/one-time-product-hardware-fix-v6.yml]
permissions:
  contents: write
jobs:
  patch-forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gen4-full-editor-20260928
          fetch-depth: 0
      - name: Verify exact live head
        run: |
          set -euo pipefail
          git fetch origin feature/gen4-full-editor-20260928
          test "$(git rev-parse origin/feature/gen4-full-editor-20260928)" = "$GITHUB_SHA"
      - name: Apply guarded hardware hotpath patch
        run: python3 tools/one_time_hardware_hotpath_fix_20261005.py
      - name: Verify patch
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
      - name: Commit forward
        run: |
          set -euo pipefail
          git fetch origin feature/gen4-full-editor-20260928
          test "$(git rev-parse origin/feature/gen4-full-editor-20260928)" = "$GITHUB_SHA"
          git config user.name GlitchedZeus
          git config user.email user91746@protonmail.com
          git add src/UI/SaveSelectScreen.cpp src/UI/GameLauncher.cpp
          git commit -m "fix(ui): remove hardware launch and legacy-open stalls"
          git push origin HEAD:feature/gen4-full-editor-20260928

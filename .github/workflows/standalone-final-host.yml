name: standalone-final-host

on:
  push:
    branches:
      - ci/standalone-final-host-validation-20260912

permissions:
  contents: read

env:
  APP_SHA: 74698c3f6c8427dd6810c4259d520f015da7ba25
  APP_TREE: 3b34a375a3b6c0418869c819d060654f9e0210ab
  PROD_SHA: 3618f2423ba48be4fcaee138beb1fadec36792bd

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
          fetch-depth: 4
          submodules: recursive
      - name: Exact identity scope and static invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$APP_TREE"
          test "$(git rev-parse HEAD^1)" = "$PROD_SHA"
          git diff --check "$PROD_SHA" "$APP_SHA"
          EXPECTED=(CURRENT_STATUS.md Makefile.host Makefile.host.standalone README.md docs/CLASSIC_SAVE_EDITOR_ARCHITECTURE.md docs/STANDALONE_RUNTIME.md docs/UI_OWNERSHIP_STATUS.md include/Globals.h include/Trainer/Bank.h include/UI/TrainerViewScreenBase.h include/Utils/FileUtilities.h include/Utils/Logger.h include/Utils/PokeBankPaths.h include/Utils/Settings.h src/Trainer/Bank.cpp src/UI/BackupSelectionScreen.cpp src/UI/TrainerViewScreenBase.inc src/UI/TrainerViewScreenGSCOverlay.cpp src/UI/UI.cpp src/Utils/FileUtilities.cpp src/Utils/Logger.cpp src/Utils/Settings.cpp src/main.cpp tests/test_clean_install_runtime.cpp tests/test_pokebank_paths.cpp tests/test_runtime_dependency_contract.cpp)
          printf '%s\n' "${EXPECTED[@]}" | sort > /tmp/expected
          git diff --name-only "$PROD_SHA" "$APP_SHA" | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          ! git grep -n -I -F 'sdmc:/PKSE' -- src include
          grep -q 'sdmc:/switch/PokeBank-NX' include/Utils/PokeBankPaths.h
          grep -q 'gen2ExportsRoot' include/Utils/PokeBankPaths.h
          grep -q 'PokeBank NX Generation II staged export' src/UI/TrainerViewScreenGSCOverlay.cpp
          ! grep -q 'PokeVault NX Generation II staged export' src/UI/TrainerViewScreenGSCOverlay.cpp
          ! grep -q 'PokeVault/Exports/Gen2' src/UI/TrainerViewScreenGSCOverlay.cpp
          grep -q '0x01008F6008C5E000ULL' src/Games/GameIdentity.cpp
          grep -q 'return source == SourceKind::BackupOrStaged || source == SourceKind::AppOwnedStorage;' include/Safety/SourceMutationPolicy.h
          grep -q 'LIVE_RETROARCH_WRITE=DISABLED' src/UI/TrainerViewScreenGSCOverlay.cpp
          grep -q 'LIVE_INSTALLED_GAME_WRITE=DISABLED' src/UI/TrainerViewScreenGSCOverlay.cpp
          grep -q 'Japanese Generation II remains read-only' docs/STANDALONE_RUNTIME.md
      - name: Full host suite and explicit regressions
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.host host-clean
          make -f Makefile.host host-test
          ./build-host/test_pokebank_paths
          ./build-host/test_clean_install_runtime
          ./build-host/test_runtime_dependency_contract
          ./build-host/test_write_policy
          ./build-host/test_source_mutation_policy
          ./build-host/test_gsc_staged_editor
          ./build-host/test_gsc_gen2_adapter
          ./build-host/test_gsc_inventory
          ./build-host/test_gsc_readonly_bridge
          ./build-host/test_rby_gen1_adapter
          ./build-host/test_rby_inventory
          ./build-host/test_rby_discovery
          ./build-host/test_rby_source_browser
          ./build-host/test_rby_readonly_bridge
          ./build-host/test_retroarch_frlg_discovery
          ./build-host/test_legacy_frlg_browse
          ./build-host/test_legacy_source_bindings
          ./build-host/test_pksm_gen3_adapter
          ./build-host/test_gen3_native_slice
          ./build-host/test_rse_gen3_adapter
          ./build-host/test_rse_gen3_native_slice
      - name: Independent RSE save-open regression
        shell: bash
        run: |
          set -euo pipefail
          SOURCES="tests/test_rse_open_regression.cpp src/Integration/Gen3/PKSMGen3NativeAdapter.cpp src/Integration/Gen3/FRLGReadModel.cpp src/Legacy/FRLGReadOnlyTrainer.cpp src/Pokemon/Pokemon3FRLG.cpp src/Pokemon/BaseStatsGen89.cpp src/Pokemon/PersonalInfoTable.cpp src/Pokemon/Experience.cpp src/Encryption/Encryption3FRLG.cpp src/Names/ItemNames.cpp src/Names/SpeciesNames.cpp src/Names/NatureNames.cpp src/Names/AbilityNames.cpp src/Utils/StringHelpers.cpp src/Utils/HelperUtilities.cpp src/Utils/SHA256.cpp src/Games/GameIdentity.cpp"
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -O2 -DPOKEBANK_GEN3_SELECTIVE_PORT_TEST -Iinclude $SOURCES -o build-host/test_rse_open_regression
          ./build-host/test_rse_open_regression
      - name: ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.host host-sanitize
          echo 'FINAL HOST + ASAN + UBSAN: PASS'

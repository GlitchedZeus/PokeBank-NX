name: One-time full editor picker touch v2

on:
  push:
    branches: [feature/touch-controls-20261005]
    paths:
      - .github/workflows/one-time-full-touch-pickers-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact head
        run: |
          set -euo pipefail
          git fetch origin feature/touch-controls-20261005
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/feature/touch-controls-20261005)" = "$GITHUB_SHA"
      - name: Apply reviewed picker patch with Gen IV count normalization
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/UI/Gen4SharedPokemonSurface.inc')
          s=p.read_text()
          old='''    if (state.pickerValues.empty()) {\n        state.valuePicker = false;\n        return true;\n    }\n    const int pickerCount = static_cast<int>(state.pickerValues.size());\n'''
          new='''    const int count = static_cast<int>(state.pickerValues.size());\n    if (count <= 0) {\n        state.valuePicker = false;\n        return true;\n    }\n'''
          if s.count(old)!=1: raise SystemExit('Gen IV picker-count normalization anchor mismatch')
          s=s.replace(old,new,1).replace('pickerCount','count')
          p.write_text(s)

          src=Path('.github/workflows/one-time-full-touch-pickers.yml').read_text().splitlines()
          body=[]; capture=False
          for line in src:
              if line == "          python3 - <<'PY'": capture=True; continue
              if capture and line == '          PY': break
              if capture: body.append(line[10:] if line.startswith('          ') else line)
          if not body: raise SystemExit('picker patch body not found')
          Path('/tmp/full_touch_pickers.py').write_text('\n'.join(body)+'\n')
          PY
          python3 /tmp/full_touch_pickers.py
          git diff --check
          ! grep -n '(void)touch' src/UI/Gen3SharedPokemonSurface.inc src/UI/Gen4SharedPokemonSurface.inc
          grep -q '3000 + i' src/UI/Gen2PokemonEditorFoundation.inc
          grep -q '4000 + i' src/UI/Gen3SharedPokemonSurface.inc
          grep -q '6000 + i' src/UI/Gen4SharedPokemonSurface.inc
      - name: Commit picker touch runtime only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/UI/Gen2PokemonEditorFoundation.inc src/UI/Gen2PokemonPickerOverlay.inc src/UI/Gen2HardwarePickerFix.inc src/UI/Gen3SharedPokemonSurface.inc src/UI/Gen4SharedPokemonSurface.inc
          git diff --cached --quiet && { echo 'No picker touch changes'; exit 1; }
          git commit -m 'feat(ui): add native touch to held-item and value pickers'
          git push origin HEAD:feature/touch-controls-20261005

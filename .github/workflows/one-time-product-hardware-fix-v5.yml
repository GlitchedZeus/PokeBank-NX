name: Apply Product Home hardware patch v8 retry

on:
  push:
    branches:
      - feature/gen4-full-editor-20260928
    paths:
      - .github/workflows/one-time-product-hardware-fix-v5.yml

permissions:
  contents: write

jobs:
  patch-forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gen4-full-editor-20260928
          fetch-depth: 0

      - name: Verify exact branch head
        run: |
          set -euo pipefail
          git fetch origin feature/gen4-full-editor-20260928
          test "$(git rev-parse origin/feature/gen4-full-editor-20260928)" = "$GITHUB_SHA"

      - name: Apply staged source patch
        run: |
          set -euo pipefail
          python3 tools/apply_product_hardware_fix_v8.py
          python3 tests/test_game_hub_contract.py
          g++ -std=c++20 -Iinclude tests/test_game_launch_model.cpp -o /tmp/test_game_launch_model
          /tmp/test_game_launch_model

      - name: Commit source fix forward
        run: |
          set -euo pipefail
          git fetch origin feature/gen4-full-editor-20260928
          test "$(git rev-parse origin/feature/gen4-full-editor-20260928)" = "$GITHUB_SHA"
          git config user.name GlitchedZeus
          git config user.email user91746@protonmail.com
          git add src/UI/GameLauncher.cpp src/UI/SaveSelectScreen.cpp tests/test_game_hub_contract.py
          git commit -m "fix(ui): launch installed forwarders and refine game assignment"
          git push origin HEAD:feature/gen4-full-editor-20260928

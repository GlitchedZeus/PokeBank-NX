name: One-time Product Home forwarder hardware fix v5

on:
  push:
    branches: [feature/gen4-full-editor-20260928]
    paths: [.github/workflows/one-time-product-hardware-fix-v5.yml]

permissions:
  contents: write

jobs:
  patch-forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gen4-full-editor-20260928
          fetch-depth: 0
      - name: Verify exact branch head
        run: |
          set -euo pipefail
          git fetch origin feature/gen4-full-editor-20260928
          test "$(git rev-parse origin/feature/gen4-full-editor-20260928)" = "$GITHUB_SHA"
      - name: Apply fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def once(s, old, new, name):
              n=s.count(old)
              if n != 1: raise SystemExit(f"{name}: expected 1 match, got {n}")
              return s.replace(old,new,1)

          p=Path('src/UI/GameLauncher.cpp'); s=p.read_text()
          old='''std::string compactGameTitle(std::string_view value) {
              std::string out;
              out.reserve(value.size());
              for (unsigned char c : value)
                  if (std::isalnum(c)) out.push_back(static_cast<char>(std::tolower(c)));
              return out;
          }
          '''
          new='''std::string compactGameTitle(std::string_view value) {
              std::string out;
              out.reserve(value.size());
              for (size_t i = 0; i < value.size(); ++i) {
                  const unsigned char c = static_cast<unsigned char>(value[i]);
                  if (c == 0xC3 && i + 1 < value.size()) {
                      const unsigned char next = static_cast<unsigned char>(value[i + 1]);
                      if (next == 0xA9 || next == 0x89) { out.push_back('e'); ++i; continue; }
                  }
                  if (c < 0x80 && std::isalnum(c))
                      out.push_back(static_cast<char>(std::tolower(c)));
              }
              return out;
          }

          bool installedForwarderNameMatches(std::string_view gameId, std::string_view normalizedName) {
              auto shaped = [&](std::string_view token) {
                  const std::string plain(token);
                  const std::string version = plain + "version";
                  const std::string pokemon = "pokemon" + plain;
                  const std::string pokemonVersion = pokemon + "version";
                  return normalizedName == plain || normalizedName == version ||
                         normalizedName == pokemon || normalizedName == pokemonVersion ||
                         normalizedName.rfind(pokemon, 0) == 0;
              };
              if (gameId == "red_gb") return shaped("red");
              if (gameId == "blue_gb") return shaped("blue");
              if (gameId == "yellow_gb") return shaped("yellow");
              if (gameId == "gold_gbc") return shaped("gold");
              if (gameId == "silver_gbc") return shaped("silver");
              if (gameId == "crystal_gbc") return shaped("crystal");
              if (gameId == "ruby_gba") return shaped("ruby");
              if (gameId == "sapphire_gba") return shaped("sapphire");
              if (gameId == "firered_gba") return shaped("firered");
              if (gameId == "leafgreen_gba") return shaped("leafgreen");
              if (gameId == "emerald_gba") return shaped("emerald");
              if (gameId == "diamond_nds") return shaped("diamond");
              if (gameId == "pearl_nds") return shaped("pearl");
              if (gameId == "platinum_nds") return shaped("platinum");
              if (gameId == "heartgold_nds") return shaped("heartgold");
              if (gameId == "soulsilver_nds") return shaped("soulsilver");
              return false;
          }
          '''
          s=once(s,old,new,'title normalizer')
          s=once(s,'''    const auto* game = PokeVault::Games::findGame(gameId);
              if (!game) { cache[key] = 0; return 0; }
              const std::string wanted = compactGameTitle(game->title);
              if (wanted.size() < 4) { cache[key] = 0; return 0; }
          ''','''    if (!PokeVault::Games::findGame(gameId)) { cache[key] = 0; return 0; }
          ''','forwarder setup')
          s=once(s,'''                    if (name.find("pokemon") != std::string::npos &&
                                  name.find(wanted) != std::string::npos) {
          ''','''                    if (installedForwarderNameMatches(gameId, name)) {
          ''','forwarder matcher')
          p.write_text(s)

          p=Path('src/UI/SaveSelectScreen.cpp'); s=p.read_text()
          s=once(s,'Color(5, 14, 30, 54)','Color(5, 14, 30, 40)','region scrim')
          s=once(s,'Color(3, 10, 24, 132)','Color(3, 10, 24, 104)','hero glass')
          s=once(s,'fb.drawFilledCircle(cx, cy, buttonD / 2, Colors::SurfaceRaised);',
                 'fb.drawFilledCircle(cx, cy, buttonD / 2,\n                                focused ? withAlpha(Colors::Info, 46) : Colors::PanelAlt);','dock fill')
          old='''        } else if (game.sourceKind == SelectedSourceKind::RetroArchFRLG) {
              legacyInstanceIndex = 0;
              legacyInstanceScroll = 0;
              legacyNotice.clear();
              overlay = Overlay::LegacyInstances;
          } else if (launchDescriptor.state == GameLaunchState::NeedsContentLink) {
          '''
          new='''        } else if (game.sourceKind == SelectedSourceKind::RetroArchFRLG) {
              rebuildUnassignedLegacySources();
              unassignedLegacySources.erase(
                  std::remove_if(unassignedLegacySources.begin(), unassignedLegacySources.end(),
                      [&](const LegacyAssignmentEntry& entry) { return entry.gameId != game.gameId; }),
                  unassignedLegacySources.end());
              if (!unassignedLegacySources.empty()) {
                  legacyAssignmentIndex = 0;
                  legacyAssignmentScroll = 0;
                  legacyNotice = "Choose a validated save to assign to this profile.";
                  overlay = Overlay::LegacyAssignment;
              } else {
                  legacyInstanceIndex = 0;
                  legacyInstanceScroll = 0;
                  legacyNotice.clear();
                  overlay = Overlay::LegacyInstances;
              }
          } else if (launchDescriptor.state == GameLaunchState::NeedsContentLink) {
          '''
          s=once(s,old,new,'legacy assignment')
          p.write_text(s)

          p=Path('tests/test_game_hub_contract.py'); t=p.read_text()
          t=t.replace('Color(3, 10, 24, 132)','Color(3, 10, 24, 104)')
          t=t.replace('"fb.drawFilledCircle(cx, cy, buttonD / 2, Colors::SurfaceRaised);" in source,',
                      '"focused ? withAlpha(Colors::Info, 46) : Colors::PanelAlt" in source,')
          marker='''require("scrollClassicSelectionIntoView();" in classic_draw and "std::clamp(titleIndex" in classic_draw,
                  "the full Games artwork browser must normalize selection/scroll immediately after save/source changes")
          '''
          t=once(t,marker,marker+'''require("drawTrainerPortrait" not in classic_draw,
                  "the PKSE/full Games browser must not show trainer portraits")
          ''','classic portrait contract')
          marker='''require("descriptor.state != GameLaunchState::LauncherOnly" in launcher,
                  "launcher-only fallbacks must never receive a falsely linked ROM argument")
          '''
          t=once(t,marker,marker+'''require("installedForwarderNameMatches" in launcher and
                  'gameId == "platinum_nds"' in launcher and 'gameId == "emerald_gba"' in launcher,
                  "installed HOME forwarders must be matched by exact release identity before emulator fallback")
          ''','forwarder contract')
          marker='''require('{"X","Save / Source"}' in source and '{"Y","Sort"}' in source and
                  '{"+","Favorite"}' in source,
                  "the full Games browser footer must expose source assignment, sort and favorite actions")
          '''
          t=once(t,marker,marker+'''require("Choose a validated save to assign to this profile." in source and
                  "entry.gameId != game.gameId" in source,
                  "Games X must offer unassigned saves for the selected game/profile")
          ''','assignment contract')
          p.write_text(t)
          PY
      - name: Focused tests
        run: |
          set -euo pipefail
          python3 tests/test_game_hub_contract.py
          g++ -std=c++20 -Iinclude tests/test_game_launch_model.cpp -o /tmp/test_game_launch_model
          /tmp/test_game_launch_model
      - name: Commit fix forward
        run: |
          set -euo pipefail
          git fetch origin feature/gen4-full-editor-20260928
          test "$(git rev-parse origin/feature/gen4-full-editor-20260928)" = "$GITHUB_SHA"
          git config user.name GlitchedZeus
          git config user.email user91746@protonmail.com
          git add src/UI/GameLauncher.cpp src/UI/SaveSelectScreen.cpp tests/test_game_hub_contract.py
          git commit -m "fix(ui): prefer installed game forwarders and refine Product Home"
          git push origin HEAD:feature/gen4-full-editor-20260928

name: Gen I/II Packed Multi-Move Focused

on:
  push:
    branches:
      - feature/gen12-packed-y-multimove-20260917
  pull_request:
    paths:
      - "include/Integration/Gen1/Gen1StagedPokemonEditor.h"
      - "include/Integration/Gen2/Gen2StagedEditor.h"
      - "include/UI/ClassicPackedMultiSelect.h"
      - "src/Integration/Gen1/Gen1PackedMove.cpp"
      - "src/Integration/Gen2/Gen2PackedMove.cpp"
      - "src/UI/ClassicPackedMoveOverlay.inc"
      - "src/UI/ClassicReleaseActionFix.inc"
      - "src/UI/TrainerViewScreenCompositeOverlay.cpp"
      - "tests/test_gen12_packed_multimove.cpp"
      - ".github/workflows/gen12-packed-multimove-focused.yml"

permissions:
  contents: read

jobs:
  packed-multimove:
    name: Packed multi-move and Release regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile and run focused multi-move tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-host
          SOURCES="tests/test_gen12_packed_multimove.cpp \
            src/Integration/Gen1/Gen1StagedPokemonEditor.cpp \
            src/Integration/Gen1/Gen1PackedMove.cpp \
            src/Integration/Gen1/Gen1ReadOnlySave.cpp \
            src/Integration/Gen2/Gen2StagedEditor.cpp \
            src/Integration/Gen2/Gen2PackedMove.cpp \
            src/Integration/Gen2/Gen2ReadOnlySave.cpp \
            src/Integration/Gen2/Gen2ReadOnlyInventory.cpp \
            src/Integration/Gen2/Gen2PersonalData.cpp \
            src/Pokemon/Experience.cpp \
            src/Names/SpeciesNames.cpp"
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -O2 \
            -I. -Iinclude $SOURCES -o build-host/test_gen12_packed_multimove
          ./build-host/test_gen12_packed_multimove

      - name: Run multi-move ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          SOURCES="tests/test_gen12_packed_multimove.cpp \
            src/Integration/Gen1/Gen1StagedPokemonEditor.cpp \
            src/Integration/Gen1/Gen1PackedMove.cpp \
            src/Integration/Gen1/Gen1ReadOnlySave.cpp \
            src/Integration/Gen2/Gen2StagedEditor.cpp \
            src/Integration/Gen2/Gen2PackedMove.cpp \
            src/Integration/Gen2/Gen2ReadOnlySave.cpp \
            src/Integration/Gen2/Gen2ReadOnlyInventory.cpp \
            src/Integration/Gen2/Gen2PersonalData.cpp \
            src/Pokemon/Experience.cpp \
            src/Names/SpeciesNames.cpp"
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I. -Iinclude $SOURCES -o build-host/test_gen12_packed_multimove_sanitize
          ASAN_OPTIONS=detect_leaks=0 ./build-host/test_gen12_packed_multimove_sanitize

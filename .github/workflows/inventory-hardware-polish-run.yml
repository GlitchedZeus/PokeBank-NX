name: Inventory Hardware Polish Runner

on:
  push:
    branches:
      - dev/inventory-hardware-polish-20260913

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic inventory polish patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/inventory_hardware_polish_apply.py
          git diff --check
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -O2 -Iinclude \
            tests/test_inventory_ui_contract.cpp -o /tmp/test_inventory_ui_contract
          /tmp/test_inventory_ui_contract
          make -f Makefile.host.classic_inventory host-classic-inventory
          grep -F 'InventoryAction::AddItem' src/UI/TrainerViewScreenBase.inc >/dev/null
          grep -F 'InventoryAction::RemoveItem' src/UI/TrainerViewScreenBase.inc >/dev/null
          grep -F 'itemNameColorRole(selected, item.isNew)' src/UI/Panels/ItemsPanel.cpp >/dev/null
          grep -F 'InventoryPickerLayout::Width' src/UI/ClassicInventoryOverlay.cpp >/dev/null
          grep -F 'D-pad/Stick Navigate' src/UI/Dialogs/PickerDialog.cpp >/dev/null
      - name: Commit candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/inventory-hardware-polish-apply.yml
          rm -f .github/workflows/inventory-hardware-polish-run.yml
          rm -f .github/scripts/inventory_hardware_polish_apply.py
          git config user.name "PokeBank NX CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "ui: unify inventory hardware controls and picker polish [inventory-polish-applied]"
          git push origin HEAD:dev/inventory-hardware-polish-20260913

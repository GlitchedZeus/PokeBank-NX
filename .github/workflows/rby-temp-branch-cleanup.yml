name: RBY one-time unused branch cleanup

on:
  push:
    branches: [feature/pokebank-playable]
    paths: [.github/workflows/rby-temp-branch-cleanup.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify unused branches contain no unique RBY work and delete them
        run: |
          set -euo pipefail
          baseline=5eb56a5988bfa4c825728c7d6cd80fdc86499487
          git fetch origin '+refs/heads/tmp-rby-adapter-*:refs/remotes/origin/tmp-rby-adapter-*'
          for n in 2 3 4 5 6; do
            branch="tmp-rby-adapter-$n"
            sha="$(git rev-parse "origin/$branch")"
            test "$sha" = "$baseline"
          done
          git push origin --delete \
            tmp-rby-adapter-2 tmp-rby-adapter-3 tmp-rby-adapter-4 \
            tmp-rby-adapter-5 tmp-rby-adapter-6

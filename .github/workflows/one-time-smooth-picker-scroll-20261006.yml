name: ONE-TIME smooth Gen III-IV picker scrolling

on:
  push:
    branches:
      - feature/touch-controls-20261005
    paths:
      - '.github/workflows/one-time-smooth-picker-scroll-20261006.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/touch-controls-20261005
          fetch-depth: 3

      - name: Guard exact parent
        env:
          EXPECTED_PARENT: a9bf893e035abc918a453e90cdf1a5546d1e89f4
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Apply pixel-follow picker scrolling
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          def patch_common(path, gen):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              text = replace_once(
                  text,
                  '#include "UI/SharedSpeciesPicker.h"\n',
                  '#include "UI/SharedSpeciesPicker.h"\n#include "UI/TouchScroll.h"\n',
                  f'{gen} touch-scroll include')
              text = replace_once(
                  text,
                  '    int pickerRow = 0;\n',
                  '    int pickerRow = 0;\n    TouchScrollState pickerScroll;\n',
                  f'{gen} picker scroll state')
              p.write_text(text, encoding='utf-8')

          patch_common('src/UI/Gen3SharedPokemonSurface.inc', 'Gen III')
          patch_common('src/UI/Gen4SharedPokemonSurface.inc', 'Gen IV')

          # Gen III: reset scroll per picker, use the stateful pixel scroller while held/coasting,
          # and remove the old release-only jump behavior.
          p = Path('src/UI/Gen3SharedPokemonSurface.inc')
          text = p.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'void openValuePicker(TrainerViewScreen& screen, State& state, PickerTarget target,\n'
              '                     int moveSlot = 0) {\n'
              '    state.pickerTarget = target;\n',
              'void openValuePicker(TrainerViewScreen& screen, State& state, PickerTarget target,\n'
              '                     int moveSlot = 0) {\n'
              '    state.pickerScroll.reset();\n'
              '    state.pickerTarget = target;\n',
              'Gen III reset picker scroll')

          old_release = '''    if (touch.justReleased() && touch.dragged()) {
        const int dx = touch.deltaX(), dy = touch.deltaY();
        const int ax = std::abs(dx), ay = std::abs(dy);
        if (state.pickerTarget == PickerTarget::HeldItem) {
            if (ay >= ax && ay >= 28) state.pickerRow = HeldItemGrid::move(state.pickerRow, count, 0, dy < 0 ? 1 : -1);
            else if (ax >= 28) state.pickerRow = HeldItemGrid::move(state.pickerRow, count, dx < 0 ? 1 : -1, 0);
        } else {
            const int steps = std::max(1, ay / 40);
            if (dy < 0) state.pickerRow = std::min(count - 1, state.pickerRow + steps);
            else if (dy > 0) state.pickerRow = std::max(0, state.pickerRow - steps);
        }
    }
'''
          text = replace_once(text, old_release, '', 'Gen III remove release-only picker jump')
          text = replace_once(
              text,
              '    const int count = static_cast<int>(state.pickerValues.size());\n'
              '    const int touchDown = screen.touchedButtonDownId(touch);\n',
              '''    const int count = static_cast<int>(state.pickerValues.size());
    if (count > 0) {
        if (state.pickerTarget == PickerTarget::HeldItem) {
            constexpr int pickerW = 1040, pickerH = 520, rowStep = 40;
            const int px = (1280 - pickerW) / 2;
            const int py = (720 - pickerH) / 2;
            state.pickerScroll.updateVertical(
                touch, px + 22, py + 87, pickerW - 44,
                HeldItemGrid::rows * rowStep + 6, rowStep,
                state.pickerRow, count, HeldItemGrid::columns);
        } else if (state.pickerTarget == PickerTarget::Move) {
            constexpr auto pickerLayout = MoveUI::compactPickerLayout();
            const int px = (1280 - pickerLayout.width) / 2;
            const int py = (720 - pickerLayout.height) / 2;
            state.pickerScroll.updateVertical(
                touch, px + 24, py + pickerLayout.rowStart,
                pickerLayout.width - 48,
                pickerLayout.visibleRows * pickerLayout.rowStep,
                pickerLayout.rowStep, state.pickerRow, count);
        } else {
            constexpr int pickerW = 680, pickerH = 560, rowStep = 42;
            const int px = (1280 - pickerW) / 2;
            const int py = (720 - pickerH) / 2;
            state.pickerScroll.updateVertical(
                touch, px + 22, py + 86, pickerW - 44,
                10 * rowStep + 8, rowStep, state.pickerRow, count);
        }
    }
    const int touchDown = screen.touchedButtonDownId(touch);
''',
              'Gen III live picker scroll update')
          text = replace_once(
              text,
              '    if (state.pickerTarget == PickerTarget::HeldItem) {\n'
              '        if (down & HidNpadButton_Up)\n',
              '    if (down & (HidNpadButton_Up | HidNpadButton_Down | HidNpadButton_Left | HidNpadButton_Right | HidNpadButton_L | HidNpadButton_R))\n'
              '        state.pickerScroll.stop();\n'
              '    if (state.pickerTarget == PickerTarget::HeldItem) {\n'
              '        if (down & HidNpadButton_Up)\n',
              'Gen III controller cancels momentum')
          text = replace_once(
              text,
              '    if (down & HidNpadButton_B) {\n'
              '        state.valuePicker = false;\n',
              '    if (down & HidNpadButton_B) {\n'
              '        state.pickerScroll.stop();\n'
              '        state.valuePicker = false;\n',
              'Gen III cancel stops scroll')
          text = replace_once(
              text,
              '    if (down & HidNpadButton_A) {\n'
              '        applyValuePicker(state);\n',
              '    if (down & HidNpadButton_A) {\n'
              '        state.pickerScroll.stop();\n'
              '        applyValuePicker(state);\n',
              'Gen III select stops scroll')

          old_move_draw = '''        const int count = static_cast<int>(state.pickerValues.size());
        constexpr int visible = moveLayout.visibleRows;
        const int first = std::clamp(state.pickerRow - visible / 2, 0, std::max(0, count - visible));
        const int last = std::min(count, first + visible);
        for (int i = first; i < last; ++i) {
            const int yy = y + moveLayout.rowStart + (i - first) * moveLayout.rowStep;
            const bool selected = i == state.pickerRow;
            screen.touchButtons.push_back({4000 + i, x + 24, yy, w - 48, moveLayout.highlightHeight});
            if (selected)
                fb.drawSelectionHighlight(x + 24, yy, w - 48, moveLayout.highlightHeight);
            const auto value = state.pickerValues[static_cast<std::size_t>(i)];
            fb.drawText(x + 40, yy + 8, pickerValueLabel(state, value),
                        selected ? Colors::Text : Colors::TextDim, TextStyle::Body);
        }
'''
          new_move_draw = '''        const int count = static_cast<int>(state.pickerValues.size());
        constexpr int visible = moveLayout.visibleRows;
        const int first = std::clamp(state.pickerRow - visible / 2, 0, std::max(0, count - visible));
        const int firstDraw = std::max(0, first - 1);
        const int lastDraw = std::min(count, first + visible + 1);
        const int liveOffset = state.pickerScroll.offset();
        const int viewportTop = y + moveLayout.rowStart;
        const int viewportBottom = viewportTop + visible * moveLayout.rowStep;
        fb.setClipRect(x + 24, viewportTop, w - 48, visible * moveLayout.rowStep);
        for (int i = firstDraw; i < lastDraw; ++i) {
            const int yy = viewportTop + (i - first) * moveLayout.rowStep + liveOffset;
            const bool selected = i == state.pickerRow;
            if (yy + moveLayout.highlightHeight > viewportTop && yy < viewportBottom)
                screen.touchButtons.push_back({4000 + i, x + 24, yy, w - 48, moveLayout.highlightHeight});
            if (selected)
                fb.drawSelectionHighlight(x + 24, yy, w - 48, moveLayout.highlightHeight);
            const auto value = state.pickerValues[static_cast<std::size_t>(i)];
            fb.drawText(x + 40, yy + 8, pickerValueLabel(state, value),
                        selected ? Colors::Text : Colors::TextDim, TextStyle::Body);
        }
        fb.clearClip();
'''
          text = replace_once(text, old_move_draw, new_move_draw, 'Gen III move draw follows finger')


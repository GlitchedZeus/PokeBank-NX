name: ONE-TIME hardware hotpath regression fixes

on:
  push:
    branches:
      - feature/gen4-full-editor-20260928
    paths:
      - '.github/workflows/one-time-hardware-hotpath-fix-20261005.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/gen4-full-editor-20260928
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 tools/one_time_hardware_hotpath_fix_20261005.py

      - name: Verify diff
        run: git diff --check && git diff --stat

      - name: Commit fixes
        run: |
          git config user.name 'PokeBank NX CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/UI/SaveSelectScreen.cpp src/UI/GameLauncher.cpp
          git commit -m 'fix(ui): remove hardware launch and legacy-open stalls'
          git push origin HEAD:feature/gen4-full-editor-20260928

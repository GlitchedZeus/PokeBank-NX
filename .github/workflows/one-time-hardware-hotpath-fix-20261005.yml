name: ONE-TIME integrate PKSE on-screen keyboard

on:
  push:
    branches:
      - feature/gen4-full-editor-20260928
    paths:
      - '.github/workflows/one-time-hardware-hotpath-fix-20261005.yml'

permissions:
  contents: write

jobs:
  integrate-keyboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/gen4-full-editor-20260928
          fetch-depth: 0

      - name: Fetch merged PKSE keyboard commit
        run: |
          git remote add pkse https://github.com/kiasta/PKSE.git || true
          git fetch --no-tags pkse c4b7efce2867dd72606319cdc61a5eac655f6c25

      - name: Cherry-pick PKSE PR 126 keyboard
        run: |
          git config user.name 'PokeBank NX CI'
          git config user.email 'actions@users.noreply.github.com'
          git cherry-pick c4b7efce2867dd72606319cdc61a5eac655f6c25

      - name: Verify resulting tree
        run: |
          git diff --check HEAD^ HEAD
          test -f include/UI/Dialogs/KeyboardDialog.h
          test -f src/UI/Dialogs/KeyboardDialog.cpp
          grep -q 'setKeyboardPresenter' src/UI/UI.cpp
          grep -q 'KeyboardRequest' include/Utils/Keyboard.h

      - name: Push integrated keyboard
        run: git push origin HEAD:feature/gen4-full-editor-20260928

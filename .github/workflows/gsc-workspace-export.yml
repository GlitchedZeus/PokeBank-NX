name: GSC workspace export
on:
  push:
    branches: [codex/gsc-readonly]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gsc-readonly
          fetch-depth: 0
          submodules: recursive
      - name: Export exact staging workspace
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=build --exclude=build-host --exclude=build-gsc -czf /tmp/pokebank-gsc-workspace.tgz .
          git rev-parse HEAD > /tmp/WORKSPACE_HEAD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gsc-workspace-export
          path: |
            /tmp/pokebank-gsc-workspace.tgz
            /tmp/WORKSPACE_HEAD.txt
          if-no-files-found: error
          retention-days: 2

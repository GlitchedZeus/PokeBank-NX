name: One-time audit remediation forward integration

on:
  push:
    branches:
      - feature/gen4-full-editor-20260928
    paths:
      - .github/workflows/one-time-audit-forward-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gen4-full-editor-20260928
          fetch-depth: 0

      - name: Verify exact inputs
        run: |
          set -euo pipefail
          git fetch origin feature/gen4-full-editor-20260928 fix/full-audit-remediation-20260929
          test "$(git rev-parse origin/feature/gen4-full-editor-20260928)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/fix/full-audit-remediation-20260929)" = "408a56446f9dda611732c8186d6ce4148100d65f"

      - name: Merge validated audit remediation forward
        run: |
          set -euo pipefail
          git config user.name GlitchedZeus
          git config user.email user91746@protonmail.com
          # Current MAIN/PR #92 wins only on genuinely overlapping hunks. All non-conflicting
          # remediation changes are retained, including the audit tests and documentation.
          git merge --no-ff -X ours origin/fix/full-audit-remediation-20260929 \
            -m "merge(audit): forward-port validated remediation into current MAIN"

      - name: Run audit safety contracts before push
        run: |
          set -euo pipefail
          python3 tests/test_ci_repository_safety_contract.py
          python3 tests/test_engineering_authority_contract.py
          python3 tests/test_device_asset_png_validation.py
          python3 tests/test_generated_species_name_contract.py

      - name: Push forward merge
        run: |
          set -euo pipefail
          git push origin HEAD:feature/gen4-full-editor-20260928

name: One-time touch forward MAIN

on:
  push:
    branches: [feature/touch-controls-20261005]
    paths:
      - .github/workflows/one-time-touch-forward-main.yml

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Forward-merge latest MAIN
        run: |
          set -euo pipefail
          git fetch origin feature/touch-controls-20261005 feature/gen4-full-editor-20260928
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/feature/touch-controls-20261005)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/feature/gen4-full-editor-20260928)" = "d2a25573cd340f5747c47dafa37e8c5a324878d1"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-edit origin/feature/gen4-full-editor-20260928
          git diff --check HEAD^ HEAD
          git push origin HEAD:feature/touch-controls-20261005

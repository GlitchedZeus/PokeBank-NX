name: ONE-TIME run smooth picker patch

on:
  push:
    branches:
      - feature/touch-controls-20261005
    paths:
      - '.github/workflows/one-time-run-smooth-picker-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/touch-controls-20261005
          fetch-depth: 3

      - name: Guard exact parent
        env:
          EXPECTED_PARENT: 49d933d3cf7ea8576ee67f6b52fe0d26ed8bcf0e
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Extract and execute stored picker patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/one-time-smooth-picker-scroll-20261006.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY\n", start)
          lines = src[start:end].splitlines()
          patch = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          patch = 'import re\n' + patch
          patch = patch.replace(
              "text = replace_once(text, old_release, '', 'Gen III remove release-only picker jump')",
              "text, n = re.subn(r'    if \\(touch\\.justReleased\\(\\) && touch\\.dragged\\(\\)\\) \\{.*?\\n    \\}\\n(?=    if \\(count <= 0\\))', '', text, count=1, flags=re.S)\n          if n != 1: raise SystemExit(f'Gen III remove release-only picker jump: expected one structural block, found {n}')")
          patch = patch.replace(
              "text = replace_once(text, old_release4, '', 'Gen IV remove release-only picker jump')",
              "text, n = re.subn(r'    if \\(touch\\.justReleased\\(\\) && touch\\.dragged\\(\\)\\) \\{.*?\\n    \\}\\n(?=    if \\(count <= 0\\))', '', text, count=1, flags=re.S)\n          if n != 1: raise SystemExit(f'Gen IV remove release-only picker jump: expected one structural block, found {n}')")
          Path('/tmp/smooth_picker_patch.py').write_text(patch)
          PY
          python3 /tmp/smooth_picker_patch.py
          git diff --check
          python3 tests/test_touch_modal_list_contract.py
          python3 tests/test_touch_pokemon_editor_direct_rows_contract.py
          python3 tests/test_touch_appwide_surface_contract.py

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/UI/Gen3SharedPokemonSurface.inc src/UI/Gen4SharedPokemonSurface.inc
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(touch): make Gen III-IV pickers follow the finger"
          git push origin HEAD:feature/touch-controls-20261005

name: PokeBank NX Product UI Native

on:
  pull_request:
    branches:
      - integration/gen4-polish-hardware-20260928
      - feature/gen4-full-editor-20260928
    paths:
      - 'include/UI/AppShellModel.h'
      - 'include/UI/AppShellScreen.h'
      - 'include/UI/ProductChrome.h'
      - 'include/UI/GameLaunchModel.h'
      - 'include/UI/GameLauncher.h'
      - 'include/UI/OrganizationPreviewModel.h'
      - 'src/UI/AppShellScreen.cpp'
      - 'src/UI/GameLauncher.cpp'
      - 'include/UI/Gen2HeldItemPicker.h'
      - 'src/UI/Gen2PokemonPickerOverlay.inc'
      - 'src/UI/Gen2UnifiedPokemonWorkspace.inc'
      - 'src/UI/Gen2SharedSurfaceParity.inc'
      - 'src/UI/Dialogs/SaveConfirmDialog.cpp'
      - 'src/UI/UI.cpp'
      - 'include/UI/SaveSelectScreen.h'
      - 'include/UI/UI.h'
      - 'src/UI/SaveSelectScreen.cpp'
      - 'src/UI/SystemIcons.cpp'
      - 'include/UI/SystemIcons.h'
      - 'src/Games/GameIdentity.cpp'
      - 'include/Games/GameIdentity.h'
      - 'romfs/trainer_portraits/**'
      - 'romfs/region_backdrops/**'
      - 'tools/fetch_product_art.py'
      - 'include/Utils/PokeBankPaths.h'
      - 'Makefile.host'
      - 'Makefile.host.product-ui'
      - 'tests/test_app_shell_model.cpp'
      - 'tests/test_organization_preview_model.cpp'
      - 'tests/test_game_launch_model.cpp'
      - 'tests/test_game_hub_contract.py'
      - 'tests/test_reachable_ui_consistency.py'
      - '.github/workflows/product-ui-native.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RECOVERY_SHA: 5bfc27a10de1eeaf52cb92316c1453df3d4fb613

jobs:
  native:
    name: product shell devkitA64 compile/link/package
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact application head
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact application identity and product-shell model
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check HEAD^ HEAD
          make -f Makefile.host product-ui-test
          python3 tests/test_reachable_ui_consistency.py
          python3 tests/test_game_hub_contract.py
          echo "APPLICATION_SHA=$EXPECTED_SHA"
          echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')"

      - name: Checkout permanent recovery snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RECOVERY_SHA }}
          path: recovery-work
          fetch-depth: 1

      - name: Recover complete RomFS and run asset preflight
        run: |
          set -euo pipefail
          test "$(git -C recovery-work rev-parse HEAD)" = "$RECOVERY_SHA"
          python3 tools/fetch_product_art.py
          (cd recovery-work && python3 tools/recover_workspace.py)

          # Recovery supplies the large immutable baseline RomFS. Preserve presentation assets
          # that intentionally live on the active application branch before replacing that tree.
          rm -rf branch-romfs-overrides
          mkdir -p branch-romfs-overrides
          for d in trainer_portraits region_backdrops; do
            if [ -d "romfs/$d" ]; then
              cp -a "romfs/$d" "branch-romfs-overrides/$d"
            fi
          done

          rm -rf romfs
          cp -a recovery-work/romfs romfs
          for d in trainer_portraits region_backdrops; do
            if [ -d "branch-romfs-overrides/$d" ]; then
              rm -rf "romfs/$d"
              cp -a "branch-romfs-overrides/$d" "romfs/$d"
            fi
          done
          for f in red leaf gold kris brendan may lucas dawn ethan lyra chase elaine victor gloria rei akari florian juliana paxton harmony; do
            test -s "romfs/trainer_portraits/$f.png"
          done
          for f in kanto johto hoenn sinnoh unova kalos alola galar hisui paldea; do
            test -s "romfs/region_backdrops/$f.png"
          done

          for f in gold_gbc silver_gbc crystal_gbc diamond_nds pearl_nds platinum_nds heartgold_nds soulsilver_nds; do
            test -s "assets/game_cards/$f.png"
            cp "assets/game_cards/$f.png" "romfs/game_cards/$f.png"
          done
          python3 tools/check_device_assets.py

      - name: Clean devkitA64 compile and link
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282 bash -lc '
            set -euo pipefail
            : "${DEVKITPRO:?DEVKITPRO is not set}"
            git config --global --add safe.directory /work
            make clean || true
            make -j1
            test -s PokeBankNX.elf
            test -s PokeBankNX.nro
          ' 2>&1 | tee product-ui-native-build.log

      - name: Verify presentation payload in final NRO
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct

          nro = Path("PokeBankNX.nro").read_bytes()

          def verify_png(path: Path):
              data = path.read_bytes()
              if len(data) < 33 or data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                  raise SystemExit(f"{path}: invalid PNG header")
              width, height = struct.unpack(">II", data[16:24])
              offset = 8
              saw_iend = False
              while offset + 12 <= len(data):
                  length = struct.unpack(">I", data[offset:offset+4])[0]
                  end = offset + 12 + length
                  if end > len(data):
                      raise SystemExit(f"{path}: truncated PNG chunk")
                  kind = data[offset+4:offset+8]
                  offset = end
                  if kind == b"IEND":
                      saw_iend = True
                      break
              if not saw_iend:
                  raise SystemExit(f"{path}: PNG has no complete IEND")
              if width <= 0 or height <= 0:
                  raise SystemExit(f"{path}: invalid dimensions")
              if data not in nro:
                  raise SystemExit(f"{path}: exact PNG bytes are missing from final NRO RomFS")
              return width, height

          trainer_dir = Path("romfs/trainer_portraits")
          for name in ("red", "leaf", "gold", "kris", "brendan", "may", "lucas", "dawn", "ethan", "lyra", "chase", "elaine", "victor", "gloria", "rei", "akari", "florian", "juliana", "paxton", "harmony"):
              verify_png(trainer_dir / f"{name}.png")

          region_dir = Path("romfs/region_backdrops")
          for name in ("kanto", "johto", "hoenn", "sinnoh", "unova", "kalos", "alola", "galar", "hisui", "paldea"):
              verify_png(region_dir / f"{name}.png")

          if b"romfs:/trainer_portraits/" not in nro:
              raise SystemExit("trainer portrait runtime path is missing from final NRO")
          if b"romfs:/region_backdrops/" not in nro:
              raise SystemExit("region backdrop runtime path is missing from final NRO")
          print("final NRO presentation payload verified")
          PY

      - name: Package product UI hardware artifact
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=8 HEAD)"
          out="product-ui-artifact"
          mkdir -p "$out"
          cp PokeBankNX.nro "$out/PokeBank-NX-Product-UI-$short.nro"
          sha256sum "$out/PokeBank-NX-Product-UI-$short.nro" > "$out/SHA256SUMS.txt"
          printf 'APPLICATION_SHA=%s\nTREE_SHA=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" > "$out/BUILD_IDENTITY.txt"

      - name: Upload product UI NRO and native log
        uses: actions/upload-artifact@v4
        with:
          name: PokeBank-NX-Product-UI-${{ github.run_id }}
          path: |
            product-ui-artifact/
            product-ui-native-build.log
          if-no-files-found: error
          retention-days: 30

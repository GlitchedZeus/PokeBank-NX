name: Gen II Semantic Roundtrip Diagnostic

on:
  push:
    branches:
      - dev/gen2-pokemon-editor-20260912

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Identity
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Inject field-level diagnostics in workspace only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/Integration/Gen2/Gen2StagedEditor.cpp')
          s = p.read_text()
          old = '''bool samePokemon(const PokemonRecord& a, const PokemonRecord& b) noexcept {
    return a.species == b.species && a.heldItem == b.heldItem && a.moves == b.moves &&
           a.trainerId == b.trainerId && a.experience == b.experience &&
           a.statExperience == b.statExperience && a.dvs == b.dvs && a.pp == b.pp &&
           a.ppUps == b.ppUps && a.friendship == b.friendship && a.pokerus == b.pokerus &&
           a.caughtData == b.caughtData && a.level == b.level && a.originalTrainer == b.originalTrainer &&
           a.nickname == b.nickname && a.isEgg == b.isEgg && a.shiny == b.shiny &&
           a.gender == b.gender;
}
'''
          new = '''std::string pokemonMismatchDetail(const PokemonRecord& reparsed, const PokemonRecord& expected) {
    std::ostringstream os;
    auto add = [&](const char* field, const auto& actual, const auto& wanted) {
        if (actual == wanted) return;
        if (os.tellp() > 0) os << "; ";
        os << field << " expected=" << +wanted << " reparsed=" << +actual;
    };
    add("species", reparsed.species, expected.species);
    add("heldItem", reparsed.heldItem, expected.heldItem);
    add("trainerId", reparsed.trainerId, expected.trainerId);
    add("experience", reparsed.experience, expected.experience);
    for (std::size_t i = 0; i < 4; ++i) {
        add((std::string("move") + std::to_string(i + 1)).c_str(), reparsed.moves[i], expected.moves[i]);
        add((std::string("pp") + std::to_string(i + 1)).c_str(), reparsed.pp[i], expected.pp[i]);
        add((std::string("ppUps") + std::to_string(i + 1)).c_str(), reparsed.ppUps[i], expected.ppUps[i]);
    }
    for (std::size_t i = 0; i < 5; ++i) {
        add((std::string("statExp") + std::to_string(i)).c_str(), reparsed.statExperience[i], expected.statExperience[i]);
        add((std::string("dv") + std::to_string(i)).c_str(), reparsed.dvs[i], expected.dvs[i]);
    }
    add("friendship", reparsed.friendship, expected.friendship);
    add("pokerus", reparsed.pokerus, expected.pokerus);
    add("caughtData", reparsed.caughtData, expected.caughtData);
    add("level", reparsed.level, expected.level);
    add("isEgg", reparsed.isEgg, expected.isEgg);
    add("shiny", reparsed.shiny, expected.shiny);
    add("gender", reparsed.gender, expected.gender);
    if (reparsed.originalTrainer != expected.originalTrainer) {
        if (os.tellp() > 0) os << "; ";
        os << "originalTrainer expected='" << expected.originalTrainer << "' reparsed='" << reparsed.originalTrainer << "'";
    }
    if (reparsed.nickname != expected.nickname) {
        if (os.tellp() > 0) os << "; ";
        os << "nickname expected='" << expected.nickname << "' reparsed='" << reparsed.nickname << "'";
    }
    return os.str();
}

bool samePokemon(const PokemonRecord& a, const PokemonRecord& b) noexcept {
    return pokemonMismatchDetail(a, b).empty();
}
'''
          if old not in s:
              raise SystemExit('samePokemon anchor not found')
          s = s.replace(old, new, 1)
          old2 = '''    auto verified = boxedPokemon(box, slot, error);
    if (!verified || !samePokemon(*verified, after)) {
        if (error.empty()) error = "staged Generation II Pokemon edit failed semantic round-trip";
'''
          new2 = '''    auto verified = boxedPokemon(box, slot, error);
    if (!verified || !samePokemon(*verified, after)) {
        if (error.empty()) {
            const std::string mismatch = verified ? pokemonMismatchDetail(*verified, after) : std::string("reparse unavailable");
            error = "staged Generation II Pokemon edit failed semantic round-trip: " + mismatch;
        }
'''
          if old2 not in s:
              raise SystemExit('roundtrip anchor not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)

          t = Path('tests/test_gsc_pokemon_editor.cpp')
          ts = t.read_text()
          anchor = '    assert(editor->stageBoxPokemonEdit(0,0,edit,error));\n'
          repl = '''    if (!editor->stageBoxPokemonEdit(0,0,edit,error)) {
        std::cerr << "GEN2_COMPOUND_ROUNDTRIP_FAILURE: " << error << "\\n";
        return;
    }
'''
          if anchor not in ts:
              raise SystemExit('compound test anchor not found')
          ts = ts.replace(anchor, repl, 1)
          t.write_text(ts)
          PY
      - name: Build focused test
        run: |
          make -f Makefile.host.editor build-host/test_gsc_pokemon_editor
      - name: Run focused diagnostic
        run: |
          set -o pipefail
          ./build-host/test_gsc_pokemon_editor 2>&1 | tee /tmp/gen2-diagnostic.log
          grep -F 'GEN2_COMPOUND_ROUNDTRIP_FAILURE:' /tmp/gen2-diagnostic.log

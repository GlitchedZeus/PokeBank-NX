name: One-time full editor picker touch

on:
  push:
    branches: [feature/touch-controls-20261005]
    paths:
      - .github/workflows/one-time-full-touch-pickers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact head
        run: |
          set -euo pipefail
          git fetch origin feature/touch-controls-20261005
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/feature/touch-controls-20261005)" = "$GITHUB_SHA"
      - name: Add direct touch to exact-format pickers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def once(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != 1: raise SystemExit(f'{path}: expected one match, got {n}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1))

          # ---- Gen II held-item grid ----------------------------------------------------------
          p=Path('src/UI/Gen2PokemonEditorFoundation.inc'); s=p.read_text()
          s=s.replace('''bool handleItemPicker(TrainerViewScreen& screen, State& state, uint64_t down, uint64_t held,\n                      int stickX, int stickY) {\n''',
                      '''bool handleItemPicker(TrainerViewScreen& screen, State& state, uint64_t down, uint64_t held,\n                      int stickX, int stickY, const TouchInput& touch) {\n''',1)
          needle='''    const int count = static_cast<int>(state.itemChoices.size());\n    using PokeBank::UIModel::Gen2HeldItemPicker::move;\n'''
          repl='''    const int count = static_cast<int>(state.itemChoices.size());\n    using PokeBank::UIModel::Gen2HeldItemPicker::move;\n    const int touchDown = screen.touchedButtonDownId(touch);\n    if (touchDown >= 3000 && touchDown < 3000 + count) state.itemChoiceIndex = touchDown - 3000;\n    const int touchTap = screen.touchedButtonId(touch);\n    if (touchTap >= 3000 && touchTap < 3000 + count) {\n        state.itemChoiceIndex = touchTap - 3000;\n        down |= HidNpadButton_A;\n    }\n    if (touch.justReleased() && touch.dragged()) {\n        const int dx = touch.deltaX(), dy = touch.deltaY();\n        const int ax = std::abs(dx), ay = std::abs(dy);\n        if (ay >= ax && ay >= 28)\n            state.itemChoiceIndex = move(state.itemChoiceIndex, count, 0, dy < 0 ? 1 : -1);\n        else if (ax >= 28)\n            state.itemChoiceIndex = move(state.itemChoiceIndex, count, dx < 0 ? 1 : -1, 0);\n    }\n'''
          if s.count(needle)!=1: raise SystemExit('Gen2 held input anchor mismatch')
          s=s.replace(needle,repl,1)
          s=s.replace('''    if (state.itemPicker) return handleItemPicker(screen, state, down, held, stickX, stickY);\n''',
                      '''    if (state.itemPicker) return handleItemPicker(screen, state, down, held, stickX, stickY, touch);\n''',1)
          s=s.replace('''void drawHeldItemPicker(PKSEFramebuffer& fb, const State& state) {\n''',
                      '''void drawHeldItemPicker(TrainerViewScreen& screen, PKSEFramebuffer& fb, const State& state) {\n''',1)
          draw_anchor='''    fb.drawText(x + 24, y + 52,\n        "Page " + std::to_string(state.itemChoiceIndex / Model::pageSize + 1) + " / " + std::to_string(pages),\n        Colors::TextDim, TextStyle::Caption);\n    Gen2HeldItemPickerPresentation::drawList(fb, x + 24, y + 90, w - 48, state.itemChoices, state.itemChoiceIndex);\n'''
          draw_repl='''    fb.drawText(x + 24, y + 52,\n        "Page " + std::to_string(state.itemChoiceIndex / Model::pageSize + 1) + " / " + std::to_string(pages),\n        Colors::TextDim, TextStyle::Caption);\n    screen.touchButtons.clear();\n    const int first = state.itemChoiceIndex / Model::pageSize * Model::pageSize;\n    const int last = std::min(static_cast<int>(state.itemChoices.size()), first + Model::pageSize);\n    const int gridX = x + 24, gridY = y + 90, gridW = w - 48;\n    const int cellW = gridW / Model::columns;\n    for (int i = first; i < last; ++i) {\n        const int off = i - first;\n        const int cx = gridX + (off % Model::columns) * cellW;\n        const int cy = gridY + (off / Model::columns) * 32;\n        screen.touchButtons.push_back({3000 + i, cx, cy, cellW - 12, 30});\n    }\n    Gen2HeldItemPickerPresentation::drawList(fb, gridX, gridY, gridW, state.itemChoices, state.itemChoiceIndex);\n'''
          if s.count(draw_anchor)!=1: raise SystemExit('Gen2 held draw anchor mismatch')
          s=s.replace(draw_anchor,draw_repl,1)
          s=s.replace('''    if (state.itemPicker) drawHeldItemPicker(fb, state);\n''',
                      '''    if (state.itemPicker) drawHeldItemPicker(screen, fb, state);\n''',1)
          p.write_text(s)

          # ---- Gen II species / move / Crystal location picker -------------------------------
          p=Path('src/UI/Gen2PokemonPickerOverlay.inc'); s=p.read_text()
          s=s.replace('''void drawListPicker(TrainerViewScreen& screen, PKSEFramebuffer& fb, const State& state,\n                    const Gen2Picker::Model& model) {\n''',
                      '''void drawListPicker(TrainerViewScreen& screen, PKSEFramebuffer& fb, const State& state,\n                    const Gen2Picker::Model& model) {\n    screen.touchButtons.clear();\n''',1)
          species_anchor='''        SharedSpeciesPicker::drawContent(\n            fb, modal.x, modal.y, model.speciesChoice(), 251, model.previewShiny,\n'''
          species_repl='''        const int speciesStart = std::clamp(model.speciesChoice() - 9 / 2, 1, 251 - 9 + 1);\n        for (int i = 0; i < 9; ++i)\n            screen.touchButtons.push_back({2000 + speciesStart + i, modal.x + 20, modal.y + 84 + i * 43, 560, 39});\n        SharedSpeciesPicker::drawContent(\n            fb, modal.x, modal.y, model.speciesChoice(), 251, model.previewShiny,\n'''
          if s.count(species_anchor)!=1: raise SystemExit('Gen2 species draw anchor mismatch')
          s=s.replace(species_anchor,species_repl,1)
          loop_anchor='''        const int yy = y + 88 + (i - first) * 33;\n        const bool selected = i == model.index;\n'''
          loop_repl='''        const int yy = y + 88 + (i - first) * 33;\n        const bool selected = i == model.index;\n        screen.touchButtons.push_back({2000 + i, x + 20, yy - 5, panelW - 40, 30});\n'''
          if s.count(loop_anchor)!=1: raise SystemExit('Gen2 list row anchor mismatch')
          s=s.replace(loop_anchor,loop_repl,1)
          input_anchor='''    const uint64_t nav = screen.controllerNavigation.apply(\n        down, held, stickX, stickY,\n        HidNpadButton_Up, HidNpadButton_Down, HidNpadButton_Left, HidNpadButton_Right);\n\n    if (down & HidNpadButton_B) {\n'''
          input_repl='''    int touchDown = screen.touchedButtonDownId(touch);\n    if (touchDown >= 2000) {\n        if (picker.model.kind == Gen2Picker::Kind::Species) picker.model.index = std::clamp(touchDown - 2000, 1, 251);\n        else {\n            const int count = picker.model.kind == Gen2Picker::Kind::Location ? picker.model.locationCount() : 252;\n            picker.model.index = std::clamp(touchDown - 2000, 0, std::max(0, count - 1));\n        }\n    }\n    int touchTap = screen.touchedButtonId(touch);\n    if (touchTap >= 2000) {\n        if (picker.model.kind == Gen2Picker::Kind::Species) picker.model.index = std::clamp(touchTap - 2000, 1, 251);\n        else {\n            const int count = picker.model.kind == Gen2Picker::Kind::Location ? picker.model.locationCount() : 252;\n            picker.model.index = std::clamp(touchTap - 2000, 0, std::max(0, count - 1));\n        }\n        down |= HidNpadButton_A;\n    }\n    if (touch.justReleased() && touch.dragged()) {\n        const int dy = touch.deltaY();\n        const int steps = std::max(1, std::abs(dy) / 36);\n        picker.model.stepList(dy < 0 ? steps : -steps);\n    }\n\n    const uint64_t nav = screen.controllerNavigation.apply(\n        down, held, stickX, stickY,\n        HidNpadButton_Up, HidNpadButton_Down, HidNpadButton_Left, HidNpadButton_Right);\n\n    if (down & HidNpadButton_B) {\n'''
          if s.count(input_anchor)!=1: raise SystemExit(f'Gen2 picker input anchor mismatch {s.count(input_anchor)}')
          s=s.replace(input_anchor,input_repl,1)
          p.write_text(s)

          # ---- Gen II special hardware Move picker --------------------------------------------
          p=Path('src/UI/Gen2HardwarePickerFix.inc'); s=p.read_text()
          s=s.replace('''    const int last = std::min(count, first + visible);\n    for (int i = first; i < last; ++i) {\n''',
                      '''    const int last = std::min(count, first + visible);\n    screen.touchButtons.clear();\n    for (int i = first; i < last; ++i) {\n''',1)
          hwrow='''        const uint16_t move = choices[static_cast<std::size_t>(i)];\n        const bool selected = i == selectedPos;\n'''
          hwrow2='''        const uint16_t move = choices[static_cast<std::size_t>(i)];\n        const bool selected = i == selectedPos;\n        screen.touchButtons.push_back({2100 + i, x + 24, yy, panelW - 48, layout.highlightHeight});\n'''
          if s.count(hwrow)!=1: raise SystemExit('Gen2 hardware row anchor mismatch')
          s=s.replace(hwrow,hwrow2,1)
          hwinput='''    const uint64_t nav = screen.controllerNavigation.apply(\n        down, held, stickX, stickY,\n        HidNpadButton_Up, HidNpadButton_Down, HidNpadButton_Left, HidNpadButton_Right);\n\n    if (down & HidNpadButton_B) {\n'''
          hwrepl='''    const auto touchChoices = hardwareCompatibleMoveChoices(screen, state);\n    const int touchDown = screen.touchedButtonDownId(touch);\n    if (touchDown >= 2100 && touchDown < 2100 + static_cast<int>(touchChoices.size()))\n        picker.model.index = static_cast<int>(touchChoices[static_cast<std::size_t>(touchDown - 2100)]);\n    const int touchTap = screen.touchedButtonId(touch);\n    if (touchTap >= 2100 && touchTap < 2100 + static_cast<int>(touchChoices.size())) {\n        picker.model.index = static_cast<int>(touchChoices[static_cast<std::size_t>(touchTap - 2100)]);\n        down |= HidNpadButton_A;\n    }\n    if (touch.justReleased() && touch.dragged()) {\n        const int steps = std::max(1, std::abs(touch.deltaY()) / std::max(1, layout.rowStep));\n        stepHardwareMovePicker(screen, state, picker, touch.deltaY() < 0 ? steps : -steps);\n    }\n\n    const uint64_t nav = screen.controllerNavigation.apply(\n        down, held, stickX, stickY,\n        HidNpadButton_Up, HidNpadButton_Down, HidNpadButton_Left, HidNpadButton_Right);\n\n    if (down & HidNpadButton_B) {\n'''
          if s.count(hwinput)!=1: raise SystemExit('Gen2 hardware input anchor mismatch')
          s=s.replace(hwinput,hwrepl,1)
          p.write_text(s)

          # ---- Shared Gen III and Gen IV value pickers ----------------------------------------
          for path, prefix in [('src/UI/Gen3SharedPokemonSurface.inc',4000),('src/UI/Gen4SharedPokemonSurface.inc',6000)]:
              p=Path(path); s=p.read_text()
              # Stop discarding touch.
              s=s.replace('    (void)touch;\n', '', 1)
              # Make value picker receive touch.
              s=s.replace('bool handleValuePicker(TrainerViewScreen& screen, State& state, u64 down) {',
                          'bool handleValuePicker(TrainerViewScreen& screen, State& state, u64 down, const TouchInput& touch) {',1)
              s=s.replace('if (handleValuePicker(screen, state, down)) return true;',
                          'if (handleValuePicker(screen, state, down, touch)) return true;',1)
              # If workspace itself doesn't carry touch yet, update its signature and caller.
              s=s.replace('bool handleWorkspace(TrainerViewScreen& screen, State& state, u64 down) {',
                          'bool handleWorkspace(TrainerViewScreen& screen, State& state, u64 down, const TouchInput& touch) {',1)
              s=s.replace('if (handleWorkspace(screen, state, navigated)) return true;',
                          'if (handleWorkspace(screen, state, navigated, touch)) return true;',1)
              # Picker input: exact cell/row focus + release activation + drag browsing.
              anchor='''    const int count = static_cast<int>(state.pickerValues.size());\n    if (count <= 0) {\n'''
              if anchor not in s:
                  anchor='''    const int count = static_cast<int>(state.pickerValues.size());\n    if (state.pickerValues.empty()) {\n'''
              if anchor not in s: raise SystemExit(f'{path}: value count anchor missing')
              inject=f'''    const int count = static_cast<int>(state.pickerValues.size());\n    const int touchDown = screen.touchedButtonDownId(touch);\n    if (touchDown >= {prefix} && touchDown < {prefix} + count) state.pickerRow = touchDown - {prefix};\n    const int touchTap = screen.touchedButtonId(touch);\n    if (touchTap >= {prefix} && touchTap < {prefix} + count) {{\n        state.pickerRow = touchTap - {prefix};\n        down |= HidNpadButton_A;\n    }}\n    if (touch.justReleased() && touch.dragged()) {{\n        const int dx = touch.deltaX(), dy = touch.deltaY();\n        const int ax = std::abs(dx), ay = std::abs(dy);\n        if (state.pickerTarget == PickerTarget::HeldItem) {{\n            if (ay >= ax && ay >= 28) state.pickerRow = HeldItemGrid::move(state.pickerRow, count, 0, dy < 0 ? 1 : -1);\n            else if (ax >= 28) state.pickerRow = HeldItemGrid::move(state.pickerRow, count, dx < 0 ? 1 : -1, 0);\n        }} else {{\n            const int steps = std::max(1, ay / 40);\n            if (dy < 0) state.pickerRow = std::min(count - 1, state.pickerRow + steps);\n            else if (dy > 0) state.pickerRow = std::max(0, state.pickerRow - steps);\n        }}\n    }}\n    if (count <= 0) {{\n'''
              if 'if (count <= 0)' in anchor:
                  s=s.replace(anchor,inject,1)
              else:
                  # Gen4 checks empty before count; inject after that guard instead.
                  old='''    if (state.pickerValues.empty()) {\n        state.valuePicker = false;\n        return true;\n    }\n    const int count = static_cast<int>(state.pickerValues.size());\n'''
                  new=f'''    if (state.pickerValues.empty()) {{\n        state.valuePicker = false;\n        return true;\n    }}\n    const int count = static_cast<int>(state.pickerValues.size());\n    const int touchDown = screen.touchedButtonDownId(touch);\n    if (touchDown >= {prefix} && touchDown < {prefix} + count) state.pickerRow = touchDown - {prefix};\n    const int touchTap = screen.touchedButtonId(touch);\n    if (touchTap >= {prefix} && touchTap < {prefix} + count) {{ state.pickerRow = touchTap - {prefix}; down |= HidNpadButton_A; }}\n    if (touch.justReleased() && touch.dragged()) {{\n        const int dx=touch.deltaX(), dy=touch.deltaY(), ax=std::abs(dx), ay=std::abs(dy);\n        if (state.pickerTarget == PickerTarget::HeldItem) {{\n            if (ay >= ax && ay >= 28) state.pickerRow = HeldItemGrid::move(state.pickerRow,count,0,dy < 0 ? 1 : -1);\n            else if (ax >= 28) state.pickerRow = HeldItemGrid::move(state.pickerRow,count,dx < 0 ? 1 : -1,0);\n        }} else {{\n            const int steps=std::max(1, ay/40);\n            if (dy < 0) state.pickerRow=std::min(count-1,state.pickerRow+steps);\n            else if (dy > 0) state.pickerRow=std::max(0,state.pickerRow-steps);\n        }}\n    }}\n'''
                  if old not in s: raise SystemExit(f'{path}: Gen4 value guard mismatch')
                  s=s.replace(old,new,1)
              # Draw target registry for held grid.
              held_anchor='''            const bool selected = i == state.pickerRow;\n            if (selected)\n                fb.drawSelectionHighlight(cellX, cellY - 3, cellWidth - 10, cellHeight - 4);\n'''
              held_repl=f'''            const bool selected = i == state.pickerRow;\n            screen.touchButtons.push_back({{{prefix} + i, cellX, cellY - 3, cellWidth - 10, cellHeight - 4}});\n            if (selected)\n                fb.drawSelectionHighlight(cellX, cellY - 3, cellWidth - 10, cellHeight - 4);\n'''
              if held_anchor not in s: raise SystemExit(f'{path}: held grid draw mismatch')
              s=s.replace(held_anchor,held_repl,1)
              # Move picker rows.
              move_anchor='''            const bool selected = i == state.pickerRow;\n            if (selected)\n                fb.drawSelectionHighlight(x + 24, yy, w - 48, moveLayout.highlightHeight);\n'''
              if move_anchor in s:
                  move_repl=f'''            const bool selected = i == state.pickerRow;\n            screen.touchButtons.push_back({{{prefix} + i, x + 24, yy, w - 48, moveLayout.highlightHeight}});\n            if (selected)\n                fb.drawSelectionHighlight(x + 24, yy, w - 48, moveLayout.highlightHeight);\n'''
                  s=s.replace(move_anchor,move_repl,1)
              # Normal picker rows.
              normal_anchor='''        const bool selected = i == state.pickerRow;\n        if (selected) fb.drawSelectionHighlight(x + 22, yy - 4, w - 44, 38);\n'''
              normal_repl=f'''        const bool selected = i == state.pickerRow;\n        screen.touchButtons.push_back({{{prefix} + i, x + 22, yy - 4, w - 44, 38}});\n        if (selected) fb.drawSelectionHighlight(x + 22, yy - 4, w - 44, 38);\n'''
              if normal_anchor not in s: raise SystemExit(f'{path}: normal picker row mismatch')
              s=s.replace(normal_anchor,normal_repl,1)
              # Each modal owns the direct-row registry for the next input frame.
              draw_sig='''void drawValuePicker(TrainerViewScreen& screen, PKSEFramebuffer& fb, State& state) {\n    if (!state.valuePicker || state.pickerValues.empty()) return;\n'''
              draw_new='''void drawValuePicker(TrainerViewScreen& screen, PKSEFramebuffer& fb, State& state) {\n    if (!state.valuePicker || state.pickerValues.empty()) return;\n    screen.touchButtons.clear();\n'''
              if s.count(draw_sig)!=1: raise SystemExit(f'{path}: value draw signature mismatch')
              s=s.replace(draw_sig,draw_new,1)
              p.write_text(s)
          PY
          git diff --check
          ! grep -n '(void)touch' src/UI/Gen3SharedPokemonSurface.inc src/UI/Gen4SharedPokemonSurface.inc
          grep -q '3000 + i' src/UI/Gen2PokemonEditorFoundation.inc
          grep -q '4000 + i' src/UI/Gen3SharedPokemonSurface.inc
          grep -q '6000 + i' src/UI/Gen4SharedPokemonSurface.inc
      - name: Commit picker touch runtime only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/UI/Gen2PokemonEditorFoundation.inc src/UI/Gen2PokemonPickerOverlay.inc src/UI/Gen2HardwarePickerFix.inc src/UI/Gen3SharedPokemonSurface.inc src/UI/Gen4SharedPokemonSurface.inc
          git diff --cached --quiet && { echo 'No picker touch changes'; exit 1; }
          git commit -m 'feat(ui): add native touch to held-item and value pickers'
          git push origin HEAD:feature/touch-controls-20261005

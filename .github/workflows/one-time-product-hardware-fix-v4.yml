name: One-time Product Home forwarder and UI hardware fix v4

on:
  push:
    branches:
      - feature/gen4-full-editor-20260928
    paths:
      - .github/workflows/one-time-product-hardware-fix-v4.yml

permissions:
  contents: write

jobs:
  patch-forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gen4-full-editor-20260928
          fetch-depth: 0

      - name: Verify exact branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/gen4-full-editor-20260928
          test "$(git rev-parse origin/feature/gen4-full-editor-20260928)" = "$GITHUB_SHA"

      - name: Apply hardware feedback forward
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          launcher_path = Path("src/UI/GameLauncher.cpp")
          launcher = launcher_path.read_text(encoding="utf-8")

          old_compact = '''std::string compactGameTitle(std::string_view value) {
              std::string out;
              out.reserve(value.size());
              for (unsigned char c : value)
                  if (std::isalnum(c)) out.push_back(static_cast<char>(std::tolower(c)));
              return out;
          }
          '''
          new_compact = '''std::string compactGameTitle(std::string_view value) {
              std::string out;
              out.reserve(value.size());
              for (size_t i = 0; i < value.size(); ++i) {
                  const unsigned char c = static_cast<unsigned char>(value[i]);
                  // HOME forwarders commonly use the official “Pokémon” spelling. Preserve the
                  // identity word instead of dropping UTF-8 é and turning it into “pokmon”.
                  if (c == 0xC3 && i + 1 < value.size()) {
                      const unsigned char next = static_cast<unsigned char>(value[i + 1]);
                      if (next == 0xA9 || next == 0x89) {
                          out.push_back('e');
                          ++i;
                          continue;
                      }
                  }
                  if (c < 0x80 && std::isalnum(c))
                      out.push_back(static_cast<char>(std::tolower(c)));
              }
              return out;
          }

          bool installedForwarderNameMatches(std::string_view gameId, std::string_view normalizedName) {
              auto shaped = [&](std::string_view token) {
                  const std::string plain(token);
                  const std::string version = plain + "version";
                  const std::string pokemon = "pokemon" + plain;
                  const std::string pokemonVersion = pokemon + "version";
                  return normalizedName == plain || normalizedName == version ||
                         normalizedName == pokemon || normalizedName == pokemonVersion ||
                         normalizedName.rfind(pokemon, 0) == 0;
              };

              // Match the release, not a loose substring. This deliberately prevents Red from
              // stealing FireRed, Gold from HeartGold, Ruby from Omega Ruby, and so on.
              if (gameId == "red_gb")         return shaped("red");
              if (gameId == "blue_gb")        return shaped("blue");
              if (gameId == "yellow_gb")      return shaped("yellow");
              if (gameId == "gold_gbc")       return shaped("gold");
              if (gameId == "silver_gbc")     return shaped("silver");
              if (gameId == "crystal_gbc")    return shaped("crystal");
              if (gameId == "ruby_gba")       return shaped("ruby");
              if (gameId == "sapphire_gba")   return shaped("sapphire");
              if (gameId == "firered_gba")    return shaped("firered");
              if (gameId == "leafgreen_gba")  return shaped("leafgreen");
              if (gameId == "emerald_gba")    return shaped("emerald");
              if (gameId == "diamond_nds")    return shaped("diamond");
              if (gameId == "pearl_nds")      return shaped("pearl");
              if (gameId == "platinum_nds")   return shaped("platinum");
              if (gameId == "heartgold_nds")  return shaped("heartgold");
              if (gameId == "soulsilver_nds") return shaped("soulsilver");
              return false;
          }
          '''
          launcher = replace_once(launcher, old_compact, new_compact,
                                  "forwarder title normalization helper")

          old_setup = '''    const auto* game = PokeVault::Games::findGame(gameId);
              if (!game) { cache[key] = 0; return 0; }
              const std::string wanted = compactGameTitle(game->title);
              if (wanted.size() < 4) { cache[key] = 0; return 0; }
          '''
          new_setup = '''    if (!PokeVault::Games::findGame(gameId)) { cache[key] = 0; return 0; }
          '''
          launcher = replace_once(launcher, old_setup, new_setup,
                                  "forwarder game identity setup")

          old_match = '''                    if (name.find("pokemon") != std::string::npos &&
                              name.find(wanted) != std::string::npos) {
          '''
          new_match = '''                    if (installedForwarderNameMatches(gameId, name)) {
          '''
          launcher = replace_once(launcher, old_match, new_match,
                                  "installed HOME forwarder matcher")
          launcher_path.write_text(launcher, encoding="utf-8")

          source_path = Path("src/UI/SaveSelectScreen.cpp")
          source = source_path.read_text(encoding="utf-8")

          source = replace_once(source,
              'Color(5, 14, 30, 54)', 'Color(5, 14, 30, 40)',
              'region readability scrim')
          source = replace_once(source,
              'Color(3, 10, 24, 132)', 'Color(3, 10, 24, 104)',
              'hero information glass')
          source = replace_once(source,
              'fb.drawFilledCircle(cx, cy, buttonD / 2, Colors::SurfaceRaised);',
              'fb.drawFilledCircle(cx, cy, buttonD / 2,\n'
              '                                focused ? withAlpha(Colors::Info, 46) : Colors::PanelAlt);',
              'dock focus fill')

          old_legacy = '''        } else if (game.sourceKind == SelectedSourceKind::RetroArchFRLG) {
              legacyInstanceIndex = 0;
              legacyInstanceScroll = 0;
              legacyNotice.clear();
              overlay = Overlay::LegacyInstances;
          } else if (launchDescriptor.state == GameLaunchState::NeedsContentLink) {
          '''
          new_legacy = '''        } else if (game.sourceKind == SelectedSourceKind::RetroArchFRLG) {
              // X on Games is Save / Source assignment. If another validated battery save for this
              // exact game is unclaimed, show it first so it can be assigned to the current profile.
              // Once no unassigned matching source remains, fall back to the existing Save Instances
              // list for inspecting/choosing the already assigned sources.
              rebuildUnassignedLegacySources();
              unassignedLegacySources.erase(
                  std::remove_if(unassignedLegacySources.begin(), unassignedLegacySources.end(),
                      [&](const LegacyAssignmentEntry& entry) { return entry.gameId != game.gameId; }),
                  unassignedLegacySources.end());
              if (!unassignedLegacySources.empty()) {
                  legacyAssignmentIndex = 0;
                  legacyAssignmentScroll = 0;
                  legacyNotice = "Choose a validated save to assign to this profile.";
                  overlay = Overlay::LegacyAssignment;
              } else {
                  legacyInstanceIndex = 0;
                  legacyInstanceScroll = 0;
                  legacyNotice.clear();
                  overlay = Overlay::LegacyInstances;
              }
          } else if (launchDescriptor.state == GameLaunchState::NeedsContentLink) {
          '''
          source = replace_once(source, old_legacy, new_legacy,
                                "Games X legacy assignment route")
          source_path.write_text(source, encoding="utf-8")

          tests_path = Path("tests/test_game_hub_contract.py")
          tests = tests_path.read_text(encoding="utf-8")
          tests = tests.replace('Color(3, 10, 24, 132)', 'Color(3, 10, 24, 104)')
          tests = tests.replace(
              '"fb.drawFilledCircle(cx, cy, buttonD / 2, Colors::SurfaceRaised);" in source,',
              '"focused ? withAlpha(Colors::Info, 46) : Colors::PanelAlt" in source,')

          marker = '''require("scrollClassicSelectionIntoView();" in classic_draw and "std::clamp(titleIndex" in classic_draw,
                  "the full Games artwork browser must normalize selection/scroll immediately after save/source changes")
          '''
          extra = marker + '''require("drawTrainerPortrait" not in classic_draw,
                  "the PKSE/full Games browser is for game/save assignment and must not show trainer portraits")
          '''
          tests = replace_once(tests, marker, extra, "PKSE trainer portrait contract")

          launch_marker = '''require("descriptor.state != GameLaunchState::LauncherOnly" in launcher,
                  "launcher-only fallbacks must never receive a falsely linked ROM argument")
          '''
          launch_extra = launch_marker + '''require("installedForwarderNameMatches" in launcher and
                  'gameId == "platinum_nds"' in launcher and
                  'gameId == "emerald_gba"' in launcher and
                  'normalizedName.rfind(pokemon, 0) == 0' in launcher,
                  "installed HOME forwarders must be matched by exact release identity before emulator fallback")
          '''
          tests = replace_once(tests, launch_marker, launch_extra,
                               "forwarder preference contract")

          assign_marker = '''require('{"X","Save / Source"}' in source and '{"Y","Sort"}' in source and
                  '{"+","Favorite"}' in source,
                  "the full Games browser footer must expose source assignment, sort and favorite actions")
          '''
          assign_extra = assign_marker + '''require("Choose a validated save to assign to this profile." in source and
                  "entry.gameId != game.gameId" in source,
                  "Games X must offer unassigned saves for the selected game/profile before existing instances")
          '''
          tests = replace_once(tests, assign_marker, assign_extra,
                               "Games assignment contract")
          tests_path.write_text(tests, encoding="utf-8")
          PY

      - name: Run focused contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_game_hub_contract.py
          g++ -std=c++20 -Iinclude tests/test_game_launch_model.cpp -o /tmp/test_game_launch_model
          /tmp/test_game_launch_model

      - name: Commit fix forward
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/gen4-full-editor-20260928
          test "$(git rev-parse origin/feature/gen4-full-editor-20260928)" = "$GITHUB_SHA"
          git config user.name "GlitchedZeus"
          git config user.email "user91746@protonmail.com"
          git add src/UI/GameLauncher.cpp src/UI/SaveSelectScreen.cpp tests/test_game_hub_contract.py
          git commit -m "fix(ui): prefer installed game forwarders and refine Product Home"
          git push origin HEAD:feature/gen4-full-editor-20260928

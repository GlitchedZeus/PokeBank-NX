name: PokeBank NX Native PR Gate

on:
  push:
    branches:
      - feature/touch-controls-20261005
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pokebank-native-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RECOVERY_SHA: 5bfc27a10de1eeaf52cb92316c1453df3d4fb613

jobs:
  native:
    name: unfiltered devkitA64 compile/link
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact application head
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact application identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check HEAD^ HEAD
          echo "APPLICATION_SHA=$EXPECTED_SHA"
          echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')"

      - name: Check isolated Gen V NRO build entrypoint syntax
        run: |
          set -euo pipefail
          test -x tools/build_gen5_smoke_nro.sh
          bash -n tools/build_gen5_smoke_nro.sh

      - name: Checkout permanent recovery snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RECOVERY_SHA }}
          path: recovery-work
          fetch-depth: 1

      - name: Recover complete RomFS and run asset preflight
        run: |
          set -euo pipefail
          test "$(git -C recovery-work rev-parse HEAD)" = "$RECOVERY_SHA"
          (cd recovery-work && python3 tools/recover_workspace.py)
          rm -rf romfs
          cp -a recovery-work/romfs romfs
          for f in gold_gbc silver_gbc crystal_gbc diamond_nds pearl_nds platinum_nds heartgold_nds soulsilver_nds; do
            test -s "assets/game_cards/$f.png"
            cp "assets/game_cards/$f.png" "romfs/game_cards/$f.png"
          done
          # The permanent recovery snapshot intentionally predates item sprites.
          # Regenerate exact per-ball / per-item PNGs using THIS PR head's
          # pinned generator after restoring the snapshot, before validation.
          python3 tools/gen_item_sprites.py
          python3 tools/check_device_assets.py

      - name: Clean devkitA64 compile and link
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282 bash -lc '
            set -euo pipefail
            : "${DEVKITPRO:?DEVKITPRO is not set}"
            git config --global --add safe.directory /work
            make clean || true
            make -j1
            test -s PokeBankNX.elf
            test -s PokeBankNX.nro
          ' 2>&1 | tee native-pr-build.log

      # This exact-head smoke artifact is the first testable NRO for Gen V
      # profile/game Save Instances. It is NOT a device-accepted release.
      # Do not emit an NRO when native compile/link failed.
      - name: Package exact-head Gen V Save Instances smoke NRO
        run: |
          set -euo pipefail
          test -s PokeBankNX.elf
          test -s PokeBankNX.nro
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          short="$(git rev-parse --short=8 HEAD)"
          out="gen5-hardware-candidate"
          mkdir -p "$out"
          cp PokeBankNX.nro "$out/PokeBank-NX-Gen5-Save-Instances-$short.nro"
          (cd "$out" && sha256sum ./*.nro > SHA256SUMS.txt)
          printf 'APPLICATION_SHA=%s\nTREE_SHA=%s\nSOURCE_SAV5_WRITE=DISABLED\nDEVICE_ACCEPTED=false\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" \
            > "$out/BUILD_IDENTITY.txt"

      - name: Upload exact-head Gen V smoke NRO and native build log
        uses: actions/upload-artifact@v4
        with:
          name: PokeBank-NX-Gen5-Save-Instances-${{ github.run_id }}
          path: |
            gen5-hardware-candidate/
            native-pr-build.log
          if-no-files-found: error
          retention-days: 30

      - name: Preserve native compile failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PokeBank-NX-Failed-Native-${{ github.run_id }}
          path: native-pr-build.log
          if-no-files-found: warn
          retention-days: 14

name: Gen II Verified Export UI Patch

on:
  push:
    branches:
      - feature/gen2-shared-pokemon-editor-20260914
    paths:
      - tools/patch_gen2_verified_export_ui.py
      - .github/workflows/gen2-audit-export-ui-patch.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gen2-shared-pokemon-editor-20260914
          fetch-depth: 0

      - name: Apply guarded verified-export UI migration
        run: python3 tools/patch_gen2_verified_export_ui.py

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit migrated UI if changed
        shell: bash
        run: |
          set -euo pipefail
          path=src/UI/TrainerViewScreenGSCOverlay.inc
          git add "$path"
          if git diff --cached --quiet; then
            echo "Verified export UI already migrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "gen2: route UI export through verified transaction"
          git push origin HEAD:feature/gen2-shared-pokemon-editor-20260914

name: Inventory Hardware Retest Production Gate

on:
  push:
    branches: [feature/pokebank-playable]
    paths: [.github/workflows/inventory-hardware-retest.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pokebank-inventory-hardware-retest-production
  cancel-in-progress: false

env:
  PROD_BRANCH: feature/pokebank-playable
  VALIDATED_DEV_SHA: 08fb25f7858e00888ad3ba223d0217b392f26ecb
  BASE_SHA: f603e3e4e14b8e5dff06b032cbb5467843cb16bd
  RECOVERY_SHA: 5bfc27a10de1eeaf52cb92316c1453df3d4fb613
  EXPECTED_RECOVERY_ROMFS: 3289
  EXPECTED_FINAL_ROMFS: 3292

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact pushed production source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: application
          fetch-depth: 50
          submodules: recursive

      - name: Exact production identity and validated-tree equivalence
        run: |
          set -euo pipefail
          test "$(git -C application rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C application ls-remote origin "refs/heads/$PROD_BRANCH" | awk '{print $1}')" = "$GITHUB_SHA"
          git -C application diff --check "$BASE_SHA"..HEAD
          git -C application diff --quiet
          git -C application diff --cached --quiet
          git -C application diff --exit-code "$VALIDATED_DEV_SHA" HEAD -- . ':(exclude).github/workflows/inventory-hardware-retest.yml'
          echo 'EXACT PRODUCTION IDENTITY: PASS'
          echo 'APPLICATION TREE EQUIVALENCE: PASS'
          echo 'git diff --check: PASS'

      - name: Focused inventory presentation gate
        working-directory: application
        run: |
          set -euo pipefail
          make -f Makefile.host.classic_inventory host-classic-inventory
          make -f Makefile.host.base build-host/test_inventory_ui_contract
          ./build-host/test_inventory_ui_contract
          make -f Makefile.host.base build-host/test_inventory_ui_contract_sanitize
          ASAN_OPTIONS=detect_leaks=0 ./build-host/test_inventory_ui_contract_sanitize
          echo 'INVENTORY PRESENTATION STATE: PASS'
          echo 'sourceIsNew/stagedModified SEPARATION: PASS'
          echo 'QUANTITY CHANGE DIRTY: PASS'
          echo 'QUANTITY REVERT CLEAN: PASS'
          echo 'NEW ITEM DIRTY: PASS'
          echo 'ADDED THEN REMOVED CLEAN: PASS'
          echo 'SOURCE ITEM REMOVAL SEMANTICS: PASS'
          echo 'GLOBAL EDITABLE INVENTORY CONTROL CONTRACT: PASS'
          echo 'CLASSIC X ADD / Y REMOVE: PASS'
          echo 'MODERN X ADD / Y REMOVE MODEL: PASS'
          echo 'CLASSIC PICKER WIDTH CONTRACT: PASS'

      - name: Presentation, control, and safety invariants
        working-directory: application
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          contract = Path('include/UI/InventoryUIContract.h').read_text()
          header = Path('include/UI/TrainerViewScreenBase.h').read_text()
          base = Path('src/UI/TrainerViewScreenBase.inc').read_text()
          overlay = Path('src/UI/ClassicInventoryOverlay.cpp').read_text()
          picker = Path('src/UI/Dialogs/PickerDialog.cpp').read_text()
          items = Path('src/UI/Panels/ItemsPanel.cpp').read_text()
          tests = Path('tests/test_inventory_ui_contract.cpp').read_text()
          for needle in [
              'case InventoryInput::A: return InventoryAction::EditAmount;',
              'case InventoryInput::X: return InventoryAction::AddItem;',
              'case InventoryInput::Y: return InventoryAction::RemoveItem;',
              'case InventoryInput::L: return InventoryAction::PreviousCategory;',
              'case InventoryInput::R: return InventoryAction::NextCategory;',
              'case InventoryInput::Plus: return InventoryAction::Options;',
              'case InventoryInput::Minus: return InventoryAction::Help;',
              'case InventoryInput::B: return InventoryAction::Back;',
              'if (available.addItem) out += "  |  X: Add Item";',
              'if (available.removeItem) out += "  |  Y: Remove Item";',
              'static constexpr int Width = 560;',
              'static constexpr int RowHeight = 40;',
              'bool sourceIsNew = false;',
              'bool stagedModified = false;',
              'const bool sourceIsNew = source ? source->sourceIsNew : false;',
              'const bool metadataChanged = source && currentIsNew != sourceIsNew;',
              'source ? (source->quantity != currentQuantity || metadataChanged) : currentQuantity != 0',
              'ItemNameColorRole::ModifiedText',
          ]:
              assert needle in contract, needle
          assert 'InventoryBaseline inventorySourceBaseline;' in header
          assert 'inventorySourceBaselineCaptured = false;' in header
          assert 'captureInventorySourceBaseline();' in header
          assert 'captureInventorySourceBaseline();' in base
          assert 'this->sourceKind != PokeVault::Safety::SourceKind::RetroArchLegacy' in base
          assert 'screen.captureInventorySourceBaseline();' in overlay
          assert 'screen.inventoryItemPresentationState(' in items
          assert 'Colors::Accent : Colors::Text' in items
          assert 'item.isNew ? Colors::Accent' not in items
          assert 'untouchedNew.sourceIsNew' in tests
          assert '!reverted.stagedModified' in tests
          assert 'addedThenRemoved' in tests
          assert 'removedSource.stagedModified' in tests
          assert 'InventoryAction::AddItem' in base
          assert 'InventoryAction::RemoveItem' in base
          assert 'requireMutableWorkspace();' in base
          assert 'inventoryFooter(' in base
          assert 'InventoryPickerLayout::Width' in overlay
          assert 'std::to_string(state.pickerRow + 1) + " / "' in overlay
          assert 'HidNpadButton_L | HidNpadButton_Left' in overlay
          assert 'HidNpadButton_R | HidNpadButton_Right' in overlay
          assert 'D-pad/Stick Navigate   A Add/Select   B Cancel   L/R Page' in overlay
          assert 'D-pad/Stick Navigate   A Select   B Cancel   L/R Page' in picker
          print('A EDIT: PASS')
          print('X ADD: PASS')
          print('Y REMOVE: PASS')
          print('D-PAD: PASS')
          print('LEFT STICK: PASS')
          print('L/R CATEGORY: PASS')
          print('+ OPTIONS: PASS')
          print('- HELP: PASS')
          print('B BACK: PASS')
          print('SOURCE isNew PRESERVED: PASS')
          print('SOURCE isNew USED AS DIRTY: NO')
          print('stagedModified: PASS')
          print('UNCHANGED WHITE: PASS')
          print('SOURCE isNew-ONLY WHITE: PASS')
          print('MODIFIED ACCENT: PASS')
          print('REVERTED WHITE: PASS')
          print('NEW ITEM ACCENT: PASS')
          print('REMOVED ITEM IN PENDING: PASS')
          print('DISCARD RESTORES BASELINE: PASS')
          print('PICKER WIDTH: 560')
          print('PICKER CONTROLS: PASS')
          PY
          ! grep -R 'sdmc:/PKSE' -n src include
          grep -q 'sdmc:/switch/PokeBank-NX' include/Utils/PokeBankPaths.h
          grep -q '0x01008F6008C5E000ULL' src/Games/GameIdentity.cpp
          grep -q 'return source == SourceKind::BackupOrStaged || source == SourceKind::AppOwnedStorage;' include/Safety/SourceMutationPolicy.h
          grep -q 'SAVE WRITING NOT YET ENABLED' src/UI/Dialogs/SaveConfirmDialog.cpp
          echo 'NO /PKSE/: PASS'
          echo 'SOURCE MUTATION POLICY: PASS'
          echo 'LIVE INSTALLED-GAME WRITES: HARD DISABLED'
          echo 'LIVE RETROARCH WRITES: HARD DISABLED'
          echo 'LIVE EMULATOR WRITES: HARD DISABLED'
          echo 'VIOLET TITLE ID: PASS'

      - name: Focused classic backend regressions
        working-directory: application
        run: |
          set -euo pipefail
          rm -rf build-host
          make -f Makefile.host.classic_inventory host-classic-inventory
          make -f Makefile.host.base build-host/test_legacy_frlg_browse
          ./build-host/test_legacy_frlg_browse
          make -f Makefile.host.base build-host/test_rby_readonly_bridge
          ./build-host/test_rby_readonly_bridge
          echo 'GEN I: PASS'
          echo 'GEN II: PASS'
          echo 'GEN III: PASS'
          echo 'SOURCE IMMUTABILITY: PASS'
          echo 'MACHINE MOVE NAMES: PASS'
          echo 'YELLOW DUSK BALL ABSENT: PASS'

      - name: Full permanent host suite
        working-directory: application
        run: |
          set -euo pipefail
          make -f Makefile.host host-clean
          make -f Makefile.host host-test
          echo 'EXACT PRODUCTION FULL HOST: PASS'
          echo 'GEN II POKEMON EDITOR: PASS'
          echo 'MODERN INVENTORY: PASS'
          echo 'RUNTIME DEPENDENCY CONTRACT: PASS'
          echo 'POKEBANK PATHS: PASS'

      - name: ASan and UBSan permanent suite
        working-directory: application
        run: |
          set -euo pipefail
          make -f Makefile.host host-sanitize
          echo 'EXACT PRODUCTION ASan: PASS'
          echo 'EXACT PRODUCTION UBSan: PASS'

  native_package:
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact pushed production source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: application
          fetch-depth: 50
          submodules: recursive

      - name: Checkout permanent recovery snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RECOVERY_SHA }}
          path: recovery-work
          fetch-depth: 1

      - name: Verify exact production source before native build
        run: |
          set -euo pipefail
          test "$(git -C application rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C application ls-remote origin "refs/heads/$PROD_BRANCH" | awk '{print $1}')" = "$GITHUB_SHA"
          git -C application diff --check "$BASE_SHA"..HEAD
          git -C application diff --quiet
          git -C application diff --cached --quiet
          git -C application diff --exit-code "$VALIDATED_DEV_SHA" HEAD -- . ':(exclude).github/workflows/inventory-hardware-retest.yml'
          echo 'EXACT PRODUCTION IDENTITY: PASS'
          echo 'APPLICATION TREE EQUIVALENCE: PASS'

      - name: Recover device RomFS and asset preflight
        run: |
          set -euo pipefail
          test "$(git -C recovery-work rev-parse HEAD)" = "$RECOVERY_SHA"
          (cd recovery-work && python3 tools/recover_workspace.py) 2>&1 | tee recovery.log
          test "$(find recovery-work/romfs -type f | wc -l)" -eq "$EXPECTED_RECOVERY_ROMFS"
          rm -rf application/romfs
          cp -a recovery-work/romfs application/romfs
          for f in gold_gbc silver_gbc crystal_gbc; do
            cp "application/assets/game_cards/$f.png" "application/romfs/game_cards/$f.png"
          done
          test "$(find application/romfs -type f | wc -l)" -eq "$EXPECTED_FINAL_ROMFS"
          python3 application/tools/check_device_assets.py 2>&1 | tee asset-preflight.log
          grep -q 'DEVICE ASSET PREFLIGHT: PASS' asset-preflight.log
          git -C application diff --quiet
          git -C application diff --cached --quiet
          echo 'DEVICE ASSET PREFLIGHT: PASS'

      - name: Full devkitA64 compile and final link
        run: |
          set -euo pipefail
          docker pull devkitpro/devkita64:latest
          docker image inspect devkitpro/devkita64:latest --format '{{json .RepoDigests}}' > toolchain-image.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work/application devkitpro/devkita64:latest bash -lc '
            set -euo pipefail
            git config --global --add safe.directory /work/application
            dkp-pacman -Q > /work/toolchain-packages.txt
            make clean || true
            make -j1
            test -s PokeBankNX.nro
            for obj in ClassicInventoryOverlay.o ClassicInventoryUIModel.o ItemsPanel.o PickerDialog.o TrainerViewScreen.o; do
              find build -name "$obj" -type f | grep -q . || { echo "missing native object: $obj"; exit 1; }
            done
          ' 2>&1 | tee native-build.log
          grep -q 'ClassicInventoryOverlay.cpp' native-build.log
          grep -q 'ClassicInventoryUIModel.cpp' native-build.log
          grep -q 'ItemsPanel.cpp' native-build.log
          grep -q 'PickerDialog.cpp' native-build.log
          grep -q 'TrainerViewScreen.cpp' native-build.log
          grep -q 'linking PokeBankNX.elf' native-build.log
          test -s application/PokeBankNX.nro
          echo 'CHANGED INVENTORY UI ENTERED NRO BUILD: PASS'
          echo 'EXACT PRODUCTION DEVKITA64: PASS'
          echo 'EXACT PRODUCTION NATIVE LINK: PASS'

      - name: Verify embedded identity and RomFS
        run: |
          set -euo pipefail
          python3 recovery-work/tools/verify_embedded_romfs.py \
            application/PokeBankNX.nro application/romfs \
            --application-source "$GITHUB_SHA" > embedded-romfs.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('embedded-romfs.json'))
          assert data.get('result') == 'PASS', data
          assert data.get('file_count') == int(os.environ['EXPECTED_FINAL_ROMFS']), data
          assert data.get('application_source') == os.environ['GITHUB_SHA'], data
          print(json.dumps(data, indent=2))
          PY
          echo 'EMBEDDED APPLICATION IDENTITY: PASS'
          echo 'EMBEDDED ROMFS: PASS'

      - name: Package exact production inventory hardware-retest artifact
        id: package
        run: |
          set -euo pipefail
          test "$(git -C application ls-remote origin "refs/heads/$PROD_BRANCH" | awk '{print $1}')" = "$GITHUB_SHA"
          APP_SHA="$GITHUB_SHA"
          APP_TREE="$(git -C application rev-parse 'HEAD^{tree}')"
          SHORT_SHA="${APP_SHA:0:8}"
          export APP_SHA APP_TREE SHORT_SHA
          mkdir -p device-artifact
          cp application/PokeBankNX.nro "device-artifact/PokeBank-NX-Inventory-Hardware-Retest-${SHORT_SHA}.nro"
          cp recovery.log asset-preflight.log native-build.log embedded-romfs.json toolchain-image.json toolchain-packages.txt device-artifact/
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path

          out = Path('device-artifact')
          app_sha = os.environ['APP_SHA']
          app_tree = os.environ['APP_TREE']
          short = os.environ['SHORT_SHA']
          stem = f'PokeBank-NX-Inventory-Hardware-Retest-{short}'
          nro = out / f'{stem}.nro'
          nro_hash = hashlib.sha256(nro.read_bytes()).hexdigest()
          manifest = out / f'{nro.name}.manifest.txt'
          manifest.write_text(
              f'Application source full SHA: {app_sha}\n'
              f'Application tree: {app_tree}\n'
              f'Artifact size bytes: {nro.stat().st_size}\n'
              f'Artifact SHA-256: {nro_hash}\n'
              'Physical device status: RETEST REQUIRED\n'
              'Live installed-game writes: HARD DISABLED\n'
              'Live RetroArch writes: HARD DISABLED\n'
              'Live emulator writes: HARD DISABLED\n'
          )
          handoff = out / 'INVENTORY_HARDWARE_RETEST.txt'
          handoff.write_text(
              'PokeBank NX Inventory UI Hardware Retest\n\n'
              f'Production SHA: {app_sha}\n'
              f'Production tree: {app_tree}\n'
              'Controls: A Edit Amount | X Add Item | Y Remove Item | D-pad/Left Stick Navigate | L/R Category | + Options | - Help | B Back/Cancel\n'
              'Picker width: 560 px\n'
              'Physical device status: RETEST REQUIRED\n'
              'Do not enable live writes.\n'
          )
          zip_path = out / f'{stem}.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              zf.write(nro, nro.name)
              zf.write(manifest, manifest.name)
              zf.write(handoff, handoff.name)
          zip_hash = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          record = {
              'application_source': app_sha,
              'application_tree': app_tree,
              'workflow_run': int(os.environ['GITHUB_RUN_ID']),
              'full_host': 'PASS',
              'asan': 'PASS',
              'ubsan': 'PASS',
              'device_asset_preflight': 'PASS',
              'devkitA64': 'PASS',
              'native_final_link': 'PASS',
              'embedded_identity': 'PASS',
              'embedded_romfs': 'PASS',
              'live_installed_game_writes': 'HARD DISABLED',
              'live_retroarch_writes': 'HARD DISABLED',
              'live_emulator_writes': 'HARD DISABLED',
              'physical_device_status': 'RETEST REQUIRED',
              'nro': {'name': nro.name, 'bytes': nro.stat().st_size, 'sha256': nro_hash},
              'zip': {'name': zip_path.name, 'bytes': zip_path.stat().st_size, 'sha256': zip_hash},
          }
          build_manifest = out / 'BUILD_MANIFEST.json'
          build_manifest.write_text(json.dumps(record, indent=2) + '\n')
          sums = out / 'SHA256SUMS.txt'
          sums.write_text(
              f'{nro_hash}  {nro.name}\n'
              f'{zip_hash}  {zip_path.name}\n'
          )
          print(build_manifest.read_text())
          print(sums.read_text())
          PY
          echo "artifact_name=PokeBank-NX-Inventory-Hardware-Retest-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Reconfirm exact remote production before artifact upload
        run: |
          set -euo pipefail
          test "$(git -C application rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C application ls-remote origin "refs/heads/$PROD_BRANCH" | awk '{print $1}')" = "$GITHUB_SHA"
          echo 'REMOTE PRODUCTION STILL EXACT: PASS'

      - name: Preserve exact production inventory hardware-retest artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: device-artifact/
          if-no-files-found: error
          retention-days: 90

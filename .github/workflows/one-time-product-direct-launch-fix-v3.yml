name: One-time Product direct-launch hardware fix v3

on:
  push:
    branches:
      - feature/gen4-full-editor-20260928
    paths:
      - .github/workflows/one-time-product-direct-launch-fix-v3.yml

permissions:
  contents: write

jobs:
  patch-forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gen4-full-editor-20260928
          fetch-depth: 0
      - name: Verify exact branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/gen4-full-editor-20260928
          test "$(git rev-parse origin/feature/gen4-full-editor-20260928)" = "$GITHUB_SHA"
      - name: Apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/one_time_product_direct_launch_fix.py
      - name: Run focused contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_game_hub_contract.py
          g++ -std=c++20 -Iinclude tests/test_game_launch_model.cpp -o /tmp/test_game_launch_model
          /tmp/test_game_launch_model
      - name: Commit fix forward
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/gen4-full-editor-20260928
          test "$(git rev-parse origin/feature/gen4-full-editor-20260928)" = "$GITHUB_SHA"
          git config user.name "GlitchedZeus"
          git config user.email "user91746@protonmail.com"
          git add src/UI/SaveSelectScreen.cpp src/UI/GameLauncher.cpp tests/test_game_hub_contract.py
          git commit -m "fix(ui): direct-launch emulator games from Product Home"
          git push origin HEAD:feature/gen4-full-editor-20260928

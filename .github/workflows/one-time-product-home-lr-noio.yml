name: One-time Product Home L-R no-I/O hotfix

on:
  push:
    branches:
      - feature/gen4-full-editor-20260928
    paths:
      - .github/workflows/one-time-product-home-lr-noio.yml

permissions:
  contents: write

jobs:
  patch-forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gen4-full-editor-20260928
          fetch-depth: 0

      - name: Verify exact branch head
        run: |
          set -euo pipefail
          git fetch origin feature/gen4-full-editor-20260928
          test "$(git rev-parse origin/feature/gen4-full-editor-20260928)" = "$GITHUB_SHA"

      - name: Apply L-R no-I-O source fix
        run: |
          set -euo pipefail
          python3 tools/apply_home_lr_navigation_noio.py
          python3 tests/test_game_hub_contract.py

      - name: Commit source fix forward
        run: |
          set -euo pipefail
          git fetch origin feature/gen4-full-editor-20260928
          test "$(git rev-parse origin/feature/gen4-full-editor-20260928)" = "$GITHUB_SHA"
          git config user.name GlitchedZeus
          git config user.email user91746@protonmail.com
          git add include/UI/SaveSelectScreen.h src/UI/SaveSelectScreen.cpp tests/test_game_hub_contract.py
          git commit -m "fix(ui): keep Product Home L/R navigation off I/O"
          git push origin HEAD:feature/gen4-full-editor-20260928

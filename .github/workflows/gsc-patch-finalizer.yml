name: Patch GSC finalizer provenance

on:
  push:
    branches: [feature/pokebank-playable]
    paths: [.github/workflows/gsc-patch-finalizer.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pokebank-playable
          fetch-depth: 0
      - name: Correct Crystal resolved blob and clean diagnostic workflows
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 15ad94ab077fd81dabb5abf47da1943bff741b87 HEAD
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/gsc-finalize.yml')
          s = p.read_text()
          changes = [
              ('  CRYSTAL_BLOB: 7c8e17590d44a2bcd62776cb74b1822e7ca091b3',
               '  CRYSTAL_BLOB: 36fb3c05b3a61b3b5d8c25474ffddc77a749ef6d'),
              ('          git rm .github/workflows/gsc-finalize.yml',
               '          git rm .github/workflows/gsc-finalize.yml .github/workflows/gsc-crystal-probe.yml'),
              ('          git add -u .github/workflows/gsc-finalize.yml',
               '          git add -u .github/workflows/gsc-finalize.yml .github/workflows/gsc-crystal-probe.yml'),
          ]
          for old, new in changes:
              if s.count(old) != 1:
                  raise SystemExit(f'patch anchor mismatch: {old!r} count={s.count(old)}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -q 'CRYSTAL_BLOB: 36fb3c05b3a61b3b5d8c25474ffddc77a749ef6d' .github/workflows/gsc-finalize.yml
          git diff --check
          git config user.name 'PokeVault NX CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/gsc-finalize.yml
          git rm .github/workflows/gsc-patch-finalizer.yml
          git commit -m 'ci: resolve pinned Crystal symlink target'
          commit="$(git rev-parse HEAD)"
          git push origin HEAD:feature/pokebank-playable
          test "$(git ls-remote origin refs/heads/feature/pokebank-playable | awk '{print $1}')" = "$commit"
          echo "FINALIZER_FIX_COMMIT=$commit"

name: PokeBank NX Host Tests

on:
  pull_request:

permissions:
  contents: write

jobs:
  touch-view-patch:
    if: github.event.pull_request.number == 122
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact touch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify and apply professional View/save touch patch
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch origin feature/gen4-full-editor-20260928 feature/touch-controls-20261005
          test "$(git rev-parse origin/feature/touch-controls-20261005)" = "$EXPECTED_SHA"
          python3 tools/touch_view_patch_tmp.py
          git diff --check
          grep -q 'leftScrollManual' include/UI/TrainerViewScreenBase.h
          grep -q 'td == 90' src/UI/TrainerViewScreenBase.inc
          grep -q 'details.legalityScroll' src/UI/Modals/PokemonDetailsModal.cpp
          grep -q 'nativeScroll' src/UI/Modals/Gen2PokemonDetailsModal.cpp
          grep -q '"Cancel", 90' src/UI/Dialogs/SaveConfirmDialog.cpp

      - name: Restore workflow and commit runtime only
        run: |
          set -euo pipefail
          git show origin/feature/gen4-full-editor-20260928:.github/workflows/host-tests.yml > .github/workflows/host-tests.yml
          git rm -f tools/touch_view_patch_tmp.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/host-tests.yml \
                  include/UI/TrainerViewScreenBase.h \
                  src/UI/Dialogs/SaveConfirmDialog.cpp \
                  src/UI/TrainerViewScreenBase.inc \
                  src/UI/Modals/PokemonDetailsModal.cpp \
                  src/UI/Modals/Gen2PokemonDetailsModal.cpp
          git commit -m 'feat(ui): finish touch scrolling and save dialog parity'
          git push origin HEAD:feature/touch-controls-20261005

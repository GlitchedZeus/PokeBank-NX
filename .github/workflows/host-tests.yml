name: PokeBank NX Host Tests

on:
  push:
    branches:
      - main
      - feature/pokebank-playable
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Audit, umbrella legality, and isolated legality-lane PRs require evidence
          # for their exact application head, not GitHub's synthetic pull-request merge ref.
          ref: ${{ (github.event.pull_request.number == 79 || github.event.pull_request.number == 103 || startsWith(github.event.pull_request.head.ref, 'feature/legality-') || startsWith(github.event.pull_request.head.ref, 'docs/legality-') || startsWith(github.event.pull_request.head.ref, 'integration/legality-')) && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact pull-request application identity
        if: github.event.pull_request.number == 79 || github.event.pull_request.number == 103 || startsWith(github.event.pull_request.head.ref, 'feature/legality-') || startsWith(github.event.pull_request.head.ref, 'docs/legality-') || startsWith(github.event.pull_request.head.ref, 'integration/legality-')
        env:
          EXPECTED_APPLICATION_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_APPLICATION_SHA"
          echo "APPLICATION_SHA=$EXPECTED_APPLICATION_SHA"
          echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')"

      - name: Toolchain info
        run: |
          g++ --version
          make --version
          python3 --version

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD || git diff --check

      - name: Syntax-check device/recovery tools
        run: |
          python3 -m py_compile tools/check_device_assets.py
          python3 -m py_compile tools/package_device_build.py
          python3 -m py_compile tools/recover_workspace.py
          python3 -m py_compile tools/check_recovery_contract.py
          python3 -m py_compile tools/pack_recovery_snapshot.py
          python3 -m py_compile tools/regenerate.py

      - name: Verify generated-data maintenance plan
        run: python3 tools/regenerate.py --list --repo . --tables

      - name: Verify GitHub recovery contract
        run: python3 tools/check_recovery_contract.py

      - name: Verify v1 polish contracts
        run: python3 tests/test_v1_polish_contract.py

      - name: Clean host build
        run: make -f Makefile.host host-clean

      - name: Run host tests
        run: make -f Makefile.host host-test

      - name: Focused RSE save-open bridge regression
        run: |
          set -euo pipefail
          SOURCES="tests/test_rse_open_regression.cpp \
            src/Integration/Gen3/PKSMGen3NativeAdapter.cpp src/Integration/Gen3/FRLGReadModel.cpp \
            src/Legacy/FRLGReadOnlyTrainer.cpp src/Pokemon/Pokemon3FRLG.cpp \
            src/Pokemon/BaseStatsGen89.cpp src/Pokemon/PersonalInfoTable.cpp src/Pokemon/Experience.cpp \
            src/Encryption/Encryption3FRLG.cpp src/Names/ItemNames.cpp src/Names/SpeciesNames.cpp \
            src/Names/NatureNames.cpp src/Names/AbilityNames.cpp src/Utils/StringHelpers.cpp \
            src/Utils/HelperUtilities.cpp src/Utils/SHA256.cpp src/Games/GameIdentity.cpp \
            src/Integration/Gen3/Gen3StagedInventoryEditor.cpp src/Integration/Gen3/Gen3StagedPokemonEditor.cpp \
            src/Inventory/ClassicInventoryCatalog.cpp src/Names/MoveNames.cpp src/Names/MoveInfo.cpp \
            src/Integration/Gen2/Gen2ReadOnlyInventory.cpp"
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -O2 \
            -DPOKEBANK_GEN3_SELECTIVE_PORT_TEST -Iinclude $SOURCES \
            -o build-host/test_rse_open_regression
          ./build-host/test_rse_open_regression
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DPOKEBANK_GEN3_SELECTIVE_PORT_TEST -Iinclude $SOURCES \
            -o build-host/test_rse_open_regression_sanitize
          ASAN_OPTIONS=detect_leaks=0 ./build-host/test_rse_open_regression_sanitize

      - name: Run ASan and UBSan tests
        run: make -f Makefile.host host-sanitize

# Coordinator-owned integration gate: ordinary host tests do not
  # automatically run standalone lane tests. Require exact PR head here.
  legality-parallel-validation:
    name: Legality lane ${{ matrix.lane }} (native + sanitizers)
    if: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'integration/legality-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lane: [L1, L2, L3, L4, L5]
    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact integration identity and source inputs
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "APPLICATION_SHA=$EXPECTED_SHA"
          echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')"
          g++ --version
          python3 --version
      - name: Execute every standalone suite (normal and ASan/UBSan)
        env:
          LANE: ${{ matrix.lane }}
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          case "$LANE" in
            L1)
              bash tests/test_legality_l1_run.sh
              ;;
            L2)
              bash tests/test_legality_l2_run_all.sh
              ;;
            L3)
              L3_EXPECTED_EMERALD_BLOB=3e53c1c951876a26cace5dde060cc9ff2c35d0a7 bash tests/test_legality_l3_run_all.sh
              ;;
            L4)
              bash tests/test_legality_l4_runner.sh
              L4_SANITIZE=1 bash tests/test_legality_l4_runner.sh
              ;;
            L5)
              python3 tools/audit_legality_l5_native_ev_vectors.py --source-root .
              python3 tools/audit_legality_l5_native_codec.py --source-pin
              python3 tools/audit_legality_l5_native_codec.py --source-pin --sanitize
              make -f Makefile.host -f tools/audit_legality_l5_ev_probe.mk l5-ev-fixed
              make -f Makefile.host -f tools/audit_legality_l5_ev_probe.mk l5-ev-fixed-sanitize
              # Coordinator F3/F4: exercise REAL native PK1/PK2 source-free
              # analyzer gates, normal and ASan/UBSan, on this same commit.
              make -f Makefile.host -f tools/audit_legality_l5_pk12_probe.mk l5-pk12-fixed
              make -f Makefile.host -f tools/audit_legality_l5_pk12_probe.mk l5-pk12-fixed-sanitize
              ;;
            *)
              echo "Unknown legality lane: $LANE" >&2
              exit 2
              ;;
          esac

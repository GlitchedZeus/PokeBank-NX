name: PokeBank NX Host Tests

on:
  push:
    branches:
      - main
      - feature/pokebank-playable
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain info
        run: |
          g++ --version
          make --version
          python3 --version

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD || git diff --check

      - name: Syntax-check device/recovery tools
        run: |
          python3 -m py_compile tools/check_device_assets.py
          python3 -m py_compile tools/package_device_build.py
          python3 -m py_compile tools/recover_workspace.py
          python3 -m py_compile tools/check_recovery_contract.py
          python3 -m py_compile tools/pack_recovery_snapshot.py

      - name: Verify GitHub recovery contract
        run: python3 tools/check_recovery_contract.py

      - name: Verify GSC generated oracle is reproducible
        run: |
          set -euo pipefail
          cp include/Integration/Gen2/Gen2GenderTable.h /tmp/Gen2GenderTable.committed.h
          python3 tools/generate_gen2_gender_table.py
          cmp /tmp/Gen2GenderTable.committed.h include/Integration/Gen2/Gen2GenderTable.h

      - name: Focused GSC parser inventory and bridge
        run: |
          set -euo pipefail
          mkdir -p build-host
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -O2 -Iinclude \
            tests/test_gsc_gen2_adapter.cpp src/Integration/Gen2/Gen2ReadOnlySave.cpp \
            -o build-host/test_gsc_gen2_adapter
          ./build-host/test_gsc_gen2_adapter
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -O2 -Iinclude \
            tests/test_gsc_inventory.cpp src/Integration/Gen2/Gen2ReadOnlyInventory.cpp \
            src/Names/ItemNamesGen2.cpp -o build-host/test_gsc_inventory
          ./build-host/test_gsc_inventory
          GSC_BRIDGE="tests/test_gsc_readonly_bridge.cpp src/Legacy/GSCReadOnlyTrainer.cpp \
            src/Pokemon/Pokemon2ReadOnly.cpp src/Integration/Gen2/Gen2ReadOnlySave.cpp \
            src/Integration/Gen2/Gen2ReadOnlyInventory.cpp src/Pokemon/BaseStatsGen89.cpp \
            src/Names/SpeciesNames.cpp src/Utils/StringHelpers.cpp src/Utils/HelperUtilities.cpp"
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -O2 -Iinclude \
            $GSC_BRIDGE -o build-host/test_gsc_readonly_bridge
          ./build-host/test_gsc_readonly_bridge

      - name: Clean host build
        run: make -f Makefile.host host-clean

      - name: Run host tests
        run: make -f Makefile.host host-test

      - name: Focused RSE save-open bridge regression
        run: |
          set -euo pipefail
          SOURCES="tests/test_rse_open_regression.cpp \
            src/Integration/Gen3/PKSMGen3NativeAdapter.cpp src/Integration/Gen3/FRLGReadModel.cpp \
            src/Legacy/FRLGReadOnlyTrainer.cpp src/Pokemon/Pokemon3FRLG.cpp \
            src/Pokemon/BaseStatsGen89.cpp src/Pokemon/PersonalInfoTable.cpp src/Pokemon/Experience.cpp \
            src/Encryption/Encryption3FRLG.cpp src/Names/ItemNames.cpp src/Names/SpeciesNames.cpp \
            src/Names/NatureNames.cpp src/Names/AbilityNames.cpp src/Utils/StringHelpers.cpp \
            src/Utils/HelperUtilities.cpp src/Utils/SHA256.cpp src/Games/GameIdentity.cpp"
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -O2 \
            -DPOKEBANK_GEN3_SELECTIVE_PORT_TEST -Iinclude $SOURCES \
            -o build-host/test_rse_open_regression
          ./build-host/test_rse_open_regression
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DPOKEBANK_GEN3_SELECTIVE_PORT_TEST -Iinclude $SOURCES \
            -o build-host/test_rse_open_regression_sanitize
          ASAN_OPTIONS=detect_leaks=0 ./build-host/test_rse_open_regression_sanitize

      - name: Focused GSC sanitizers
        run: |
          set -euo pipefail
          SAN='-fsanitize=address,undefined -fno-omit-frame-pointer -O1'
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror $SAN -Iinclude \
            tests/test_gsc_gen2_adapter.cpp src/Integration/Gen2/Gen2ReadOnlySave.cpp \
            -o build-host/test_gsc_gen2_adapter_sanitize
          ASAN_OPTIONS=detect_leaks=0 ./build-host/test_gsc_gen2_adapter_sanitize
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror $SAN -Iinclude \
            tests/test_gsc_inventory.cpp src/Integration/Gen2/Gen2ReadOnlyInventory.cpp \
            src/Names/ItemNamesGen2.cpp -o build-host/test_gsc_inventory_sanitize
          ASAN_OPTIONS=detect_leaks=0 ./build-host/test_gsc_inventory_sanitize
          GSC_BRIDGE="tests/test_gsc_readonly_bridge.cpp src/Legacy/GSCReadOnlyTrainer.cpp \
            src/Pokemon/Pokemon2ReadOnly.cpp src/Integration/Gen2/Gen2ReadOnlySave.cpp \
            src/Integration/Gen2/Gen2ReadOnlyInventory.cpp src/Pokemon/BaseStatsGen89.cpp \
            src/Names/SpeciesNames.cpp src/Utils/StringHelpers.cpp src/Utils/HelperUtilities.cpp"
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter $SAN -Iinclude \
            $GSC_BRIDGE -o build-host/test_gsc_readonly_bridge_sanitize
          ASAN_OPTIONS=detect_leaks=0 ./build-host/test_gsc_readonly_bridge_sanitize

      - name: Run ASan and UBSan tests
        run: make -f Makefile.host host-sanitize

name: PokeBank NX Host Tests

on:
  pull_request:

permissions:
  contents: write

jobs:
  touch-patch:
    if: github.event.pull_request.number == 122
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact touch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify and apply Gen I direct-touch patch
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch origin feature/gen4-full-editor-20260928 feature/touch-controls-20261005
          test "$(git rev-parse origin/feature/touch-controls-20261005)" = "$EXPECTED_SHA"
          python3 tools/touch_patch_tmp.py
          git diff --check
          grep -q 'ux3DirectTouchInput' src/UI/Gen1PokemonEditorOverlayUXCleanup3.inc
          grep -q 'foundationDirectTouchInput' src/UI/Gen1PokemonEditorOverlayFoundation.inc
          grep -q '5200 + i' src/UI/Gen1PokemonEditorFoundationHardwareFix.inc
          grep -q 'stick.x, stick.y, touch' src/UI/TrainerViewScreenCompositeOverlay.cpp

      - name: Restore workflow and commit runtime only
        run: |
          set -euo pipefail
          git show origin/feature/gen4-full-editor-20260928:.github/workflows/host-tests.yml > .github/workflows/host-tests.yml
          git rm tools/touch_patch_tmp.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/host-tests.yml \
                  src/UI/Gen1PokemonEditorOverlayUXCleanup2.inc \
                  src/UI/Gen1PokemonEditorOverlayUXCleanup3.inc \
                  src/UI/Gen1PokemonEditorOverlayFoundation.inc \
                  src/UI/Gen1PokemonEditorFoundationHardwareFix.inc \
                  src/UI/TrainerViewScreenCompositeOverlay.cpp
          git commit -m 'feat(ui): add native touch to Gen I editor surfaces'
          git push origin HEAD:feature/touch-controls-20261005

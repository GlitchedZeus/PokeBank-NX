name: One-time Product performance runner

on:
  push:
    branches:
      - feature/gen4-full-editor-20260928
    paths:
      - tools/product_performance_run_trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gen4-full-editor-20260928
          fetch-depth: 2

      - name: Verify audit integration is present
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 408a56446f9dda611732c8186d6ce4148100d65f HEAD
          git merge-base --is-ancestor 46e3af0a2d023de9587a297d9cc93ba78a184591 HEAD

      - name: Apply exact performance patch
        run: python3 tools/apply_product_performance_no_behavior.py

      - name: Validate focused and audit contracts
        run: |
          set -euo pipefail
          python3 tests/test_product_performance_contract.py
          python3 tests/test_game_hub_contract.py
          python3 tests/test_ci_repository_safety_contract.py
          python3 tests/test_engineering_authority_contract.py
          git diff --check

      - name: Commit and push runtime patch
        run: |
          set -euo pipefail
          git config user.name GlitchedZeus
          git config user.email user91746@protonmail.com
          git add src/main.cpp src/UI/GameLauncher.cpp src/UI/SaveSelectScreen.cpp tests/test_product_performance_contract.py
          git commit -m "perf(ui): remove redundant Product Home I/O"
          git push origin HEAD:feature/gen4-full-editor-20260928

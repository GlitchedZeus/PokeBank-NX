name: PokeBank NX Host Tests (Clang)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pokebank-host-clang-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clang:
    name: Host tests + ASan/UBSan (Clang)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - name: Checkout exact application head
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Toolchain info
        run: clang++ --version

      - name: Clang host tests
        run: make -f Makefile.host -j"$(nproc)" CXX=clang++ host-test

      - name: Clang host sanitizers
        run: make -f Makefile.host -j"$(nproc)" CXX=clang++ host-sanitize

name: GSC Crystal pinned-tree probe
on:
  push:
    branches: [feature/pokebank-playable]
    paths: [.github/workflows/gsc-crystal-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Enumerate Crystal entries from exact pinned Git tree
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/gbc-upstream"
          anon_home="$RUNNER_TEMP/anon-home"
          mkdir -p "$anon_home"
          git init -q "$upstream"
          git -C "$upstream" remote add origin https://github.com/libretro-thumbnails/Nintendo_-_Game_Boy_Color.git
          HOME="$anon_home" GIT_CONFIG_GLOBAL=/dev/null git -C "$upstream" fetch --depth=1 origin 0931985ba8a3a9f38fb87f006611a13dc094260f
          test "$(git -C "$upstream" rev-parse FETCH_HEAD)" = 0931985ba8a3a9f38fb87f006611a13dc094260f
          test "$(git -C "$upstream" rev-parse '0931985ba8a3a9f38fb87f006611a13dc094260f:Named_Boxarts')" = 19e9d2ffcc7896f72aa7eb6b8f3e2d56730e75f0
          echo '=== PINNED CRYSTAL ENTRIES ==='
          git -C "$upstream" ls-tree -r 0931985ba8a3a9f38fb87f006611a13dc094260f -- Named_Boxarts | grep -i 'crystal' || true
          echo '=== PINNED POKEMON CRYSTAL ENTRIES ONLY ==='
          git -C "$upstream" ls-tree -r 0931985ba8a3a9f38fb87f006611a13dc094260f -- Named_Boxarts | grep -i 'pokemon.*crystal' || true

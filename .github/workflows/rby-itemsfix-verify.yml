name: RBY ItemsFix corrected verifier

on:
  push:
    branches:
      - codex/rby-itemsfix-patch

permissions:
  contents: write

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged patch checkpoint branch
        uses: actions/checkout@v4
        with:
          ref: codex/rby-itemsfix-patch
          path: staged
          fetch-depth: 0

      - name: Check out exact feature baseline
        uses: actions/checkout@v4
        with:
          ref: feature/pokebank-playable
          path: work
          fetch-depth: 0
          submodules: recursive

      - name: Verify frozen baseline and extract staged payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C work rev-parse HEAD)" = "0e92cee6ae743d5156dd8f7aaf55750b70dde5e5"
          test "$(git -C work rev-parse HEAD^)" = "214e5a3b8a96d340d20229b0ba948bff608a3d60"
          python3 -c 'from pathlib import Path; p=Path("staged/.github/workflows/rby-itemsfix-patch.yml"); s=p.read_text(); a=s.index("from pathlib import Path"); b=s.index("\nPY\n", a); Path("/tmp/rby_itemsfix.py").write_text(s[a:b] + "\n")'
          grep -q 'Gen1ReadOnlyInventory' /tmp/rby_itemsfix.py
          grep -q 'getItemNameG1' /tmp/rby_itemsfix.py
          python3 -c 'from pathlib import Path; p=Path("/tmp/rby_itemsfix.py"); s=p.read_text(); assert s.count(", 2),") == 2; p.write_text(s.replace(", 2),", ", 1),"))'

      - name: Apply staged RBY ItemsFix with corrected anchor counts
        shell: bash
        working-directory: work
        run: python3 /tmp/rby_itemsfix.py

      - name: Apply missing lower-indentation RBY navigation anchors
        shell: bash
        working-directory: work
        run: |
          cat > /tmp/rby_nav_fix.py <<'PY'
          from pathlib import Path
          import re

          p = Path("src/UI/TrainerViewScreen.cpp")
          text = p.read_text()

          def add(direction: str) -> None:
              global text
              if direction == "left":
                  expr = r"selectedCategory = \(selectedCategory - 1 \+ POUCH_COUNT3_FRLG\) % POUCH_COUNT3_FRLG;"
                  replacement_expr = "selectedCategory = (selectedCategory - 1 + count) % count;"
              else:
                  expr = r"selectedCategory = \(selectedCategory \+ 1\) % POUCH_COUNT3_FRLG;"
                  replacement_expr = "selectedCategory = (selectedCategory + 1) % count;"
              pattern = re.compile(
                  r"(?P<i>^[ \t]*)case GameVersion::FRLG: \{\n"
                  r"(?P=i)    " + expr + r"\n"
                  r"(?P=i)    currentPage = 0;\n"
                  r"(?P=i)    selectedItemIndex = 0;\n"
                  r"(?P=i)    break;\n"
                  r"(?P=i)\}\n"
                  r"(?P=i)default: break;",
                  re.MULTILINE,
              )
              def repl(m: re.Match[str]) -> str:
                  i = m.group("i")
                  frlg = m.group(0)[:-len(i + "default: break;")]
                  return (
                      frlg
                      + i + "case GameVersion::RBY: {\n"
                      + i + "    constexpr int count = static_cast<int>(PokeVault::Integration::Gen1::kInventoryCategoryCount);\n"
                      + i + "    " + replacement_expr + "\n"
                      + i + "    currentPage = 0;\n"
                      + i + "    selectedItemIndex = 0;\n"
                      + i + "    break;\n"
                      + i + "}\n"
                      + i + "default: break;"
                  )
              text, count = pattern.subn(repl, text)
              if count != 1:
                  raise SystemExit(f"expected exactly one remaining {direction} FRLG navigation anchor, found {count}")

          add("left")
          add("right")
          p.write_text(text)
          PY
          python3 /tmp/rby_nav_fix.py

      - name: Fix exact staged compile and fixture defects
        shell: bash
        working-directory: work
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fixes = {
              "tests/test_rby_inventory.cpp": [
                  ("for (const auto [item, qty] : entries)", "for (const auto& [item, qty] : entries)"),
              ],
              "tests/test_rby_readonly_bridge.cpp": [
                  ("for(const auto [item,qty]:entries)", "for(const auto& [item,qty]:entries)"),
                  ("for(const auto [game,id]:std::array", "for(const auto& [game,id]:std::array"),
                  ("std::array<std::pair<SourceGame,const char*>,2>{{\n            {SourceGame::Blue,\"blue_gb\"},{SourceGame::Yellow,\"yellow_gb\"}\n        }}", "std::array<std::pair<SourceGame,const char*>,1>{{\n            {SourceGame::Blue,\"blue_gb\"}\n        }}"),
                  ("    std::cout<<\"RBY Trainer/Party/Boxes/Pokemon read-only bridge tests passed\\n\";return 0;", "    auto yellowRaw=raw; yellowRaw[0x29C3]=0x54; checksums(yellowRaw);\n    auto yp=parse(yellowRaw,SourceGame::Yellow);assert(yp);std::string ye;auto yt=RBYReadOnlyTrainer::create(*yp.save,ye);\n    assert(yt&&ye.empty()&&yt->sourceGameId()==\"yellow_gb\"&&yt->items.size()==2);\n    assert(yt->items[0][0].itemId==0x14&&yt->items[1][0].itemId==0x2D);\n    std::cout<<\"RBY Trainer/Party/Boxes/Pokemon read-only bridge tests passed\\n\";return 0;"),
                  ("    auto bad=fixture();bad[BAG]=21;checksums(bad);\n    auto badParsed=parse(bad,SourceGame::Yellow);assert(badParsed);\n    std::string badError;auto badTrainer=RBYReadOnlyTrainer::create(*badParsed.save,badError);\n    assert(badTrainer&&badError.empty()&&badTrainer->items.empty());\n    assert(badTrainer->party.size()==1&&badTrainer->boxes[0][0]);", "    auto bad=fixture();bad[BAG]=21;checksums(bad);const auto badBefore=bad;\n    auto badParsed=parse(bad,SourceGame::Red);assert(badParsed);\n    std::string badError;auto badTrainer=RBYReadOnlyTrainer::create(*badParsed.save,badError);\n    assert(badTrainer&&badError.empty()&&badTrainer->sourceGameId()==\"red_gb\"&&badTrainer->items.empty());\n    assert(badTrainer->party.size()==1&&badTrainer->boxes[0][0]);assert(bad==badBefore);"),
              ],
              "src/Legacy/RBYReadOnlyTrainer.cpp": [
                  ("dst.push_back(Trainer::InventoryItem{", "dst.push_back(::Trainer::InventoryItem{"),
              ],
          }
          for path, replacements in fixes.items():
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected one staged correction pattern, found {count}: {old}")
                  text = text.replace(old, new)
              p.write_text(text)
          PY

      - name: Diff safety and protected Gen III paths
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test -z "$(printf '%s\n' "$changed" | grep -E '^(src/Integration/Gen3|include/Integration/Gen3|src/Legacy/(FRLG|RSE)|include/Legacy/(FRLG|RSE))' || true)"

      - name: Focused RBY inventory test
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          make -f Makefile.host build-host/test_rby_inventory
          ./build-host/test_rby_inventory

      - name: RBY parser discovery source browser and bridge
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          make -f Makefile.host build-host/test_rby_gen1_adapter build-host/test_rby_discovery build-host/test_rby_source_browser build-host/test_rby_readonly_bridge
          ./build-host/test_rby_gen1_adapter
          ./build-host/test_rby_discovery
          ./build-host/test_rby_source_browser
          ./build-host/test_rby_readonly_bridge

      - name: Full host suite including FRLG RSE mutation and write-policy regressions
        shell: bash
        working-directory: work
        run: make -f Makefile.host host-test

      - name: ASan and UBSan suite
        shell: bash
        working-directory: work
        run: make -f Makefile.host host-sanitize

      - name: Recheck diff and protected paths after tests
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test -z "$(printf '%s\n' "$changed" | grep -E '^(src/Integration/Gen3|include/Integration/Gen3|src/Legacy/(FRLG|RSE)|include/Legacy/(FRLG|RSE))' || true)"

      - name: Commit and promote verified runtime fix
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          git config user.name "GlitchedZeus"
          git config user.email "user91746@protonmail.com"
          git add Makefile.host include/Enums/GameVersion.h include/Games/GameIdentity.h include/Integration/Gen1/Gen1ReadOnlyInventory.h include/Legacy/RBYReadOnlyTrainer.h include/Names/ItemNames.h src/Games/GameIdentity.cpp src/Integration/Gen1/Gen1ReadOnlyInventory.cpp src/Legacy/RBYReadOnlyTrainer.cpp src/Names/ItemNames.cpp src/UI/Panels/ItemsPanel.cpp src/UI/TrainerViewScreen.cpp tests/test_game_identity.cpp tests/test_rby_inventory.cpp tests/test_rby_readonly_bridge.cpp
          git diff --cached --check
          git commit -m "gen1: add read-only RBY inventory support"
          git push origin HEAD:feature/pokebank-playable
          echo "RUNTIME_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RUNTIME_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Record promoted runtime identity
        shell: bash
        run: |
          echo "RUNTIME_SHA=$RUNTIME_SHA"
          echo "RUNTIME_TREE=$RUNTIME_TREE"

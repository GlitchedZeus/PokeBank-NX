name: RBY ItemsFix corrected verifier

on:
  push:
    branches:
      - codex/rby-itemsfix-patch

permissions:
  contents: write

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged patch checkpoint branch
        uses: actions/checkout@v4
        with:
          ref: codex/rby-itemsfix-patch
          path: staged
          fetch-depth: 0

      - name: Check out exact feature baseline
        uses: actions/checkout@v4
        with:
          ref: feature/pokebank-playable
          path: work
          fetch-depth: 0
          submodules: recursive

      - name: Verify frozen baseline and extract staged payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C work rev-parse HEAD)" = "0e92cee6ae743d5156dd8f7aaf55750b70dde5e5"
          test "$(git -C work rev-parse HEAD^)" = "214e5a3b8a96d340d20229b0ba948bff608a3d60"
          python3 -c 'from pathlib import Path; p=Path("staged/.github/workflows/rby-itemsfix-patch.yml"); s=p.read_text(); a=s.index("from pathlib import Path"); b=s.index("\nPY\n", a); Path("/tmp/rby_itemsfix.py").write_text(s[a:b] + "\n")'
          grep -q 'Gen1ReadOnlyInventory' /tmp/rby_itemsfix.py
          grep -q 'getItemNameG1' /tmp/rby_itemsfix.py
          python3 -c 'from pathlib import Path; p=Path("/tmp/rby_itemsfix.py"); s=p.read_text(); assert s.count(", 2),") == 2; p.write_text(s.replace(", 2),", ", 1),"))'

      - name: Apply staged RBY ItemsFix with corrected anchor counts
        shell: bash
        working-directory: work
        run: python3 /tmp/rby_itemsfix.py

      - name: Apply missing lower-indentation RBY navigation anchors
        shell: bash
        working-directory: work
        run: |
          cat > /tmp/rby_nav_fix.py <<'PY'
          from pathlib import Path

          p = Path("src/UI/TrainerViewScreen.cpp")
          lines = p.read_text().splitlines()
          out = []
          inserted = 0
          for i, line in enumerate(lines):
              out.append(line)
              if line.strip() != "}":
                  continue
              start = max(0, i - 8)
              recent = "\n".join(lines[start:i + 1])
              direction = None
              if "case GameVersion::FRLG: {" in recent and "selectedCategory = (selectedCategory - 1 + POUCH_COUNT3_FRLG) % POUCH_COUNT3_FRLG;" in recent:
                  direction = "left"
              elif "case GameVersion::FRLG: {" in recent and "selectedCategory = (selectedCategory + 1) % POUCH_COUNT3_FRLG;" in recent:
                  direction = "right"
              if direction is None:
                  continue
              if any("case GameVersion::RBY:" in x for x in lines[i + 1:i + 9]):
                  continue
              case_line = next(x for x in reversed(lines[start:i + 1]) if "case GameVersion::FRLG:" in x)
              indent = case_line[:len(case_line) - len(case_line.lstrip())]
              out.append(indent + "case GameVersion::RBY: {")
              out.append(indent + "    constexpr int count = static_cast<int>(PokeVault::Integration::Gen1::kInventoryCategoryCount);")
              if direction == "left":
                  out.append(indent + "    selectedCategory = (selectedCategory - 1 + count) % count;")
              else:
                  out.append(indent + "    selectedCategory = (selectedCategory + 1) % count;")
              out.append(indent + "    currentPage = 0;")
              out.append(indent + "    selectedItemIndex = 0;")
              out.append(indent + "    break;")
              out.append(indent + "}")
              inserted += 1
          if inserted != 2:
              raise SystemExit(f"expected to repair 2 lower navigation anchors, repaired {inserted}")
          p.write_text("\n".join(out) + "\n")
          PY
          python3 /tmp/rby_nav_fix.py

      - name: Diff safety and protected Gen III paths
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test -z "$(printf '%s\n' "$changed" | grep -E '^(src/Integration/Gen3|include/Integration/Gen3|src/Legacy/(FRLG|RSE)|include/Legacy/(FRLG|RSE))' || true)"

      - name: Focused RBY inventory test
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          make -f Makefile.host build-host/test_rby_inventory
          ./build-host/test_rby_inventory

      - name: RBY parser discovery source browser and bridge
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          make -f Makefile.host build-host/test_rby_gen1_adapter build-host/test_rby_discovery build-host/test_rby_source_browser build-host/test_rby_readonly_bridge
          ./build-host/test_rby_gen1_adapter
          ./build-host/test_rby_discovery
          ./build-host/test_rby_source_browser
          ./build-host/test_rby_readonly_bridge

      - name: Full host suite including FRLG RSE mutation and write-policy regressions
        shell: bash
        working-directory: work
        run: make -f Makefile.host host-test

      - name: ASan and UBSan suite
        shell: bash
        working-directory: work
        run: make -f Makefile.host host-sanitize

      - name: Recheck diff and protected paths after tests
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test -z "$(printf '%s\n' "$changed" | grep -E '^(src/Integration/Gen3|include/Integration/Gen3|src/Legacy/(FRLG|RSE)|include/Legacy/(FRLG|RSE))' || true)"

      - name: Commit and promote verified runtime fix
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          git config user.name "GlitchedZeus"
          git config user.email "user91746@protonmail.com"
          git add Makefile.host include/Enums/GameVersion.h include/Games/GameIdentity.h include/Integration/Gen1/Gen1ReadOnlyInventory.h include/Legacy/RBYReadOnlyTrainer.h include/Names/ItemNames.h src/Games/GameIdentity.cpp src/Integration/Gen1/Gen1ReadOnlyInventory.cpp src/Legacy/RBYReadOnlyTrainer.cpp src/Names/ItemNames.cpp src/UI/Panels/ItemsPanel.cpp src/UI/TrainerViewScreen.cpp tests/test_game_identity.cpp tests/test_rby_inventory.cpp tests/test_rby_readonly_bridge.cpp
          git diff --cached --check
          git commit -m "gen1: add read-only RBY inventory support"
          git push origin HEAD:feature/pokebank-playable
          echo "RUNTIME_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RUNTIME_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Record promoted runtime identity
        shell: bash
        run: |
          echo "RUNTIME_SHA=$RUNTIME_SHA"
          echo "RUNTIME_TREE=$RUNTIME_TREE"

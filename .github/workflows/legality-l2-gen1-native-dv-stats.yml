name: L2 Gen I Native DV StatExp and Battle Stats
on:
  push:
    branches:
      - feature/legality-l2-breeding-20261012
  workflow_dispatch:
concurrency:
  group: l2-gen1-dv-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gen1-native:
    name: Native PK1 source stats ${{ matrix.compiler }} normal ASan UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cxx: g++
          - compiler: Clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Test exact-head Gen I read-only source and production battle calculations
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f src/Integration/Gen1/Gen1PersonalData.inc
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          tests=(
            tests/test_legality_l2_gen1_native_dv_stat.cpp
            tests/test_legality_l2_gen1_native_record_adversarial.cpp
            tests/test_gen1_battle_stats.cpp
          )
          sources=(
            src/Integration/Gen1/Gen1BattleStats.cpp
            src/Integration/Gen1/Gen1ReadOnlySave.cpp
          )
          for mode in normal sanitizer; do
            flags=(-std=c++20 -Wall -Wextra -Wpedantic -Werror
                   -Wno-unused-parameter -Iinclude)
            if [[ "$mode" == sanitizer ]]; then
              flags+=(-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer)
            else
              flags+=(-O2)
            fi
            for file in "${tests[@]}"; do
              bin="$tmp/$(basename "$file" .cpp)-$mode"
              inputs=("$file" "${sources[@]}")
              if [[ "$file" != tests/test_gen1_battle_stats.cpp ]]; then
                inputs+=(src/Legality/Gen1NativeDVStatEvidence.cpp)
              fi
              "$CXX" "${flags[@]}" "${inputs[@]}" -o "$bin"
              ASAN_OPTIONS=halt_on_error=1:detect_leaks=1 \
                UBSAN_OPTIONS=halt_on_error=1 "$bin"
            done
          done

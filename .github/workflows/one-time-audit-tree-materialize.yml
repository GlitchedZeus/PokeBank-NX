name: One-time audit tree materialize

on:
  push:
    branches:
      - feature/gen4-full-editor-20260928
    paths:
      - .github/workflows/one-time-audit-tree-materialize.yml

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gen4-full-editor-20260928
          fetch-depth: 0

      - name: Create exact merge material
        run: |
          set -euo pipefail
          git fetch origin feature/gen4-full-editor-20260928 fix/full-audit-remediation-20260929
          test "$(git rev-parse origin/feature/gen4-full-editor-20260928)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/fix/full-audit-remediation-20260929)" = "408a56446f9dda611732c8186d6ce4148100d65f"
          git ls-tree -r 408a56446f9dda611732c8186d6ce4148100d65f > /tmp/audit-tree.txt
          git config user.name GlitchedZeus
          git config user.email user91746@protonmail.com
          git merge --no-ff -X ours origin/fix/full-audit-remediation-20260929 \
            -m "merge(audit): forward-port validated remediation into current MAIN"
          mkdir -p /tmp/audit-tree-material/src/Save /tmp/audit-tree-material/src/Trainer /tmp/audit-tree-material/src/UI /tmp/audit-tree-material/tests
          cp /tmp/audit-tree.txt /tmp/audit-tree-material/
          cp .github/workflows/product-ui-native.yml /tmp/audit-tree-material/product-ui-native.merged.yml
          cp src/Save/GetSaveFileContents.cpp /tmp/audit-tree-material/src/Save/
          cp src/Trainer/Trainer3FRLG.cpp /tmp/audit-tree-material/src/Trainer/
          cp src/UI/GameLauncher.cpp /tmp/audit-tree-material/src/UI/
          cp src/UI/SaveSelectScreen.cpp /tmp/audit-tree-material/src/UI/
          cp src/UI/TrainerViewScreenBase.inc /tmp/audit-tree-material/src/UI/
          cp tests/test_v1_polish_contract.py /tmp/audit-tree-material/tests/
          git diff --name-status HEAD^1 HEAD > /tmp/audit-tree-material/audit-merge-name-status.txt
          printf '%s\n' "$(git rev-parse HEAD^{tree})" > /tmp/audit-tree-material/runner-merge-tree.txt

      - name: Re-run audit safety contracts
        run: |
          set -euo pipefail
          python3 tests/test_ci_repository_safety_contract.py
          python3 tests/test_engineering_authority_contract.py
          python3 tests/test_device_asset_png_validation.py
          python3 tests/test_generated_species_name_contract.py

      - uses: actions/upload-artifact@v4
        with:
          name: audit-forward-tree-material
          path: /tmp/audit-tree-material
          if-no-files-found: error

name: One-time AppShell native touch feedback

on:
  push:
    branches: [feature/touch-controls-20261005]
    paths:
      - .github/workflows/one-time-touch-appshell-native.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact head and patch AppShell
        run: |
          set -euo pipefail
          git fetch origin feature/touch-controls-20261005
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/feature/touch-controls-20261005)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/UI/AppShellScreen.cpp')
          s=p.read_text()
          old='''    if (overlay == Overlay::Settings) {\n        if (touch.justPressed()) {\n            for (const HitRect& rect : settingsCategoryRects) {\n                if (contains(rect, touch.x(), touch.y())) {\n                    settingsCategory = rect.index;\n                    settingsIndex = std::min(settingsIndex,\n                                             settingsOptionCount(settingsCategory) - 1);\n                    settingsCategoryFocused = true;\n                    return;\n                }\n            }\n            for (const HitRect& rect : settingsRects) {\n                if (contains(rect, touch.x(), touch.y())) {\n                    settingsIndex = rect.index;\n                    settingsCategoryFocused = false;\n                    kDown |= HidNpadButton_A;\n                    break;\n                }\n            }\n        }\n'''
          new='''    if (overlay == Overlay::Settings) {\n        // Native touch feedback: contact moves focus immediately; only a clean release activates.\n        if (touch.justTouchedDown()) {\n            for (const HitRect& rect : settingsCategoryRects) {\n                if (contains(rect, touch.x(), touch.y())) {\n                    settingsCategory = rect.index;\n                    settingsIndex = std::min(settingsIndex, settingsOptionCount(settingsCategory) - 1);\n                    settingsCategoryFocused = true;\n                    break;\n                }\n            }\n            for (const HitRect& rect : settingsRects) {\n                if (contains(rect, touch.x(), touch.y())) {\n                    settingsIndex = rect.index;\n                    settingsCategoryFocused = false;\n                    break;\n                }\n            }\n        }\n        if (touch.justTapped()) {\n            for (const HitRect& rect : settingsCategoryRects) {\n                if (contains(rect, touch.x(), touch.y())) {\n                    settingsCategory = rect.index;\n                    settingsIndex = std::min(settingsIndex, settingsOptionCount(settingsCategory) - 1);\n                    settingsCategoryFocused = true;\n                    return;\n                }\n            }\n            for (const HitRect& rect : settingsRects) {\n                if (contains(rect, touch.x(), touch.y())) {\n                    settingsIndex = rect.index;\n                    settingsCategoryFocused = false;\n                    kDown |= HidNpadButton_A;\n                    break;\n                }\n            }\n        }\n'''
          if s.count(old)!=1: raise SystemExit('settings touch block anchor mismatch')
          s=s.replace(old,new,1)
          old2='''    if (touch.justPressed()) {\n        for (const HitRect& rect : cardRects) {\n            if (contains(rect, touch.x(), touch.y())) {\n                selectedIndex = rect.index;\n                kDown |= HidNpadButton_A;\n                break;\n            }\n        }\n    }\n'''
          new2='''    if (touch.justTouchedDown()) {\n        for (const HitRect& rect : cardRects) {\n            if (contains(rect, touch.x(), touch.y())) {\n                selectedIndex = rect.index;\n                break;\n            }\n        }\n    }\n    if (touch.justTapped()) {\n        for (const HitRect& rect : cardRects) {\n            if (contains(rect, touch.x(), touch.y())) {\n                selectedIndex = rect.index;\n                kDown |= HidNpadButton_A;\n                break;\n            }\n        }\n    }\n'''
          if s.count(old2)!=1: raise SystemExit('root card touch block anchor mismatch')
          p.write_text(s.replace(old2,new2,1))
          PY
          git diff --check
      - name: Commit runtime only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/UI/AppShellScreen.cpp
          git commit -m 'fix(ui): give AppShell immediate touch focus feedback'
          git push origin HEAD:feature/touch-controls-20261005

name: L2 Breeding Legality (standalone native)
# Dedicated L2-only branch gate. Does not edit or replace shared host CI.
on:
  push:
    branches:
      - feature/legality-l2-breeding-20261012
  workflow_dispatch:

concurrency:
  group: l2-breeding-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  l2-full-suite:
    name: L2 seventeen suites ${{ matrix.compiler }} normal + ASan/UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - name: Checkout exact L2 head and source dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Record exact source and compiler identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Exact source HEAD: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          "${{ matrix.cxx }}" --version
      - name: Test structural source pair guards with both native profiles
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for mode in normal sanitizer; do
            flags=(-std=c++20 -Wall -Wextra -Wpedantic -Werror -Iinclude)
            if [[ "$mode" == sanitizer ]]; then
              flags+=(-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer)
            else
              flags+=(-O2)
            fi
            "$CXX" "${flags[@]}" tests/fixtures/legality_l2_original_daycare_roles.cpp -o "$tmp/roles"
            ASAN_OPTIONS=halt_on_error=1:detect_leaks=1 \
              UBSAN_OPTIONS=halt_on_error=1 "$tmp/roles" |
              grep -Fx 'L2 source parent role matrix: 12150 checks PASS'
          done
      - name: Verify original Ditto source snapshots and source-to-parent joins
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for mode in normal sanitizer; do
            flags=(-std=c++20 -Wall -Wextra -Wpedantic -Werror -Iinclude)
            if [[ "$mode" == sanitizer ]]; then
              flags+=(-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer)
            else
              flags+=(-O2)
            fi
            for name in legality_l2_original_personal_snapshot_guard legality_l2_breeding_personal_join; do
              "$CXX" "${flags[@]}" "tests/fixtures/$name.cpp" -o "$tmp/$name"
              ASAN_OPTIONS=halt_on_error=1:detect_leaks=1 \
                UBSAN_OPTIONS=halt_on_error=1 "$tmp/$name"
            done
          done
      - name: Verify Gen III original pending collection source transcript
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for mode in normal sanitizer; do
            flags=(-std=c++20 -Wall -Wextra -Wpedantic -Werror -Iinclude)
            if [[ "$mode" == sanitizer ]]; then
              flags+=(-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer)
            else
              flags+=(-O2)
            fi
            "$CXX" "${flags[@]}" \
              tests/fixtures/legality_l2_gen3_original_acquisition_properties.cpp \
              -o "$tmp/acquisition"
            ASAN_OPTIONS=halt_on_error=1:detect_leaks=1 \
              UBSAN_OPTIONS=halt_on_error=1 "$tmp/acquisition" |
              grep -Fx 'L2 original Gen III pending/collection transcript: 312000 PASS'
          done
      - name: Run all seventeen L2 native programs normally and with ASan/UBSan
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: bash tests/test_legality_l2_run_all.sh

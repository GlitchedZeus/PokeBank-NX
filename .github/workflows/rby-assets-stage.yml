name: RBY one-time artwork stage

on:
  push:
    branches: [tmp-rby-adapter]
    paths:
      - '.github/workflows/rby-assets-stage.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rby-adapter
          fetch-depth: 0
      - name: Fetch pinned Red Blue Yellow box art
        run: |
          set -euo pipefail
          mkdir -p assets/game_cards
          base='https://raw.githubusercontent.com/libretro-thumbnails/Nintendo_-_Game_Boy/f033af49af2d9761d6821aff479bb0ba5feea5e3/Named_Boxarts'
          curl -fL "$base/Pokemon%20-%20Red%20Version%20(USA%2C%20Europe)%20(SGB%20Enhanced).png" -o assets/game_cards/red_gb.png
          curl -fL "$base/Pokemon%20-%20Blue%20Version%20(USA%2C%20Europe)%20(SGB%20Enhanced).png" -o assets/game_cards/blue_gb.png
          curl -fL "$base/Pokemon%20-%20Yellow%20Version%20-%20Special%20Pikachu%20Edition%20(USA%2C%20Europe)%20(CGB%2BSGB%20Enhanced).png" -o assets/game_cards/yellow_gb.png
          python3 - <<'PY'
          from pathlib import Path
          for name in ('red_gb.png','blue_gb.png','yellow_gb.png'):
              data=(Path('assets/game_cards')/name).read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n'), name
              assert len(data) > 1024, name
              print(name, len(data), 'bytes')
          PY
          sha256sum assets/game_cards/red_gb.png assets/game_cards/blue_gb.png assets/game_cards/yellow_gb.png
      - name: Wire tracked artwork into the existing pipeline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/Games/GameIdentity.cpp'); s=p.read_text()
          anchor='''    std::string_view gameCardArtworkPath(std::string_view id) noexcept {\n        if (id == "ruby_gba") return "romfs:/game_cards/ruby_gba.png";\n'''
          repl='''    std::string_view gameCardArtworkPath(std::string_view id) noexcept {\n        if (id == "red_gb") return "romfs:/game_cards/red_gb.png";\n        if (id == "blue_gb") return "romfs:/game_cards/blue_gb.png";\n        if (id == "yellow_gb") return "romfs:/game_cards/yellow_gb.png";\n        if (id == "ruby_gba") return "romfs:/game_cards/ruby_gba.png";\n'''
          assert s.count(anchor)==1; p.write_text(s.replace(anchor,repl,1))

          p=Path('tests/test_game_identity.cpp'); s=p.read_text()
          anchor='''    assert(gameCardArtworkPath("firered_gba") == "romfs:/game_cards/firered_gba.png");\n'''
          repl='''    assert(gameCardArtworkPath("red_gb") == "romfs:/game_cards/red_gb.png");\n    assert(gameCardArtworkPath("blue_gb") == "romfs:/game_cards/blue_gb.png");\n    assert(gameCardArtworkPath("yellow_gb") == "romfs:/game_cards/yellow_gb.png");\n    assert(gameCardArtworkPath("firered_gba") == "romfs:/game_cards/firered_gba.png");\n'''
          assert s.count(anchor)==1; p.write_text(s.replace(anchor,repl,1))

          p=Path('Makefile'); s=p.read_text()
          anchor='''game-card-art:\n\t@mkdir -p "$(GAME_CARD_ART_DIR)"\n\t@cp -f "$(GAME_CARD_ART_SOURCE)/firered_gba.png" "$(GAME_CARD_ART_DIR)/firered_gba.png"\n'''
          repl='''game-card-art:\n\t@mkdir -p "$(GAME_CARD_ART_DIR)"\n\t@cp -f "$(GAME_CARD_ART_SOURCE)/red_gb.png" "$(GAME_CARD_ART_DIR)/red_gb.png"\n\t@cp -f "$(GAME_CARD_ART_SOURCE)/blue_gb.png" "$(GAME_CARD_ART_DIR)/blue_gb.png"\n\t@cp -f "$(GAME_CARD_ART_SOURCE)/yellow_gb.png" "$(GAME_CARD_ART_DIR)/yellow_gb.png"\n\t@cp -f "$(GAME_CARD_ART_SOURCE)/firered_gba.png" "$(GAME_CARD_ART_DIR)/firered_gba.png"\n'''
          assert s.count(anchor)==1; p.write_text(s.replace(anchor,repl,1))

          p=Path('tools/check_device_assets.py'); s=p.read_text()
          old='''    required_game_cards = (\n        "firered_gba.png", "leafgreen_gba.png",\n        "ruby_gba.png", "sapphire_gba.png", "emerald_gba.png",\n    )\n'''
          new='''    required_game_cards = (\n        "red_gb.png", "blue_gb.png", "yellow_gb.png",\n        "firered_gba.png", "leafgreen_gba.png",\n        "ruby_gba.png", "sapphire_gba.png", "emerald_gba.png",\n    )\n'''
          assert s.count(old)==1; s=s.replace(old,new,1)
          s=s.replace('required GBA game-card artwork missing:', 'required game-card artwork missing:')
          s=s.replace('FireRed/LeafGreen/Ruby/Sapphire/Emerald GBA game-card artwork is present',
                      'Red/Blue/Yellow GB + FireRed/LeafGreen/Ruby/Sapphire/Emerald GBA game-card artwork is present')
          p.write_text(s)

          Path('assets/game_cards/README.md').write_text('''# Packaged game-card artwork\n\nGeneration I Red/Blue/Yellow and Generation III Ruby/Sapphire/Emerald/FireRed/LeafGreen parent cards use the shared `SystemIcons::gameCardIcon` resolver and these release-specific tracked assets. They are copied into `romfs:/game_cards/` by `make game-card-art`.\n\n## Game Boy — Red / Blue / Yellow\n\nSource repository: `libretro-thumbnails/Nintendo_-_Game_Boy`\n\nPinned revision: `f033af49af2d9761d6821aff479bb0ba5feea5e3`\n\nFiles:\n\n- `Named_Boxarts/Pokemon - Red Version (USA, Europe) (SGB Enhanced).png` -> `red_gb.png`\n- `Named_Boxarts/Pokemon - Blue Version (USA, Europe) (SGB Enhanced).png` -> `blue_gb.png`\n- `Named_Boxarts/Pokemon - Yellow Version - Special Pikachu Edition (USA, Europe) (CGB+SGB Enhanced).png` -> `yellow_gb.png`\n\nThe exact SHA-256 values are captured by the staging/build records and device preflight.\n\n## Game Boy Advance — Generation III\n\nSource repository: `libretro-thumbnails/Nintendo_-_Game_Boy_Advance`\n\nPinned revision: `23b8665408e767fd3220bfb83fd5ad8dfe1a9aa1`\n\nFiles:\n\n- `Named_Boxarts/Pokemon - FireRed Version (USA).png` -> `firered_gba.png`\n- `Named_Boxarts/Pokemon - LeafGreen Version (USA).png` -> `leafgreen_gba.png`\n- `Named_Boxarts/Pokemon - Ruby Version (USA).png` -> `ruby_gba.png`\n- `Named_Boxarts/Pokemon - Sapphire Version (USA).png` -> `sapphire_gba.png`\n- `Named_Boxarts/Pokemon - Emerald Version (USA, Europe).png` -> `emerald_gba.png`\n\nExisting SHA-256 values:\n\n- `firered_gba.png`: `d7c4f0661bf528d6555969da7b18efc7611fc35d0a4d911538fd1c398c7ce964`\n- `leafgreen_gba.png`: `7d73f2d7fecd2b5d2339bdf4d6000d45f20e046951f6e89dd2f73476498bc373`\n- `ruby_gba.png`: `0c264af577ca175f0d73b6766b1100dd4b78d6728bbcfb07298679500f0316e1`\n- `sapphire_gba.png`: `2bcea4502d475507ed7f07f3bbaf45f36ec30446c5a02519f950bea31b3154fb`\n- `emerald_gba.png`: `f39a4d3d7044d2ad693a60f6af362619f7268cd9187c6576f3d4e3373dfa49b5`\n\nPokémon and its artwork are trademarks/copyright of their respective owners. These images are included for game identification in this non-commercial homebrew utility; upstream attribution and project licensing remain intact.\n''')
          PY
          git diff --check
      - name: Commit pinned RBY artwork and pipeline
        run: |
          set -euo pipefail
          git config user.name 'PokeBank NX CI'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/game_cards src/Games/GameIdentity.cpp tests/test_game_identity.cpp Makefile tools/check_device_assets.py
          git commit -m 'assets: add pinned RBY game-card artwork'
          git push origin HEAD:tmp-rby-adapter

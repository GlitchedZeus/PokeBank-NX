name: Gen I/II legality vs PKHeX

# Differential test: generate tens of thousands of Gen I (PK1) and Gen II (PK2) Pokemon
# (natural encounters, eggs, gifts, trades, Time Capsule transfers, grown and evolved
# ones, deliberately broken ones, random records), then compare PokeBank NX's verdict
# on every one with PKHeX.Core's. Every corpus record must get a verdict from both.
# Also rebuilds the generated Gen I/II tables and checks them against the pret
# disassemblies.

on:
  pull_request:
    paths:
      - 'src/Legality/**'
      - 'include/Legality/GB*'
      - 'src/Integration/Gen1/**'
      - 'src/Integration/Gen2/Gen2ReadOnlySave.cpp'
      - 'tools/gen_gb_legality_data.py'
      - 'tools/verify_gb_legality_data.py'
      - 'tools/pkhex_gb_diff/**'
      - 'tests/audit/**'
      - '.github/workflows/legality-gb-pkhex-diff.yml'
  workflow_dispatch:

concurrency:
  group: legality-gb-pkhex-diff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PKHEX_SHA: 6501f0ab46e8f8ca048539dbaf8cae8cb104e722
  POKERED_SHA: af519899719f0754965776faac0e836a3b906e6d
  POKEYELLOW_SHA: e89ead154b9968aa50eed9328ff2b38b6c194382

jobs:
  diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kwsch/PKHeX
          ref: ${{ env.PKHEX_SHA }}
          path: _ref/PKHeX
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pret/pokered
          ref: ${{ env.POKERED_SHA }}
          path: _ref/pokered
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pret/pokeyellow
          ref: ${{ env.POKEYELLOW_SHA }}
          path: _ref/pokeyellow
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generated tables are up to date
        run: |
          python3 -I tools/gen_gb_legality_data.py --pkhex _ref/PKHeX
          git diff --exit-code -- src/Legality/GBLegalityData.cpp

      - name: GB differential protocol rejects masked or malformed evidence
        run: python3 -m unittest discover -s tools/pkhex_gb_diff/audit -p 'test_protocol.py' -v

      - name: Native PK1 application retains guards bypassed by the differential
        run: |
          make -f Makefile.host -f tests/audit/Makefile.gen12 build-host/audit_gen1_analyzer_guards build-host/audit_gen1_analyzer_guards_san
          build-host/audit_gen1_analyzer_guards
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 build-host/audit_gen1_analyzer_guards_san

      - name: Native GB checker boundary and verdict integrity
        run: |
          make -f Makefile.host -f tests/audit/Makefile.gen12 build-host/audit_gen12_verdict_integrity build-host/audit_gen12_verdict_integrity_san
          build-host/audit_gen12_verdict_integrity
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 build-host/audit_gen12_verdict_integrity_san

      - name: Tables agree with the pret disassemblies
        run: python3 -I tools/verify_gb_legality_data.py --pkhex _ref/PKHeX --pokered _ref/pokered --pokeyellow _ref/pokeyellow

      - name: PK1 verdicts agree with PKHeX (3 x 50,000 Pokemon)
        run: |
          for seed in 1 2 3; do
            tools/pkhex_gb_diff/run.sh _ref/PKHeX _ref/pokered 50000 "$seed" 1
          done

      - name: PK2 verdicts agree with PKHeX (3 x 50,000 Pokemon)
        run: |
          for seed in 1 2 3; do
            tools/pkhex_gb_diff/run.sh _ref/PKHeX _ref/pokered 50000 "$seed" 2
          done

      # This gate deliberately FAILS for the current production defects. Do not
      # waive it as an intentional PKHeX difference: expectations come from
      # native record invariants and the original games, independently of PKHeX.
      - name: Independent native duplicate-move and EXP regressions
        run: tools/pkhex_gb_diff/audit/run.sh _ref/PKHeX _audit_gb

      - name: Preserve independent structural findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gb-independent-structural-${{ github.sha }}
          path: |
            _audit_gb/corpus.txt
            _audit_gb/manifest.json
            _audit_gb/pkhex.txt
            _audit_gb/nx.txt
            _audit_gb/structural-results.json
          if-no-files-found: warn

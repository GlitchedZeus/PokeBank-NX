name: Apply RSE open-regression test patch

on:
  push:
    branches:
      - feature/pokebank-playable
    paths:
      - .github/workflows/apply-rse-open-test-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/pokebank-playable
          fetch-depth: 0
          submodules: recursive

      - name: Apply focused patch
        run: python3 tools/apply_rse_open_regression_patch.py

      - name: Check diff
        run: git diff --check

      - name: Run host tests
        run: |
          make -f Makefile.host host-clean
          make -f Makefile.host host-test

      - name: Run focused RSE open regression
        run: |
          set -o pipefail
          SOURCES="tests/test_rse_open_regression.cpp src/Integration/Gen3/PKSMGen3NativeAdapter.cpp src/Integration/Gen3/FRLGReadModel.cpp src/Legacy/FRLGReadOnlyTrainer.cpp src/Pokemon/Pokemon3FRLG.cpp src/Pokemon/BaseStatsGen89.cpp src/Pokemon/PersonalInfoTable.cpp src/Pokemon/Experience.cpp src/Encryption/Encryption3FRLG.cpp src/Names/ItemNames.cpp src/Names/SpeciesNames.cpp src/Names/NatureNames.cpp src/Names/AbilityNames.cpp src/Utils/StringHelpers.cpp src/Utils/HelperUtilities.cpp src/Utils/SHA256.cpp src/Games/GameIdentity.cpp"
          {
            set -x
            g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -O2 -DPOKEBANK_GEN3_SELECTIVE_PORT_TEST -Iinclude $SOURCES -o build-host/test_rse_open_regression
            ./build-host/test_rse_open_regression
          } 2>&1 | tee focused-rse.log

      - name: Run sanitizers
        run: |
          make -f Makefile.host host-sanitize
          set -o pipefail
          SOURCES="tests/test_rse_open_regression.cpp src/Integration/Gen3/PKSMGen3NativeAdapter.cpp src/Integration/Gen3/FRLGReadModel.cpp src/Legacy/FRLGReadOnlyTrainer.cpp src/Pokemon/Pokemon3FRLG.cpp src/Pokemon/BaseStatsGen89.cpp src/Pokemon/PersonalInfoTable.cpp src/Pokemon/Experience.cpp src/Encryption/Encryption3FRLG.cpp src/Names/ItemNames.cpp src/Names/SpeciesNames.cpp src/Names/NatureNames.cpp src/Names/AbilityNames.cpp src/Utils/StringHelpers.cpp src/Utils/HelperUtilities.cpp src/Utils/SHA256.cpp src/Games/GameIdentity.cpp"
          {
            set -x
            g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -DPOKEBANK_GEN3_SELECTIVE_PORT_TEST -Iinclude $SOURCES -o build-host/test_rse_open_regression_sanitize
            ASAN_OPTIONS=detect_leaks=0 ./build-host/test_rse_open_regression_sanitize
          } 2>&1 | tee focused-rse-sanitize.log

      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rse-open-focused-${{ github.run_id }}
          path: |
            focused-rse.log
            focused-rse-sanitize.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit and push tested patch
        run: |
          git config user.name "PokeBank NX CI"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_rse_gen3_adapter.cpp src/Integration/Gen3/PKSMGen3Adapter.cpp src/Integration/Gen3/PKSMGen3NativeAdapter.cpp
          git diff --cached --check
          git commit -m "tests: enforce nonfatal RSE inventory regression"
          git push origin HEAD:feature/pokebank-playable

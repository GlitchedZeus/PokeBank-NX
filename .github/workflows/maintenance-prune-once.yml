name: One-time verified fully-contained branch cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: contained-only-branch-prune
  cancel-in-progress: false
jobs:
  safe-prune:
    if: "${{ github.event.head_commit.message == 'chore(maintenance): delete only 14 verified contained branches' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RECOVERY_RELEASE: maintenance/pre-branch-prune-20261102-bbc9dd69
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify full preservation archive and all current branches
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RECOVERY_RELEASE" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets.txt"
          for asset in PokeBank-NX-PRE-PRUNE.bundle PokeBank-NX-PRE-PRUNE.bundle.sha256 refs.tsv BRANCH_DELETION_LOG.tsv; do
            grep -Fxq "$asset" "$RUNNER_TEMP/assets.txt"
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RECOVERY_RELEASE" \
            --jq '.assets[]|select(.name=="PokeBank-NX-PRE-PRUNE.bundle")|.size' | grep -qx 207503872
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
          echo "BEFORE: $(git ls-remote --heads origin | wc -l) branches"
      - name: Remove only exact SHA branches contained in surviving refs and not used by any live PR
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/contained-candidates.txt" <<'CANDIDATES'
audit/app-qa-20261014|aecc9ea69a98da1c5ed2e96ce8e376ff0f547614|main
claude/gen4-capture-ball|b8eb006ebb85900684ce4caac4d75a18ebb5a8be|claude/gen1-5-legality-campaign-w9mkom
claude/gen5-home-providers-20261015|ece88e279ba3185619f229fb8bed9e0cf27969ec|main
claude/gen14-campaign-20261015|73248a1549d80f745fb927e9849a87e922c483b0|main
claude/gen14-final-20261014|4b9b9f656ae204a8ddda0bb44cbe2d79ce7e9be5|main
claude/launch-return-20261015|e7bce8cbb7be2bc18265d1208370b7c10044ea61|main
claude/pensive-cerf-pueceq|bc9d8c205b05a55bfbad3c913c0a52bedce0b71a|claude/gen1-5-legality-campaign-w9mkom
claude/pickers-search-scrollbar-20261017|e52b7d97ba25cd4b1aa7d19a67d8925775d11d47|main
claude/shared-editor-gen35-20261016|42a9278065dc9056a4744a7c06365a4282d06654|main
audit/legality-integration-hardening-20261012|67f56f38008d1fc716756683a49654b25fb053fc|claude/gen1-5-legality-campaign-w9mkom
claude/legality-gen3-negai-boshi-lifetime|2761a75d5a2d934cf56123c8d129600ec6a44678|claude/gen1-5-legality-campaign-w9mkom
feature/legality-sourcefree-pk4-gen4-move-acquisition-20261011|a1eea80bdd1bdd611cf1d528adb807524d8b6716|feature/legality-sourcefree-egg-move-guard-20261011
feature/legality-sourcefree-pk4-palpark-move-history-20261011|3df1de8316d14ab0e2b3405655e88880834092d4|feature/legality-sourcefree-egg-move-guard-20261011
feature/legality-sourcefree-pk12-move-compatibility-20261011|14baf42c03acd36915b90b5f70761a89055fbdd9|feature/legality-sourcefree-egg-move-guard-20261011
CANDIDATES
          deleted=0
          skipped=0
          while IFS='|' read -r branch expected containing; do
            echo "CHECK: $branch"
            # Live PR API errors abort before deletion. Heads and bases are protected.
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
              --jq '.[] | .head.ref, .base.ref' > "$RUNNER_TEMP/open-pr-refs.txt"
            if grep -Fxq "$branch" "$RUNNER_TEMP/open-pr-refs.txt"; then
              echo "SKIP open PR dependency: $branch"
              skipped=$((skipped+1))
              continue
            fi
            current="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [[ -z "$current" ]]; then
              echo "SKIP already absent: $branch"
              skipped=$((skipped+1))
              continue
            fi
            if [[ "$current" != "$expected" ]]; then
              echo "SKIP changed tip: $branch at $current"
              skipped=$((skipped+1))
              continue
            fi
            # Must be FULL COMMIT HISTORY containment, not patch equivalence.
            survivor="$(git ls-remote --heads origin "refs/heads/$containing" | awk '{print $1}')"
            if [[ -z "$survivor" ]] || ! git cat-file -e "$survivor^{commit}" || \
               ! git merge-base --is-ancestor "$expected" "$survivor"; then
              echo "SKIP no live full containment: $branch into $containing"
              skipped=$((skipped+1))
              continue
            fi
            git push --quiet "--force-with-lease=refs/heads/$branch:$expected" origin --delete "$branch"
            test -z "$(git ls-remote --heads origin "refs/heads/$branch")"
            echo "DELETED verified contained: $branch@$expected in $containing@$survivor"
            deleted=$((deleted+1))
          done < "$RUNNER_TEMP/contained-candidates.txt"
          echo "FINAL: deleted $deleted, skipped $skipped, live branches $(git ls-remote --heads origin | wc -l)"
          test "$deleted" -gt 0

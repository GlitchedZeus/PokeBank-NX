name: One-time owner-approved branch prune
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: owner-branch-prune
  cancel-in-progress: false
jobs:
  prune:
    if: "${{ github.event.head_commit.message == 'chore(maintenance): resume audited branch cleanup with archived deletion log' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BACKUP_TAG: maintenance/pre-branch-prune-20261102-bbc9dd69
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Pin the audited script and set archive tag identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git switch --detach cf891c50ad8184d3cf95c010f1b2ad425b1c62d2
          bash -n tools/qa/maintenance/prune_branches.sh
          test -f docs/maintenance/branch_audit_2026-11-02_phase2.json
          echo "BRANCHES BEFORE RESUME: $(git ls-remote --heads origin | wc -l)"
      - name: Restore first-run deletion ledger and verify permanent recovery release
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$BACKUP_TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/archive-assets.txt"
          for asset in PokeBank-NX-PRE-PRUNE.bundle PokeBank-NX-PRE-PRUNE.bundle.sha256 refs.tsv BRANCH_DELETION_LOG.md BRANCH_DELETION_LOG.tsv; do
            grep -Fxq "$asset" "$RUNNER_TEMP/archive-assets.txt" || { echo "Missing recovery release asset: $asset"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/previous-deletion-log"
          gh release download "$BACKUP_TAG" --dir "$RUNNER_TEMP/previous-deletion-log" \
            --pattern 'BRANCH_DELETION_LOG.*'
          cp "$RUNNER_TEMP/previous-deletion-log/BRANCH_DELETION_LOG.md" docs/maintenance/BRANCH_DELETION_LOG.md
          cp "$RUNNER_TEMP/previous-deletion-log/BRANCH_DELETION_LOG.tsv" docs/maintenance/BRANCH_DELETION_LOG.tsv
          deleted="$(awk -F '\t' '$9=="DELETE"{n++} END{print n+0}' docs/maintenance/BRANCH_DELETION_LOG.tsv)"
          echo "VERIFIED PREVIOUS DELETIONS: $deleted"
          test "$deleted" -ge 200
      - name: Resume archived unique and patch-equivalent branches only
        shell: bash
        run: |
          set -euo pipefail
          bash tools/qa/maintenance/prune_branches.sh --execute --yes \
            --group equivalent-archive --group unique-archive \
            --bundle-dir "$RUNNER_TEMP" --batch-size 25
      - name: Persist combined deletion ledger in permanent release and report branches
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$BACKUP_TAG" >/dev/null 2>&1; then
            for f in docs/maintenance/BRANCH_DELETION_LOG.md docs/maintenance/BRANCH_DELETION_LOG.tsv; do
              if [[ -f "$f" ]]; then gh release upload "$BACKUP_TAG" "$f" --clobber; fi
            done
          fi
          echo "LIVE BRANCHES AFTER: $(git ls-remote --heads origin | wc -l)"

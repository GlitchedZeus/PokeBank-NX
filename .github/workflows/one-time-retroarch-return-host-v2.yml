name: ONE-TIME install RetroArch return host v2

on:
  push:
    branches:
      - feature/gen4-full-editor-20260928
    paths:
      - '.github/workflows/one-time-retroarch-return-host-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact MAIN hardware branch
        uses: actions/checkout@v4
        with:
          ref: feature/gen4-full-editor-20260928
          fetch-depth: 4

      - name: Guard forward-only parent
        env:
          EXPECTED_STAGING_PARENT: 99e82597963c5464fb83701a7fc3adf9243c9368
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_STAGING_PARENT"
          echo "STAGING_SHA=$(git rev-parse HEAD)"
          echo "PARENT_SHA=$(git rev-parse HEAD^)"

      - name: Correct contract escaping and apply return-host repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_retroarch_return_host_patch.py')
          text = p.read_text(encoding='utf-8')
          old = "'        \"g_nextNroPath[0] == \\\'\\\\0\\\'\" in return_host_source,\\n'"
          new = "'        r\"g_nextNroPath[0] == \\\'\\\\0\\\'\" in return_host_source,\\n'"
          if text.count(old) != 1:
              raise SystemExit(f'expected one contract-escape match, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 tools/apply_retroarch_return_host_patch.py
          git diff --check
          python3 tests/test_game_hub_contract.py

      - name: Commit and push runtime repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile include/UI/GameLauncher.h src/main.cpp src/UI/GameLauncher.cpp \
            runtime/return_host tests/test_game_hub_contract.py .github/workflows/product-ui-native.yml
          git diff --cached --check
          test -n "$(git status --porcelain)"
          git commit -m "fix(launch): return from RetroArch to PokeBank"
          git push origin HEAD:feature/gen4-full-editor-20260928

name: GSC focused staging verification
on:
  push:
    branches: [codex/gsc-readonly]
  pull_request:
    branches: [feature/pokebank-playable]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gsc-readonly
          fetch-depth: 0
          submodules: recursive
      - name: Verify pinned Gen II gender oracle table
        run: |
          set -euo pipefail
          cp include/Integration/Gen2/Gen2GenderTable.h /tmp/Gen2GenderTable.committed.h
          python3 tools/generate_gen2_gender_table.py
          cmp /tmp/Gen2GenderTable.committed.h include/Integration/Gen2/Gen2GenderTable.h
      - name: Compile and run strict GSC parser
        run: |
          set -euo pipefail
          mkdir -p build-gsc
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -O2 -Iinclude \
            tests/test_gsc_gen2_adapter.cpp src/Integration/Gen2/Gen2ReadOnlySave.cpp \
            -o build-gsc/test_gsc_gen2_adapter
          ./build-gsc/test_gsc_gen2_adapter
      - name: Compile and run strict GSC inventory and item names
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -O2 -Iinclude \
            tests/test_gsc_inventory.cpp src/Integration/Gen2/Gen2ReadOnlyInventory.cpp \
            src/Names/ItemNamesGen2.cpp -o build-gsc/test_gsc_inventory
          ./build-gsc/test_gsc_inventory
      - name: Compile and run GSC Trainer bridge
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -O2 -Iinclude \
            tests/test_gsc_readonly_bridge.cpp src/Legacy/GSCReadOnlyTrainer.cpp \
            src/Pokemon/Pokemon2ReadOnly.cpp src/Integration/Gen2/Gen2ReadOnlySave.cpp \
            src/Integration/Gen2/Gen2ReadOnlyInventory.cpp src/Pokemon/BaseStatsGen89.cpp \
            src/Names/SpeciesNames.cpp src/Utils/StringHelpers.cpp src/Utils/HelperUtilities.cpp \
            -o build-gsc/test_gsc_readonly_bridge
          ./build-gsc/test_gsc_readonly_bridge
      - name: Sanitizers
        run: |
          set -euo pipefail
          SAN='-fsanitize=address,undefined -fno-omit-frame-pointer -O1'
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror $SAN -Iinclude \
            tests/test_gsc_gen2_adapter.cpp src/Integration/Gen2/Gen2ReadOnlySave.cpp -o build-gsc/test_gsc_gen2_adapter_san
          ASAN_OPTIONS=detect_leaks=0 ./build-gsc/test_gsc_gen2_adapter_san
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror $SAN -Iinclude \
            tests/test_gsc_inventory.cpp src/Integration/Gen2/Gen2ReadOnlyInventory.cpp src/Names/ItemNamesGen2.cpp \
            -o build-gsc/test_gsc_inventory_san
          ASAN_OPTIONS=detect_leaks=0 ./build-gsc/test_gsc_inventory_san
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter $SAN -Iinclude \
            tests/test_gsc_readonly_bridge.cpp src/Legacy/GSCReadOnlyTrainer.cpp \
            src/Pokemon/Pokemon2ReadOnly.cpp src/Integration/Gen2/Gen2ReadOnlySave.cpp \
            src/Integration/Gen2/Gen2ReadOnlyInventory.cpp src/Pokemon/BaseStatsGen89.cpp \
            src/Names/SpeciesNames.cpp src/Utils/StringHelpers.cpp src/Utils/HelperUtilities.cpp \
            -o build-gsc/test_gsc_readonly_bridge_san
          ASAN_OPTIONS=detect_leaks=0 ./build-gsc/test_gsc_readonly_bridge_san
      - name: Diff safety
        run: git diff --check ac903cbd791353af9b07a345dcc2ed5b9eed1518..HEAD

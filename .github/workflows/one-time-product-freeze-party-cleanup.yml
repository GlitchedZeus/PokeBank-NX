name: One-time Product Home forwarder source repair

on:
  push:
    branches:
      - feature/gen4-full-editor-20260928

permissions:
  contents: write

jobs:
  repair:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded repair
        run: python3 tools/one_time_forwarder_source_repair.py
      - name: Focused Product Home contract
        run: python3 tests/test_game_hub_contract.py
      - name: Commit only if branch head is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git fetch origin feature/gen4-full-editor-20260928
          remote_head="$(git rev-parse origin/feature/gen4-full-editor-20260928)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/UI/SaveSelectScreen.cpp tests/test_game_hub_contract.py
          git commit -m "fix(ui): separate forwarder launch and GBA save identity"
          git push origin HEAD:feature/gen4-full-editor-20260928

name: One-time professional touch View patch runner

on:
  push:
    branches: [feature/touch-controls-20261005]
    paths:
      - .github/workflows/one-time-product-freeze-party-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact touch head
        run: |
          set -euo pipefail
          git fetch origin feature/touch-controls-20261005
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/feature/touch-controls-20261005)" = "$GITHUB_SHA"
      - name: Patch View and report panels directly
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def exact(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != 1: raise SystemExit(f"{path}: exact anchor count={n}: {old[:100]!r}")
              p.write_text(s.replace(old,new,1))

          # Details state: distinguish manual finger scrolling from controller auto-follow.
          exact('include/UI/TrainerViewScreenBase.h',
          """            int  leftScroll = 0;                         // left-pane vertical scroll (px); auto-follows selection, reset on (re)open
            std::vector<int> leftOrder;                  // left-pane editable field ids in DRAW order (rebuilt each draw)
""",
          """            int  leftScroll = 0;                         // left-pane vertical scroll (px); controller navigation auto-follows selection
            bool leftScrollManual = false;               // finger drag owns this pane until direct/controller selection resumes
            int legalityScroll = 0;                      // first visible row in the legality report
            int ribbonScroll = 0;                        // first visible row in the ribbon/mark report
            std::vector<int> leftOrder;                  // left-pane editable field ids in DRAW order (rebuilt each draw)
""")

          p=Path('src/UI/TrainerViewScreenBase.inc'); s=p.read_text()
          old="""            // Legality overlay (full issue list) intercepts input while open: B or any tap closes it.
            if (details.legalityOverlay) {
                if ((kDown & HidNpadButton_B) || tb >= 0) details.legalityOverlay = false;
                return;
            }
            // Ribbon overlay (full ribbon/mark list) does the same.
            if (details.ribbonOverlay) {
                if ((kDown & HidNpadButton_B) || tb >= 0) details.ribbonOverlay = false;
                return;
            }
            // Open the ribbon list: Y, or tapping the Ribbons row (id 94).
            if ((kDown & HidNpadButton_Y) || tb == 94) {
                details.ribbonOverlay = true;
                return;
            }
            // Open the legality issue list: R, or tapping the legality summary (id 95) -- but ONLY
            // when the mon actually has issues. A clean mon has nothing to show, so the button is
            // disabled (greyed in the guide) and this does nothing.
            if ((kDown & HidNpadButton_R) || tb == 95) {
                if (pokemon && !Legality::analyze(*pokemon, pokemon->getGameGroup()).ok())
                    details.legalityOverlay = true;
                return;
            }
"""
          new="""            // Report overlays own touch while open. Drag scrolls; only B or the explicit
            // Close target dismisses them, so reading a long report never becomes an accidental close.
            if (details.legalityOverlay) {
                if ((kDown & HidNpadButton_B) || tb == 196) {
                    details.legalityOverlay = false; details.legalityScroll = 0; return;
                }
                if (kDown & HidNpadButton_Up) details.legalityScroll = std::max(0, details.legalityScroll - 1);
                if (kDown & HidNpadButton_Down) ++details.legalityScroll;
                if (kDown & HidNpadButton_L) details.legalityScroll = std::max(0, details.legalityScroll - 8);
                if (kDown & HidNpadButton_R) details.legalityScroll += 8;
                if (touch.justReleased() && touch.dragged()) {
                    const int dy = touch.deltaY();
                    const int steps = std::max(1, std::abs(dy) / 30);
                    if (dy < 0) details.legalityScroll += steps;
                    else if (dy > 0) details.legalityScroll = std::max(0, details.legalityScroll - steps);
                }
                return;
            }
            if (details.ribbonOverlay) {
                if ((kDown & HidNpadButton_B) || tb == 196) {
                    details.ribbonOverlay = false; details.ribbonScroll = 0; return;
                }
                if (kDown & HidNpadButton_Up) details.ribbonScroll = std::max(0, details.ribbonScroll - 1);
                if (kDown & HidNpadButton_Down) ++details.ribbonScroll;
                if (kDown & HidNpadButton_L) details.ribbonScroll = std::max(0, details.ribbonScroll - 8);
                if (kDown & HidNpadButton_R) details.ribbonScroll += 8;
                if (touch.justReleased() && touch.dragged()) {
                    const int dy = touch.deltaY();
                    const int steps = std::max(1, std::abs(dy) / 28);
                    if (dy < 0) details.ribbonScroll += steps;
                    else if (dy > 0) details.ribbonScroll = std::max(0, details.ribbonScroll - steps);
                }
                return;
            }
            // Open reports from their visible row/controller shortcut at the top of the list.
            if ((kDown & HidNpadButton_Y) || tb == 94) {
                details.ribbonScroll = 0; details.ribbonOverlay = true; return;
            }
            if ((kDown & HidNpadButton_R) || tb == 95) {
                if (pokemon && !Legality::analyze(*pokemon, pokemon->getGameGroup()).ok()) {
                    details.legalityScroll = 0; details.legalityOverlay = true;
                }
                return;
            }
"""
          if s.count(old)!=1: raise SystemExit('details report input block moved')
          s=s.replace(old,new,1)

          touch_anchor="""            // Touch: close button (99), or a stat row (0-5) / shiny (6) -> select + act (like A).
"""
          drag="""            // Native View-panel scroll: drag the left information column itself. Once a gesture
            // is a drag it returns here and cannot activate the row that happens to be under release.
            if (touch.justReleased() && touch.dragged() &&
                touch.startX() >= 24 && touch.startX() < 454 &&
                touch.startY() >= 250 && touch.startY() < 666) {
                details.leftScroll = std::max(0, details.leftScroll - touch.deltaY());
                details.leftScrollManual = true;
                return;
            }

"""
          if s.count(touch_anchor)!=1: raise SystemExit('details touch anchor moved')
          s=s.replace(touch_anchor,drag+touch_anchor,1)
          oldtap="            if (tb >= 0 && tb <= 31) { details.selectedField = tb; kDown |= HidNpadButton_A; }\n"
          newtap="            if (tb >= 0 && tb <= 31) { details.leftScrollManual = false; details.selectedField = tb; kDown |= HidNpadButton_A; }\n"
          if s.count(oldtap)!=1: raise SystemExit('details row tap anchor moved')
          s=s.replace(oldtap,newtap,1)
          nav="""            {
                int& f = details.selectedField;
"""
          navnew="""            {
                if (kDown & (HidNpadButton_Up | HidNpadButton_Down | HidNpadButton_Left | HidNpadButton_Right))
                    details.leftScrollManual = false;
                int& f = details.selectedField;
"""
          if s.count(nav)!=1: raise SystemExit('details nav anchor moved')
          s=s.replace(nav,navnew,1)
          p.write_text(s)

          p=Path('src/UI/Modals/PokemonDetailsModal.cpp'); s=p.read_text()
          auto="""            if (selRowY >= 0) {
                if (selRowY - s < contentTop)                s = selRowY - contentTop;
                else if ((selRowY + RH) - s > contentBottom) s = (selRowY + RH) - contentBottom;
            }
"""
          autonew="""            if (!screen.details.leftScrollManual && selRowY >= 0) {
                if (selRowY - s < contentTop)                s = selRowY - contentTop;
                else if ((selRowY + RH) - s > contentBottom) s = (selRowY + RH) - contentBottom;
            }
"""
          if s.count(auto)!=1: raise SystemExit('left pane auto-follow block moved')
          s=s.replace(auto,autonew,1)

          legal_pat=r'''        // Legality issue overlay .*?\n        if \(screen\.details\.legalityOverlay\) \{.*?\n        \}\n\n        // Ribbon list overlay'''
          legal_repl="""        // Legality report: clipped touch-scroll surface with an explicit Close target.
        if (screen.details.legalityOverlay) {
            struct ReportLine { std::string text; Color color; };
            std::vector<ReportLine> lines;
            if (legalityRep.ok()) lines.push_back({"No problems found.", Color(120, 205, 140)});
            else for (const auto& is : legalityRep.issues) {
                if (is.severity == Legality::Severity::Info) continue;
                const Color c = (is.severity == Legality::Severity::Invalid) ? Color(235, 100, 100) : Colors::Orange;
                const char* tag = (is.severity == Legality::Severity::Invalid) ? "[illegal]  " : "[warning]  ";
                lines.push_back({std::string(tag) + is.text, c});
            }
            const int ow=820, oh=H-100, ox=(W-ow)/2, oy=50;
            const int listTop=oy+76, listBottom=oy+oh-72, rowH=30;
            const int visible=std::max(1,(listBottom-listTop)/rowH);
            const int maxScroll=std::max(0,static_cast<int>(lines.size())-visible);
            screen.details.legalityScroll=std::clamp(screen.details.legalityScroll,0,maxScroll);
            fb.drawFilledRect(0,0,W,H,Color(0,0,0,170));
            fb.drawFilledRoundedRect(ox,oy,ow,oh,16,Colors::Panel);
            fb.drawRoundedRect(ox,oy,ow,oh,16,Colors::Border,1);
            fb.drawText(ox+24,oy+20,"Legality",Colors::Text,TextStyle::Heading);
            fb.drawText(ox+24,oy+50,"Swipe to scroll",Colors::TextDim,TextStyle::Caption);
            fb.setClipRect(ox+20,listTop,ow-40,listBottom-listTop);
            int ly=listTop;
            for(int i=screen.details.legalityScroll;i<static_cast<int>(lines.size()) && i<screen.details.legalityScroll+visible;++i){
                fb.drawText(ox+28,ly,lines[static_cast<size_t>(i)].text,lines[static_cast<size_t>(i)].color,TextStyle::Caption); ly+=rowH;
            }
            fb.clearClip();
            drawScrollbar(fb,ox+ow-12,listTop,listBottom-listTop,std::max(1,static_cast<int>(lines.size())*rowH),screen.details.legalityScroll*rowH);
            const int closeW=150,closeH=44,closeX=ox+ow-closeW-22,closeY=oy+oh-closeH-14;
            drawGlyphButton(fb,closeX,closeY,closeW,closeH,"B","Close");
            screen.touchButtons.push_back({196,closeX,closeY,closeW,closeH});
        }

        // Ribbon list overlay"""
          s,n=re.subn(legal_pat,legal_repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('legality render block moved')

          ribbon_pat=r'''        // Ribbon list overlay .*?\n        if \(screen\.details\.ribbonOverlay\) \{.*?\n        \}\n    \}\n\}\n\}'''
          ribbon_repl="""        // Ribbon/mark report uses the same native scroll contract in two columns.
        if (screen.details.ribbonOverlay) {
            const auto rb=Names::getMonRibbons(reinterpret_cast<const uint8_t*>(p->getData().data()),p->getGameGroup());
            const int ow=860,oh=H-100,ox=(W-ow)/2,oy=50;
            const int listTop=oy+76,listBottom=oy+oh-72,rowH=30,cols=2;
            const int visibleRows=std::max(1,(listBottom-listTop)/rowH);
            const int totalRows=(static_cast<int>(rb.size())+cols-1)/cols;
            const int maxScroll=std::max(0,totalRows-visibleRows);
            screen.details.ribbonScroll=std::clamp(screen.details.ribbonScroll,0,maxScroll);
            fb.drawFilledRect(0,0,W,H,Color(0,0,0,170));
            fb.drawFilledRoundedRect(ox,oy,ow,oh,16,Colors::Panel);
            fb.drawRoundedRect(ox,oy,ow,oh,16,Colors::Border,1);
            fb.drawText(ox+24,oy+20,"Ribbons & Marks",Colors::Text,TextStyle::Heading);
            fb.drawText(ox+24,oy+50,"Swipe to scroll",Colors::TextDim,TextStyle::Caption);
            const int colW=(ow-64)/cols;
            fb.setClipRect(ox+20,listTop,ow-40,listBottom-listTop);
            for(int r=0;r<visibleRows;++r){
                const int sourceRow=screen.details.ribbonScroll+r;
                for(int c=0;c<cols;++c){
                    const int idx=sourceRow*cols+c; if(idx>=static_cast<int>(rb.size())) continue;
                    fb.drawText(ox+28+c*colW,listTop+r*rowH,rb[static_cast<size_t>(idx)],Colors::Text,TextStyle::Caption);
                }
            }
            fb.clearClip();
            drawScrollbar(fb,ox+ow-12,listTop,listBottom-listTop,std::max(1,totalRows*rowH),screen.details.ribbonScroll*rowH);
            const int closeW=150,closeH=44,closeX=ox+ow-closeW-22,closeY=oy+oh-closeH-14;
            drawGlyphButton(fb,closeX,closeY,closeW,closeH,"B","Close");
            screen.touchButtons.push_back({196,closeX,closeY,closeW,closeH});
        }
    }
}
}"""
          s,n=re.subn(ribbon_pat,ribbon_repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('ribbon render block moved')
          p.write_text(s)
          PY
          git diff --check
          grep -q 'leftScrollManual' include/UI/TrainerViewScreenBase.h src/UI/TrainerViewScreenBase.inc src/UI/Modals/PokemonDetailsModal.cpp
          grep -q 'legalityScroll' include/UI/TrainerViewScreenBase.h src/UI/TrainerViewScreenBase.inc src/UI/Modals/PokemonDetailsModal.cpp
          ! grep -q 'tap anywhere closes' src/UI/Modals/PokemonDetailsModal.cpp
      - name: Commit runtime files only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include/UI/TrainerViewScreenBase.h src/UI/TrainerViewScreenBase.inc src/UI/Modals/PokemonDetailsModal.cpp
          git diff --cached --quiet && { echo 'No runtime View touch changes'; exit 1; }
          git commit -m 'feat(ui): make View panels natively touch-scrollable'
          git push origin HEAD:feature/touch-controls-20261005

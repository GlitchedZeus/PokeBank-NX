name: RBY one-time details patch

on:
  push:
    branches: [tmp-rby-adapter]
    paths:
      - '.github/workflows/rby-modal-patch.yml'
      - 'tools/patch_rby_details_dispatch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rby-adapter
          fetch-depth: 0
      - name: Apply exact details dispatch patch
        run: python3 tools/patch_rby_details_dispatch.py
      - name: Commit dispatch hook
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'PokeBank NX CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/UI/Modals/PokemonDetailsModal.cpp
          git diff --cached --quiet && exit 0
          git commit -m 'gen1: dispatch Pokemon details to truthful renderer'
          git push origin HEAD:tmp-rby-adapter

name: RBY one-time integration patch

on:
  push:
    branches: [tmp-rby-adapter]
    paths:
      - '.github/workflows/rby-modal-patch.yml'
      - 'tools/patch_rby_details_dispatch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-rby-adapter
          fetch-depth: 0
      - name: Apply exact RBY integration patch
        run: python3 tools/patch_rby_details_dispatch.py
      - name: Commit native source and trainer truthfulness fixes
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'PokeBank NX CI'
          git config user.email 'actions@users.noreply.github.com'
          git add Makefile src/UI/TrainerViewScreen.cpp
          git diff --cached --quiet && exit 0
          git commit -m 'gen1: finish native and trainer view integration'
          git push origin HEAD:tmp-rby-adapter

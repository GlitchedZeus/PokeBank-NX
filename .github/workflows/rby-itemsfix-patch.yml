      - name: Diff safety
        shell: bash
        run: |
          git diff --check
          git status --short
          test -z "$(git diff --name-only | grep -E '^(src/Integration/Gen3|include/Integration/Gen3|src/Legacy/(FRLG|RSE)|include/Legacy/(FRLG|RSE))' || true)"

      - name: Full host suite
        run: make -f Makefile.host host-test


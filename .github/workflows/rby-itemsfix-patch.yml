                  src/Names/ItemNames.cpp src/UI/Panels/ItemsPanel.cpp src/UI/TrainerViewScreen.cpp \
                  tests/test_game_identity.cpp tests/test_rby_inventory.cpp tests/test_rby_readonly_bridge.cpp
          git diff --cached --check

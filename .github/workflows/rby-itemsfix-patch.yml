        run: make -f Makefile.host host-sanitize

      - name: Commit and push exact runtime fix
        shell: bash
        run: |
          git config user.name "GlitchedZeus"
          git config user.email "user91746@protonmail.com"
          git add Makefile.host include/Enums/GameVersion.h include/Games/GameIdentity.h \
                  include/Integration/Gen1/Gen1ReadOnlyInventory.h include/Legacy/RBYReadOnlyTrainer.h \

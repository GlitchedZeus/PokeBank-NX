# L4-owned native evidence verification: PR #292 and the Gen I-V integration branch,
# which carries the L4 lane (#314). Does not modify the shared host workflow,
# production analyzer or other lanes.
name: L4 Event Metadata Exact-Head Verification

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/legality-l4-evidence-matrix.yml
      - tests/test_legality_l4_*
      - tests/fixtures/legality_l4_*
      - include/Legality/Gen14Event*
      - include/Legality/Gen14OriginalCurrentChain*
      - include/Legality/Gen14OriginalSourceRights*
      - include/Legality/Gen14FinalProvenanceGate*
      - include/Legality/Gen56MysteryGiftSource*
      - include/Legality/Gen1OriginalGiftNative*
      - include/Legality/Gen1OriginalNPCTrade*
      - include/Legality/Gen1OriginalIndividual*
      - include/Legality/Gen1NativeRawRecordWitness*
      - include/Legality/Gen12Gift*
      - include/Legality/Gen12OriginalDistribution*
      - include/Legality/Gen3*Event*
      - include/Legality/Gen3Distribution*
      - include/Legality/Gen4*Event*
      - include/Legality/Gen4MysteryGift*
      - include/Legality/Gen4OriginalCardRecipient*
      - include/Legality/Gen4ContestRibbon*
      - tools/legality_l4_*
      - docs/legality/l4/**

permissions:
  contents: read

jobs:
  l4-native-matrix:
    if: github.event.pull_request.number == 292 || startsWith(github.event.pull_request.head.ref, 'claude/gen1-5-legality-')
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        sanitize: ['0', '1']
    name: "L4 ${{ matrix.compiler }} / sanitizer=${{ matrix.sanitize }}"
    steps:
      - name: Checkout exact application SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Confirm source identity and compiler
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
          CXX: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          echo "HEAD=$EXPECTED"
          echo "TREE=$(git rev-parse 'HEAD^{tree}')"
          "$CXX" --version
      - name: Compile and execute all 28 L4 C++ suites and Python audits
        shell: bash
        env:
          L4_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          L4_SANITIZE: ${{ matrix.sanitize }}
          CXX: ${{ matrix.compiler }}
          # The integration branch carries the real L5 Q07/Q08 research files,
          # so the runner's cross-lane event-provenance join (Q07) and rights
          # gate (Q08) run there instead of being skipped. PR #292 (L4 only)
          # has neither file; an empty value keeps them off there.
          L4_L5_Q07_JSON: ${{ startsWith(github.event.pull_request.head.ref, 'claude/gen1-5-legality-') && 'docs/legality/research/l5/Q07_WC4_EVENT_PROVENANCE_JOIN.json' || '' }}
          L4_L5_Q08_JSON: ${{ startsWith(github.event.pull_request.head.ref, 'claude/gen1-5-legality-') && 'docs/legality/research/l5/Q08_REDISTRIBUTION_GATE.json' || '' }}
        run: bash tests/test_legality_l4_runner.sh

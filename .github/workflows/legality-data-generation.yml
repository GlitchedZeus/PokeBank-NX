name: PokeBank NX Legality Data Generation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/legality-engine-gen1-4-20260929
    paths:
      - tools/gen_legality_gen4_wild.py
      - tools/gen_legality_gen34_egg_moves.py
      - tools/pkhex_source.py
      - .github/workflows/legality-data-generation.yml

permissions:
  contents: write

jobs:
  gen4-wild:
    name: Regenerate pinned Gen IV wild legality table
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Python info
        run: python3 --version

      - name: Regenerate from pinned upstream resources
        run: |
          python3 tools/gen_legality_gen4_wild.py
          python3 tools/gen_legality_gen34_egg_moves.py

      - name: Show deterministic diff and digest
        run: |
          set -euo pipefail
          git diff -- include/Legality/Gen4WildEncounterData.inc include/Legality/Gen34EggMoveData.inc
          sha256sum include/Legality/Gen4WildEncounterData.inc
          sha256sum include/Legality/Gen34EggMoveData.inc
          git diff --check

      - name: Upload generated table
        uses: actions/upload-artifact@v4
        with:
          name: legality-generated-evidence
          path: |
            include/Legality/Gen4WildEncounterData.inc
            include/Legality/Gen34EggMoveData.inc
          if-no-files-found: error
          retention-days: 7

      - name: Commit deterministic generated table
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git add include/Legality/Gen4WildEncounterData.inc include/Legality/Gen34EggMoveData.inc
          if git diff --cached --quiet; then
            echo "Generated tables already match the branch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "legality: regenerate pinned encounter and egg-move evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Gen II Semantic Gender Fix

on:
  push:
    branches:
      - dev/gen2-pokemon-editor-20260912

permissions:
  contents: write

jobs:
  fix-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[gen2-semantic-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Preserve exact starting identity
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Apply proven derived-gender normalization and regression
        run: python3 .github/scripts/gen2_semantic_diag.py
      - name: Diff safety
        run: |
          git diff --check
          git diff -- src/Integration/Gen2/Gen2StagedEditor.cpp tests/test_gsc_pokemon_editor.cpp
      - name: Focused boxed Pokemon regression
        run: |
          make -f Makefile.host build-host/test_gsc_pokemon_editor
          ./build-host/test_gsc_pokemon_editor
      - name: Commit only permanent source and regression test
        run: |
          git config user.name 'PokeBank NX CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/Integration/Gen2/Gen2StagedEditor.cpp tests/test_gsc_pokemon_editor.cpp
          git diff --cached --check
          git diff --cached --quiet && { echo 'No semantic fix diff to commit'; exit 0; }
          git commit -m 'gen2: normalize derived gender round trips [gen2-semantic-fixed]'
          git fetch origin dev/gen2-pokemon-editor-20260912
          git rebase origin/dev/gen2-pokemon-editor-20260912
          git push origin HEAD:dev/gen2-pokemon-editor-20260912

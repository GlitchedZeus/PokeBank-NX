name: ONE-TIME repair keyboard and launch hardware regressions (macOS v3)

on:
  push:
    branches:
      - feature/gen4-full-editor-20260928
    paths:
      - '.github/workflows/one-time-hardware-regressions-macos-v3-20261005.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: macos-latest
    steps:
      - name: Checkout guarded staging head
        uses: actions/checkout@v4
        with:
          ref: feature/gen4-full-editor-20260928
          fetch-depth: 0

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "afc70169e4e2679cde82df0509692d785d9dd540"

      - name: Apply guarded editor and launcher repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, sys, textwrap

          # Reuse the already-validated first half of the original repair payload: editor backdrop,
          # keyboard footer/System label, and collision-safe short release matching.
          workflow = Path('.github/workflows/one-time-hardware-regressions-20261005.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          payload = textwrap.dedent('\n'.join(workflow[start:end])) + '\n'
          marker = '# 4) Restore the previously working RetroArch frontend -> core -> ROM chain.'
          if payload.count(marker) != 1:
              raise SystemExit('could not isolate validated editor/identity repair prefix')
          prefix = payload.split(marker, 1)[0]
          Path('/tmp/pokebank-ui-repair.py').write_text(prefix)
          subprocess.check_call([sys.executable, '/tmp/pokebank-ui-repair.py'])

          # Apply launcher changes by FUNCTION CONTEXT so the two similar RetroArch blocks cannot be
          # confused. This preserves the current executable-path hardening while restoring the old
          # known-good frontend -> -L core -> ROM lifecycle.
          p = Path('src/UI/GameLauncher.cpp')
          s = p.read_text()

          def replace_exact(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              s = s.replace(old, new, 1)

          replace_exact(
          '''    result.contentPath = std::move(content);\n    if (kind == GameLaunchProviderKind::RetroArch) {\n        result.corePath = defaultRetroArchCore(gameId);\n        result.launcherPath = result.corePath;\n    } else {\n        result.launcherPath = std::move(launcher);\n    }''',
          '''    result.contentPath = std::move(content);\n    if (kind == GameLaunchProviderKind::RetroArch) {\n        result.corePath = defaultRetroArchCore(gameId);\n        result.launcherPath = std::move(launcher);\n    } else {\n        result.launcherPath = std::move(launcher);\n    }''',
          'directDescriptor RetroArch frontend')

          replace_exact(
          '''    result.contentPath = stored.contentPath;\n    if (kind == GameLaunchProviderKind::RetroArch) {\n        result.corePath = defaultRetroArchCore(gameId);\n        result.launcherPath = result.corePath;\n    } else {\n        result.launcherPath = defaultLauncherPath(kind, gameId, stored.contentPath);\n    }''',
          '''    result.contentPath = stored.contentPath;\n    if (kind == GameLaunchProviderKind::RetroArch) {\n        result.corePath = defaultRetroArchCore(gameId);\n        result.launcherPath = defaultLauncherPath(kind, gameId, stored.contentPath);\n    } else {\n        result.launcherPath = defaultLauncherPath(kind, gameId, stored.contentPath);\n    }''',
          'descriptorFromStored RetroArch frontend')

          replace_exact(
          '''    result.providerId = "retroarch";\n    result.corePath = defaultRetroArchCore(gameId);\n    result.launcherPath = result.corePath;\n\n    if (result.corePath.empty() || !regularFile(result.corePath)) {\n        result.state = GameLaunchState::LauncherMissing;\n        result.detail = "A compatible RetroArch core NRO is not installed.";\n        return result;\n    }''',
          '''    result.providerId = "retroarch";\n    result.launcherPath = defaultLauncherPath(GameLaunchProviderKind::RetroArch, gameId, sourcePath);\n    result.corePath = defaultRetroArchCore(gameId);\n\n    if (result.launcherPath.empty() || !regularFile(result.launcherPath)) {\n        result.state = GameLaunchState::LauncherMissing;\n        result.detail = "The RetroArch frontend NRO is not installed at a known path.";\n        return result;\n    }\n    if (result.corePath.empty() || !regularFile(result.corePath)) {\n        result.state = GameLaunchState::LauncherMissing;\n        result.detail = "A compatible RetroArch core NRO is not installed.";\n        return result;\n    }''',
          'resolveRetroArch initialization')

          replace_exact(
          '''            result.contentPath = std::move(matches.front().content);\n            result.corePath = std::move(matches.front().core);\n            result.launcherPath = result.corePath;\n            result.state = GameLaunchState::Ready;''',
          '''            result.contentPath = std::move(matches.front().content);\n            result.corePath = std::move(matches.front().core);\n            result.state = GameLaunchState::Ready;''',
          'playlist frontend preservation')

          replace_exact(
          '''        } else if (kind == GameLaunchProviderKind::DraStic) {\n            const auto roots = configuredDraSticLibraryRoots();\n            matches = findContentMatches(roots, sourcePath, gameId, 6, 4096);''',
          '''        } else if (kind == GameLaunchProviderKind::DraStic) {\n            const auto roots = configuredDraSticLibraryRoots();\n            // Never synchronously crawl the whole SD card on the ZR input frame.\n            matches = findContentMatches(roots, sourcePath, gameId, 1, 512);''',
          'bounded DraStic scan')

          replace_exact(
          '''    GameLaunchDescriptor result;\n    result.backend = GameLaunchBackend::HomebrewNro;\n    result.providerId = std::string(providerId);\n    result.launcherPath = launcher;\n    result.state = GameLaunchState::NeedsContentLink;\n    result.detail = matches.size() > 1\n        ? "More than one matching game file was found; choose the exact one."\n        : "This save is valid, but its game file is not linked yet.";\n    return result;''',
          '''    GameLaunchDescriptor result;\n    result.backend = GameLaunchBackend::HomebrewNro;\n    result.providerId = std::string(providerId);\n    result.launcherPath = launcher;\n    if (kind == GameLaunchProviderKind::DraStic && matches.empty()) {\n        result.state = GameLaunchState::LauncherOnly;\n        result.detail = "DraStic is ready; no unique ROM path was resolved, so open the emulator directly.";\n        return result;\n    }\n    result.state = GameLaunchState::NeedsContentLink;\n    result.detail = matches.size() > 1\n        ? "More than one matching game file was found; choose the exact one."\n        : "This save is valid, but its game file is not linked yet.";\n    return result;''',
          'DraStic nonblocking fallback')

          replace_exact(
          '''    if (kind == GameLaunchProviderKind::RetroArch) {\n        binding.corePath = defaultRetroArchCore(gameId);\n        binding.launcherPath = binding.corePath;\n        if (binding.corePath.empty() || !regularFile(binding.corePath)) {''',
          '''    if (kind == GameLaunchProviderKind::RetroArch) {\n        binding.corePath = defaultRetroArchCore(gameId);\n        if (binding.corePath.empty() || !regularFile(binding.corePath)) {''',
          'stored RetroArch binding frontend')

          replace_exact(
          '''    if (descriptor.backend == GameLaunchBackend::RetroArch) {\n        if (!envHasNextLoad()) {\n            error = "The current homebrew loader does not support chaining to another NRO.";\n            return false;\n        }\n        const std::string& target = descriptor.corePath.empty()\n            ? descriptor.launcherPath : descriptor.corePath;\n        if (!regularFile(target)) {\n            error = "The RetroArch core NRO for this game is missing.";\n            return false;\n        }\n        if (descriptor.state != GameLaunchState::LauncherOnly &&\n            !regularFile(descriptor.contentPath)) {\n            error = "The linked game ROM is missing.";\n            return false;\n        }\n        std::string argv = quoted(target);\n        if (descriptor.state != GameLaunchState::LauncherOnly &&\n            !descriptor.contentPath.empty())\n            argv += " " + quoted(descriptor.contentPath);\n        const Result rc = envSetNextLoad(target.c_str(), argv.c_str());\n        if (R_FAILED(rc)) {\n            char buf[96];\n            std::snprintf(buf, sizeof(buf), "RetroArch game launch failed (0x%08X).", static_cast<unsigned>(rc));\n            error = buf;\n            return false;\n        }\n        return true;\n    }''',
          '''    if (descriptor.backend == GameLaunchBackend::RetroArch) {\n        if (!envHasNextLoad()) {\n            error = "The current homebrew loader does not support chaining to another NRO.";\n            return false;\n        }\n        if (!regularFile(descriptor.launcherPath)) {\n            error = "The RetroArch frontend NRO is missing.";\n            return false;\n        }\n        if (descriptor.state != GameLaunchState::LauncherOnly &&\n            (descriptor.corePath.empty() || !regularFile(descriptor.corePath))) {\n            error = "The RetroArch core NRO for this game is missing.";\n            return false;\n        }\n        if (descriptor.state != GameLaunchState::LauncherOnly &&\n            !regularFile(descriptor.contentPath)) {\n            error = "The linked game ROM is missing.";\n            return false;\n        }\n        std::string argv = quoted(descriptor.launcherPath);\n        if (descriptor.state != GameLaunchState::LauncherOnly && !descriptor.corePath.empty())\n            argv += " -L " + quoted(descriptor.corePath);\n        if (descriptor.state != GameLaunchState::LauncherOnly && !descriptor.contentPath.empty())\n            argv += " " + quoted(descriptor.contentPath);\n        const Result rc = envSetNextLoad(descriptor.launcherPath.c_str(), argv.c_str());\n        if (R_FAILED(rc)) {\n            char buf[96];\n            std::snprintf(buf, sizeof(buf), "RetroArch game launch failed (0x%08X).", static_cast<unsigned>(rc));\n            error = buf;\n            return false;\n        }\n        return true;\n    }''',
          'RetroArch frontend launch request')

          p.write_text(s)
          PY

          git diff --check
          test "$(grep -c 'keyboardBackdrop = &trainerScreen' src/UI/UI.cpp)" -eq 3
          grep -q 'SystemKeyboard, "System"' src/UI/Dialogs/KeyboardDialog.cpp
          grep -q 'drawNavBar(framebuffer, keyboard.navHint())' src/UI/Dialogs/KeyboardDialog.cpp
          grep -q 'gameId == "red_gb"' include/UI/GameLaunchModel.h
          grep -q 'gameId == "blue_gb"' include/UI/GameLaunchModel.h
          grep -q 'findContentMatches(roots, sourcePath, gameId, 1, 512)' src/UI/GameLauncher.cpp
          grep -q 'argv += " -L "' src/UI/GameLauncher.cpp
          grep -q 'defaultLauncherPath(GameLaunchProviderKind::RetroArch, gameId, sourcePath)' src/UI/GameLauncher.cpp

      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PokeBank NX CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/UI/UI.cpp src/UI/Dialogs/KeyboardDialog.cpp include/UI/GameLaunchModel.h src/UI/GameLauncher.cpp
          git commit -m 'fix(ui): repair keyboard backdrop and launch regressions'
          git push origin HEAD:feature/gen4-full-editor-20260928

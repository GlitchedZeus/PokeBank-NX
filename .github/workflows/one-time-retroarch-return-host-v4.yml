name: ONE-TIME install RetroArch return host v4

on:
  push:
    branches:
      - feature/gen4-full-editor-20260928
    paths:
      - '.github/workflows/one-time-retroarch-return-host-v4.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact MAIN hardware branch
        uses: actions/checkout@v4
        with:
          ref: feature/gen4-full-editor-20260928
          fetch-depth: 6

      - name: Guard forward-only parent
        env:
          EXPECTED_STAGING_PARENT: 6ea6f886ba62e729b9d793399223aa5a787d14af
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_STAGING_PARENT"
          echo "STAGING_SHA=$(git rev-parse HEAD)"
          echo "PARENT_SHA=$(git rev-parse HEAD^)"

      - name: Apply and validate return-host repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_retroarch_return_host_patch.py')
          text = p.read_text(encoding='utf-8')
          old = "'        \"g_nextNroPath[0] == \\\'\\\\0\\\'\" in return_host_source,\\n'"
          new = "'        r\"g_nextNroPath[0] == \\\'\\\\0\\\'\" in return_host_source,\\n'"
          if text.count(old) != 1:
              raise SystemExit(f'expected one contract-escape match, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 tools/apply_retroarch_return_host_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test_game_hub_contract.py')
          text = p.read_text(encoding='utf-8')
          old = '''require("const std::string& target = descriptor.corePath.empty()" in launcher and
                  "envSetNextLoad(target.c_str(), argv.c_str())" in launcher and
                  "result.corePath = defaultRetroArchCore" in launcher and
                  "result.launcherPath = result.corePath;" in launcher and
                  'argv += " -L " + quoted(descriptor.corePath)' not in launcher,
                  "RetroArch games must use the stable direct core + ROM chain without frontend fallback")'''
          new = '''require("const std::string& target = descriptor.corePath.empty()" in launcher and
                  "result.corePath = defaultRetroArchCore" in launcher and
                  "result.launcherPath = result.corePath;" in launcher and
                  'argv += " -L " + quoted(descriptor.corePath)' not in launcher,
                  "RetroArch games must preserve exact direct-core identity without frontend fallback")'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale direct-chain assertion, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          # Product UI workflow mutation is only an extra packaging assertion. Keep the
          # runtime repair independent so the Actions token does not need workflow-write permission.
          git checkout -- .github/workflows/product-ui-native.yml
          git diff --check
          python3 tests/test_game_hub_contract.py

      - name: Commit and push runtime repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile include/UI/GameLauncher.h src/main.cpp src/UI/GameLauncher.cpp \
            runtime/return_host tests/test_game_hub_contract.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(launch): return from RetroArch to PokeBank"
          git push origin HEAD:feature/gen4-full-editor-20260928

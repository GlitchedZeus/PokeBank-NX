name: One-shot launch runtime repair 20261005

on:
  push:
    branches:
      - feature/gen4-full-editor-20260928
    paths:
      - '.github/workflows/one-shot-launch-runtime-repair-20261005.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          submodules: recursive

      - name: Apply guarded runtime repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/one_shot_launch_runtime_repair_20261005.py')
          text = p.read_text(encoding='utf-8')
          old = 'require("retroArchContentExists" in source and "archive#member" not in source,\\n        "RetroArch launch path must validate archive-member content through its physical archive")'
          new = 'require("retroArchContentExists" in source and "retroArchPhysicalContentPath" in source,\\n        "RetroArch launch path must validate archive-member content through its physical archive")'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale archive contract, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 tools/one_shot_launch_runtime_repair_20261005.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test_game_hub_contract.py')
          text = p.read_text(encoding='utf-8')
          source_line = 'source = (ROOT / "src/UI/SaveSelectScreen.cpp").read_text(encoding="utf-8")\n'
          launcher_line = 'launcher_source = (ROOT / "src/UI/GameLauncher.cpp").read_text(encoding="utf-8")\n'
          if launcher_line not in text:
              if text.count(source_line) != 1:
                  raise SystemExit('missing SaveSelect source anchor')
              text = text.replace(source_line, source_line + launcher_line, 1)
          old_scan = 'require("installedGameForwarderTitle(gameId)" not in source[source.find("if (kind == GameLaunchProviderKind::RetroArch)"):source.find("if (kind == GameLaunchProviderKind::MGBA")],'
          new_scan = 'require("installedGameForwarderTitle(gameId)" not in launcher_source[launcher_source.find("if (kind == GameLaunchProviderKind::RetroArch)"):launcher_source.find("if (kind == GameLaunchProviderKind::MGBA")],'
          if text.count(old_scan) != 1:
              raise SystemExit(f'expected one RetroArch scan assertion, found {text.count(old_scan)}')
          text = text.replace(old_scan, new_scan, 1)
          old_archive = 'require("retroArchContentExists" in source and "retroArchPhysicalContentPath" in source,'
          new_archive = 'require("retroArchContentExists" in launcher_source and "retroArchPhysicalContentPath" in launcher_source,'
          if text.count(old_archive) != 1:
              raise SystemExit(f'expected one archive assertion, found {text.count(old_archive)}')
          text = text.replace(old_archive, new_archive, 1)
          old_lifecycle = '''require('argv += " -L " + quoted(descriptor.corePath)' in launcher and
        "envSetNextLoad(descriptor.launcherPath.c_str(), argv.c_str())" in launcher and
        "result.launcherPath = defaultLauncherPath" in launcher and
        "result.corePath = defaultRetroArchCore" in launcher and
        "result.launcherPath = result.corePath;" not in launcher,
        "RetroArch games must chain through the frontend with -L core and the ROM argument")'''
          new_lifecycle = '''require("const std::string& target = descriptor.corePath.empty()" in launcher and
        "envSetNextLoad(target.c_str(), argv.c_str())" in launcher and
        "result.corePath = defaultRetroArchCore" in launcher and
        "result.launcherPath = result.corePath;" in launcher and
        'argv += " -L " + quoted(descriptor.corePath)' not in launcher,
        "RetroArch games must use the stable direct core + ROM chain without frontend fallback")'''
          if text.count(old_lifecycle) != 1:
              raise SystemExit(f'expected one stale RetroArch lifecycle contract, found {text.count(old_lifecycle)}')
          text = text.replace(old_lifecycle, new_lifecycle, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Focused launch tests
        run: |
          set -euo pipefail
          make -f Makefile.host build-host/test_game_launch_model
          ./build-host/test_game_launch_model
          python3 tests/test_game_hub_contract.py

      - name: Commit only repaired source and tests
        run: |
          set -euo pipefail
          rm -f tools/one_shot_launch_runtime_repair_20261005.py
          rm -f .github/workflows/one-shot-launch-runtime-repair-20261005.yml
          git diff --check
          git config user.name 'GlitchedZeus'
          git config user.email 'user91746@protonmail.com'
          git add -A
          git commit -m 'fix(ui): restore stable emulator launch paths'
          git push origin HEAD:feature/gen4-full-editor-20260928

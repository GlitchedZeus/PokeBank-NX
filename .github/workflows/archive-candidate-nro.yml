name: Archive candidate NRO (development/testing archive)

# Copies an already-built candidate NRO out of its expiring Actions artifact into a GitHub
# pre-release tagged nro/<sha8> on the exact application commit (docs/hardware/NRO_ARCHIVE.md).
#
# * Never rebuilds: it downloads the original artifact from its own run, after checking with
#   GitHub's own records that the artifact ID, name and run belong together and that the run built
#   the stated commit.
# * Requires the NRO's SHA-256 (and BUILD_IDENTITY.txt, when present) to match the inputs.
# * Refuses to overwrite an existing release or tag.
# * After publishing, downloads the release asset again and requires the same SHA-256.
# * Every archive is labelled a DEVELOPMENT / TESTING ARCHIVE: a pre-release, never "latest",
#   never an approved release. Its hardware status is the one the owner recorded.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run that built the candidate (numeric)'
        required: true
      artifact_id:
        description: 'Actions artifact ID of the candidate (numeric)'
        required: true
      artifact_name:
        description: 'Artifact name, e.g. PokeBank-NX-Gen1-5-Candidate-3634d1e6'
        required: true
      nro_file:
        description: 'NRO file inside the artifact'
        required: true
      code_sha:
        description: 'Full 40-character application commit the NRO was built from'
        required: true
      nro_sha256:
        description: 'Original SHA-256 of the NRO (64 hex characters)'
        required: true
      label:
        description: 'Short label, e.g. "Round 10 candidate"'
        required: true
      hardware_status:
        description: 'Recorded hardware status, e.g. "NOT DEVICE TESTED" or "owner-tested 49 PASS / 9 FAIL / 1 NOT TESTED"'
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: archive-nro-${{ inputs.code_sha }}
  cancel-in-progress: false

jobs:
  archive:
    name: Preserve one candidate NRO
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ inputs.run_id }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      NRO_FILE: ${{ inputs.nro_file }}
      CODE_SHA: ${{ inputs.code_sha }}
      NRO_SHA256: ${{ inputs.nro_sha256 }}
      LABEL: ${{ inputs.label }}
      HARDWARE_STATUS: ${{ inputs.hardware_status }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::run_id must be numeric"; exit 1; }
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo "::error::artifact_id must be numeric"; exit 1; }
          [[ "$CODE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::code_sha must be 40 hex characters"; exit 1; }
          [[ "$NRO_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::nro_sha256 must be 64 hex characters"; exit 1; }
          [[ "$ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::unexpected artifact name"; exit 1; }
          [[ "$NRO_FILE" =~ ^[A-Za-z0-9._-]+\.nro$ ]] || { echo "::error::unexpected NRO file name"; exit 1; }
          [[ "$LABEL" =~ ^[A-Za-z0-9\ ._()/:-]+$ ]] || { echo "::error::label may use letters, digits, spaces and ._()/:- only"; exit 1; }
          [[ "$HARDWARE_STATUS" =~ ^[A-Za-z0-9\ ._()/:-]+$ ]] || { echo "::error::hardware_status may use letters, digits, spaces and ._()/:- only"; exit 1; }
          echo "TAG=nro/${CODE_SHA:0:8}" >> "$GITHUB_ENV"

      - name: Bind run, artifact and commit to GitHub's own records
        run: |
          set -euo pipefail
          run_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)"
          test "$run_sha" = "$CODE_SHA" || { echo "::error::run $RUN_ID built $run_sha, not $CODE_SHA"; exit 1; }
          art="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          test "$(jq -r .name <<<"$art")" = "$ARTIFACT_NAME" || { echo "::error::artifact $ARTIFACT_ID is not $ARTIFACT_NAME"; exit 1; }
          test "$(jq -r .workflow_run.id <<<"$art")" = "$RUN_ID" || { echo "::error::artifact $ARTIFACT_ID is not from run $RUN_ID"; exit 1; }
          test "$(jq -r .expired <<<"$art")" = "false" || { echo "::error::artifact $ARTIFACT_ID has expired"; exit 1; }

      - name: Refuse to overwrite an existing release or tag (fail closed)
        run: |
          set -euo pipefail
          # Only an explicit HTTP 404 means "absent". Any other failure (5xx, rate limit, auth) stops the
          # archive rather than risking a release on an existing tag.
          absent() {  # $1 = API path
            local out
            if out="$(gh api "$1" 2>&1)"; then return 1; fi
            grep -q 'HTTP 404' <<<"$out" || { echo "::error::cannot confirm that $1 is absent: $out"; exit 1; }
          }
          absent "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" || { echo "::error::release $TAG already exists; nothing was changed"; exit 1; }
          absent "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" || { echo "::error::tag $TAG already exists; nothing was changed"; exit 1; }

      - name: Download the original artifact from its own run (no rebuild)
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: artifact

      - name: Verify the NRO bytes and build identity
        run: |
          set -euo pipefail
          dir="artifact/$ARTIFACT_NAME"; [ -d "$dir" ] || dir=artifact
          test -f "$dir/$NRO_FILE" || { echo "::error::$NRO_FILE not in the artifact"; ls -laR artifact; exit 1; }
          actual="$(sha256sum "$dir/$NRO_FILE" | cut -d' ' -f1)"
          test "$actual" = "$NRO_SHA256" || { echo "::error::SHA-256 $actual does not match $NRO_SHA256"; exit 1; }
          if [ -f "$dir/BUILD_IDENTITY.txt" ]; then
            grep -qx "APPLICATION_SHA=$CODE_SHA" "$dir/BUILD_IDENTITY.txt" \
              || { echo "::error::BUILD_IDENTITY.txt names a different application commit"; cat "$dir/BUILD_IDENTITY.txt"; exit 1; }
            if grep -q '^SHA256=' "$dir/BUILD_IDENTITY.txt"; then
              grep -qx "SHA256=$NRO_SHA256" "$dir/BUILD_IDENTITY.txt" \
                || { echo "::error::BUILD_IDENTITY.txt names a different SHA-256"; exit 1; }
            fi
          fi
          mkdir upload
          cp "$dir/$NRO_FILE" upload/
          (cd upload && sha256sum "$NRO_FILE" > "$NRO_FILE.sha256")
          [ -f "$dir/BUILD_IDENTITY.txt" ] && cp "$dir/BUILD_IDENTITY.txt" "upload/BUILD_IDENTITY-${CODE_SHA:0:8}.txt"
          echo "SIZE=$(stat -c %s "$dir/$NRO_FILE")" >> "$GITHUB_ENV"

      - name: Publish the development/testing archive (pre-release)
        run: |
          set -euo pipefail
          {
            echo "**DEVELOPMENT / TESTING ARCHIVE. This is not an approved release.**"
            echo
            echo "A preserved copy of an existing candidate build ($LABEL): the original GitHub Actions artifact,"
            echo "byte for byte (no rebuild), kept here because Actions artifacts expire."
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| NRO | \`$NRO_FILE\` |"
            echo "| Original SHA-256 | \`$NRO_SHA256\` |"
            echo "| Size | $SIZE bytes |"
            echo "| Source commit | \`$CODE_SHA\` |"
            echo "| Build run | https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID |"
            echo "| Original artifact | \`$ARTIFACT_NAME\` (ID \`$ARTIFACT_ID\`) |"
            echo "| Hardware status | $HARDWARE_STATUS |"
            echo
            echo "Check the SHA-256 before use. Back up your saves; development builds can contain defects."
          } > notes.md
          gh release create "$TAG" upload/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$CODE_SHA" \
            --prerelease --latest=false \
            --title "Development archive ${CODE_SHA:0:8}: $LABEL (not a release)" \
            --notes-file notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Download the published asset and verify it independently
        run: |
          set -euo pipefail
          mkdir verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$NRO_FILE" --dir verify
          again="$(sha256sum "verify/$NRO_FILE" | cut -d' ' -f1)"
          test "$again" = "$NRO_SHA256" || { echo "::error::published asset SHA-256 $again does not match $NRO_SHA256"; exit 1; }
          echo "| Published asset re-downloaded | SHA-256 \`$again\` matches the original |" >> "$GITHUB_STEP_SUMMARY"
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
          test "$tagged" = "$CODE_SHA" || { echo "::error::tag $TAG points at $tagged, not $CODE_SHA"; exit 1; }
          echo "| Release tag | \`$TAG\` points at \`$CODE_SHA\` |" >> "$GITHUB_STEP_SUMMARY"

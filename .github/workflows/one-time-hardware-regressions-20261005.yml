name: ONE-TIME repair keyboard and launch hardware regressions

on:
  push:
    branches:
      - feature/gen4-full-editor-20260928
    paths:
      - '.github/workflows/one-time-hardware-regressions-20261005.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live branch
        uses: actions/checkout@v4
        with:
          ref: feature/gen4-full-editor-20260928
          fetch-depth: 0

      - name: Verify guarded parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1f8e6b2fcf3441307baeadc0f6162eb48328a45c"

      - name: Apply hardware regression repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}: {old[:80]!r}")
              s = s.replace(old, new, count)
              p.write_text(s)

          # 1) The keyboard must redraw the editor that opened it, not stale Product Home.
          ui = Path('src/UI/UI.cpp')
          s = ui.read_text()
          old = '''            while (appletMainLoop() && !trainerScreen.shouldExit() && !trainerScreen.hasRequestedExit()) {\n                padUpdate(&pad);\n                touch.update();\n                keyboardBackdrop = &trainerScreen;\n                trainerScreen.update(pad, touch);\n                if (trainerScreen.shouldExit() || trainerScreen.hasRequestedExit()) break;\n                trainerScreen.draw(fb);\n                fb.drawFadeOverlay();\n                fb.flush();\n            }\n\n            if (trainerScreen.hasRequestedExit()) running = false;'''
          new = '''            while (appletMainLoop() && !trainerScreen.shouldExit() && !trainerScreen.hasRequestedExit()) {\n                padUpdate(&pad);\n                touch.update();\n                keyboardBackdrop = &trainerScreen;\n                trainerScreen.update(pad, touch);\n                if (trainerScreen.shouldExit() || trainerScreen.hasRequestedExit()) break;\n                trainerScreen.draw(fb);\n                fb.drawFadeOverlay();\n                fb.flush();\n            }\n            keyboardBackdrop = nullptr;\n\n            if (trainerScreen.hasRequestedExit()) running = false;'''
          if s.count(old) != 1:
              raise SystemExit('native trainer backdrop block changed')
          s = s.replace(old, new, 1)

          legacy_old = '''        while (appletMainLoop() && !trainerScreen.shouldExit() &&\n               !trainerScreen.hasRequestedExit()) {\n            padUpdate(&pad);\n            touch.update();\n            trainerScreen.update(pad, touch);\n            if (trainerScreen.shouldExit() || trainerScreen.hasRequestedExit()) break;\n            trainerScreen.draw(fb);\n            fb.drawFadeOverlay();\n            fb.flush();\n        }\n        if (trainerScreen.hasRequestedExit()) running = false;'''
          legacy_new = '''        while (appletMainLoop() && !trainerScreen.shouldExit() &&\n               !trainerScreen.hasRequestedExit()) {\n            padUpdate(&pad);\n            touch.update();\n            keyboardBackdrop = &trainerScreen;\n            trainerScreen.update(pad, touch);\n            if (trainerScreen.shouldExit() || trainerScreen.hasRequestedExit()) break;\n            trainerScreen.draw(fb);\n            fb.drawFadeOverlay();\n            fb.flush();\n        }\n        keyboardBackdrop = nullptr;\n        if (trainerScreen.hasRequestedExit()) running = false;'''
          if s.count(legacy_old) != 2:
              raise SystemExit(f'expected 2 legacy/gen4 trainer loops, found {s.count(legacy_old)}')
          s = s.replace(legacy_old, legacy_new, 2)
          ui.write_text(s)

          # 2) Keyboard owns the footer while open; replace the tofu CJK handoff label with a clear action.
          kd = Path('src/UI/Dialogs/KeyboardDialog.cpp')
          s = kd.read_text()
          old = '                addKey(plans, bottomRow, KeyboardKeyAction::SystemKeyboard, "あ漢한", 3);'
          if s.count(old) != 1:
              raise SystemExit('system keyboard key label changed')
          s = s.replace(old, '                addKey(plans, bottomRow, KeyboardKeyAction::SystemKeyboard, "System", 3);', 1)
          old = '''            for (int keyIndex = 0; keyIndex < static_cast<int>(keyboard.keys.size()); ++keyIndex)\n                drawKey(keyboard, framebuffer, keyIndex);\n        }'''
          new = '''            for (int keyIndex = 0; keyIndex < static_cast<int>(keyboard.keys.size()); ++keyIndex)\n                drawKey(keyboard, framebuffer, keyIndex);\n            // The prompt owns input while it is open, so it must also own the controller footer.\n            // Drawing this last replaces the background screen's stale hints and touch targets.\n            drawNavBar(framebuffer, keyboard.navHint());\n        }'''
          if s.count(old) != 1:
              raise SystemExit('keyboard draw tail changed')
          s = s.replace(old, new, 1)
          kd.write_text(s)

          # 3) Red/Blue/other short release names need a collision-safe identity fallback.
          glm = Path('include/UI/GameLaunchModel.h')
          s = glm.read_text()
          old = '''    // Exact game identity is a second bounded hint when save and ROM basenames differ completely.\n    // Strip the platform suffix and punctuation (platinum_nds -> platinum). Short names like red/gold\n    // are deliberately ignored to avoid accidental FireRed/HeartGold matches.\n    const size_t underscore = gameId.find('_');\n    const std::string_view identity = gameId.substr(0, underscore);\n    std::string compact;\n    compact.reserve(identity.size());\n    for (unsigned char c : identity)\n        if (std::isalnum(c)) compact.push_back(static_cast<char>(std::tolower(c)));\n    return compact.size() >= 5 && candidate.find(compact) != std::string::npos;'''
          new = '''    // Release-specific official-name prefixes make short identities safe too.\n    // "pokemonred..." cannot collide with "pokemonfirered..."; likewise Gold/HeartGold and\n    // Diamond/Brilliant Diamond remain distinct. Region/revision tags may follow the prefix.\n    auto officialRelease = [&](std::string_view token) {\n        const std::string plain(token);\n        const std::string pokemon = "pokemon" + plain;\n        return candidate == plain ||\n               candidate.rfind(plain + "version", 0) == 0 ||\n               candidate.rfind(pokemon, 0) == 0;\n    };\n    if (gameId == "red_gb") return officialRelease("red");\n    if (gameId == "blue_gb") return officialRelease("blue");\n    if (gameId == "yellow_gb") return officialRelease("yellow");\n    if (gameId == "gold_gbc") return officialRelease("gold");\n    if (gameId == "silver_gbc") return officialRelease("silver");\n    if (gameId == "crystal_gbc") return officialRelease("crystal");\n    if (gameId == "ruby_gba") return officialRelease("ruby");\n    if (gameId == "sapphire_gba") return officialRelease("sapphire");\n    if (gameId == "firered_gba") return officialRelease("firered");\n    if (gameId == "leafgreen_gba") return officialRelease("leafgreen");\n    if (gameId == "emerald_gba") return officialRelease("emerald");\n    if (gameId == "diamond_nds") return officialRelease("diamond");\n    if (gameId == "pearl_nds") return officialRelease("pearl");\n    if (gameId == "platinum_nds") return officialRelease("platinum");\n    if (gameId == "heartgold_nds") return officialRelease("heartgold");\n    if (gameId == "soulsilver_nds") return officialRelease("soulsilver");\n\n    const size_t underscore = gameId.find('_');\n    const std::string_view identity = gameId.substr(0, underscore);\n    std::string compact;\n    compact.reserve(identity.size());\n    for (unsigned char c : identity)\n        if (std::isalnum(c)) compact.push_back(static_cast<char>(std::tolower(c)));\n    return compact.size() >= 5 && candidate.find(compact) != std::string::npos;'''
          if s.count(old) != 1:
              raise SystemExit('candidate matcher block changed')
          s = s.replace(old, new, 1)
          glm.write_text(s)

          # 4) Restore the previously working RetroArch frontend -> core -> ROM chain.
          gl = Path('src/UI/GameLauncher.cpp')
          s = gl.read_text()
          old = '''    if (kind == GameLaunchProviderKind::RetroArch) {\n        result.corePath = defaultRetroArchCore(gameId);\n        result.launcherPath = result.corePath;\n    } else {'''
          new = '''    if (kind == GameLaunchProviderKind::RetroArch) {\n        result.corePath = defaultRetroArchCore(gameId);\n        result.launcherPath = defaultLauncherPath(kind, gameId, stored.contentPath);\n    } else {'''
          if s.count(old) != 1:
              raise SystemExit('stored RetroArch descriptor block changed')
          s = s.replace(old, new, 1)

          old = '''    result.corePath = defaultRetroArchCore(gameId);\n    result.launcherPath = result.corePath;\n\n    if (result.corePath.empty() || !regularFile(result.corePath)) {\n        result.state = GameLaunchState::LauncherMissing;\n        result.detail = "A compatible RetroArch core NRO is not installed.";\n        return result;\n    }'''
          new = '''    result.launcherPath = defaultLauncherPath(GameLaunchProviderKind::RetroArch, gameId, sourcePath);\n    result.corePath = defaultRetroArchCore(gameId);\n\n    if (result.launcherPath.empty() || !regularFile(result.launcherPath)) {\n        result.state = GameLaunchState::LauncherMissing;\n        result.detail = "The RetroArch frontend NRO is not installed at a known path.";\n        return result;\n    }\n    if (result.corePath.empty() || !regularFile(result.corePath)) {\n        result.state = GameLaunchState::LauncherMissing;\n        result.detail = "A compatible RetroArch core NRO is not installed.";\n        return result;\n    }'''
          if s.count(old) != 1:
              raise SystemExit('resolveRetroArch initialization changed')
          s = s.replace(old, new, 1)

          old = '''            result.corePath = std::move(matches.front().core);\n            result.launcherPath = result.corePath;\n            result.state = GameLaunchState::Ready;'''
          new = '''            result.corePath = std::move(matches.front().core);\n            result.state = GameLaunchState::Ready;'''
          if s.count(old) != 1:
              raise SystemExit('playlist RetroArch launcher overwrite changed')
          s = s.replace(old, new, 1)

          old = '''    if (kind == GameLaunchProviderKind::RetroArch) {\n        result.corePath = defaultRetroArchCore(gameId);\n        result.launcherPath = result.corePath;\n    } else {'''
          new = '''    if (kind == GameLaunchProviderKind::RetroArch) {\n        result.corePath = defaultRetroArchCore(gameId);\n        result.launcherPath = defaultLauncherPath(kind, gameId, result.contentPath);\n    } else {'''
          if s.count(old) != 1:
              raise SystemExit('direct RetroArch descriptor block changed')
          s = s.replace(old, new, 1)

          # 5) DraStic direct resolution must never recursively crawl thousands of files on ZR.
          old = '''        } else if (kind == GameLaunchProviderKind::DraStic) {\n            const auto roots = configuredDraSticLibraryRoots();\n            matches = findContentMatches(roots, sourcePath, gameId, 6, 4096);'''
          new = '''        } else if (kind == GameLaunchProviderKind::DraStic) {\n            const auto roots = configuredDraSticLibraryRoots();\n            // Explicit launch stays responsive: normal DraStic libraries are checked only at the\n            // root and one child directory, with a small deterministic file budget.\n            matches = findContentMatches(roots, sourcePath, gameId, 1, 512);'''
          if s.count(old) != 1:
              raise SystemExit('DraStic scan block changed')
          s = s.replace(old, new, 1)

          old = '''    GameLaunchDescriptor result;\n    result.backend = GameLaunchBackend::HomebrewNro;\n    result.providerId = std::string(providerId);\n    result.launcherPath = launcher;\n    result.state = GameLaunchState::NeedsContentLink;\n    result.detail = matches.size() > 1\n        ? "More than one matching game file was found; choose the exact one."\n        : "This save is valid, but its game file is not linked yet.";\n    return result;'''
          new = '''    GameLaunchDescriptor result;\n    result.backend = GameLaunchBackend::HomebrewNro;\n    result.providerId = std::string(providerId);\n    result.launcherPath = launcher;\n    if (kind == GameLaunchProviderKind::DraStic && matches.empty()) {\n        // Preserve the old known-good behavior instead of freezing or forcing a manual link.\n        // When a unique ROM is found above we direct-boot it; otherwise DraStic itself opens.\n        result.state = GameLaunchState::LauncherOnly;\n        result.detail = "DraStic is ready; no unique ROM path was resolved, so open the emulator directly.";\n        return result;\n    }\n    result.state = GameLaunchState::NeedsContentLink;\n    result.detail = matches.size() > 1\n        ? "More than one matching game file was found; choose the exact one."\n        : "This save is valid, but its game file is not linked yet.";\n    return result;'''
          if s.count(old) != 1:
              raise SystemExit('known homebrew fallback block changed')
          s = s.replace(old, new, 1)

          old = '''    if (descriptor.backend == GameLaunchBackend::RetroArch) {\n        if (!envHasNextLoad()) {\n            error = "The current homebrew loader does not support chaining to another NRO.";\n            return false;\n        }\n        const std::string& target = descriptor.corePath.empty()\n            ? descriptor.launcherPath : descriptor.corePath;\n        if (!regularFile(target)) {\n            error = "The RetroArch core NRO for this game is missing.";\n            return false;\n        }\n        if (descriptor.state != GameLaunchState::LauncherOnly &&\n            !regularFile(descriptor.contentPath)) {\n            error = "The linked game ROM is missing.";\n            return false;\n        }\n        std::string argv = quoted(target);\n        if (descriptor.state != GameLaunchState::LauncherOnly &&\n            !descriptor.contentPath.empty())\n            argv += " " + quoted(descriptor.contentPath);\n        const Result rc = envSetNextLoad(target.c_str(), argv.c_str());\n        if (R_FAILED(rc)) {\n            char buf[96];\n            std::snprintf(buf, sizeof(buf), "RetroArch game launch failed (0x%08X).", static_cast<unsigned>(rc));\n            error = buf;\n            return false;\n        }\n        return true;\n    }'''
          new = '''    if (descriptor.backend == GameLaunchBackend::RetroArch) {\n        if (!envHasNextLoad()) {\n            error = "The current homebrew loader does not support chaining to another NRO.";\n            return false;\n        }\n        if (!regularFile(descriptor.launcherPath)) {\n            error = "The RetroArch frontend NRO is missing.";\n            return false;\n        }\n        if (descriptor.state != GameLaunchState::LauncherOnly &&\n            (descriptor.corePath.empty() || !regularFile(descriptor.corePath))) {\n            error = "The RetroArch core NRO for this game is missing.";\n            return false;\n        }\n        if (descriptor.state != GameLaunchState::LauncherOnly &&\n            !regularFile(descriptor.contentPath)) {\n            error = "The linked game ROM is missing.";\n            return false;\n        }\n        std::string argv = quoted(descriptor.launcherPath);\n        if (descriptor.state != GameLaunchState::LauncherOnly && !descriptor.corePath.empty())\n            argv += " -L " + quoted(descriptor.corePath);\n        if (descriptor.state != GameLaunchState::LauncherOnly && !descriptor.contentPath.empty())\n            argv += " " + quoted(descriptor.contentPath);\n        const Result rc = envSetNextLoad(descriptor.launcherPath.c_str(), argv.c_str());\n        if (R_FAILED(rc)) {\n            char buf[96];\n            std::snprintf(buf, sizeof(buf), "RetroArch game launch failed (0x%08X).", static_cast<unsigned>(rc));\n            error = buf;\n            return false;\n        }\n        return true;\n    }'''
          if s.count(old) != 1:
              raise SystemExit('RetroArch request block changed')
          s = s.replace(old, new, 1)
          gl.write_text(s)
          PY

          git diff --check
          grep -q 'keyboardBackdrop = &trainerScreen' src/UI/UI.cpp
          test "$(grep -c 'keyboardBackdrop = &trainerScreen' src/UI/UI.cpp)" -eq 3
          grep -q 'SystemKeyboard, "System"' src/UI/Dialogs/KeyboardDialog.cpp
          grep -q 'drawNavBar(framebuffer, keyboard.navHint())' src/UI/Dialogs/KeyboardDialog.cpp
          grep -q 'gameId == "red_gb"' include/UI/GameLaunchModel.h
          grep -q 'gameId == "blue_gb"' include/UI/GameLaunchModel.h
          grep -q 'findContentMatches(roots, sourcePath, gameId, 1, 512)' src/UI/GameLauncher.cpp
          grep -q ' -L ' src/UI/GameLauncher.cpp

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PokeBank NX CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/UI/UI.cpp src/UI/Dialogs/KeyboardDialog.cpp include/UI/GameLaunchModel.h src/UI/GameLauncher.cpp
          git commit -m 'fix(ui): repair keyboard backdrop and launch regressions'
          git push origin HEAD:feature/gen4-full-editor-20260928

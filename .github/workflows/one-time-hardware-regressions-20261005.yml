name: ONE-TIME apply proper direct touchscreen targets

on:
  push:
    branches:
      - feature/touch-controls-20261005
    paths:
      - '.github/workflows/one-time-hardware-regressions-20261005.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout touch lane
        uses: actions/checkout@v4
        with:
          ref: feature/touch-controls-20261005
          fetch-depth: 0

      - name: Guard branch state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9dc914d8bc54559f897493200bfe6818305abc4c"

      - name: Wire direct touch targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}: {old[:120]!r}")
              p.write_text(s.replace(old, new, count))

          replace_exact('include/UI/SaveSelectScreen.h',
              '''        std::vector<HitRect> dockRects;\n        std::vector<HitRect> headerRects;''',
              '''        std::vector<HitRect> dockRects;\n        std::vector<HitRect> headerRects;\n        std::vector<HitRect> actionRects;   // Product Home OPEN / Launch / feature cards\n        std::vector<HitRect> overlayRects;  // currently visible modal/list/grid rows''')

          replace_exact('src/UI/SaveSelectScreen.cpp',
              '''        dockRects.clear();\n        headerRects.clear();\n\n        const UserEntry* u = currentUser();''',
              '''        dockRects.clear();\n        headerRects.clear();\n        actionRects.clear();\n        overlayRects.clear();\n\n        const UserEntry* u = currentUser();''')

          replace_exact('src/UI/SaveSelectScreen.cpp',
              '''            drawFocusedCard(fb, x, y, CLASSIC_TILE_W, CLASSIC_TILE_H, focused, 16);\n            if (titleFavorite(*u, title))''',
              '''            drawFocusedCard(fb, x, y, CLASSIC_TILE_W, CLASSIC_TILE_H, focused, 16);\n            titleRects.push_back({x, y, CLASSIC_TILE_W, CLASSIC_TILE_H, i});\n            if (titleFavorite(*u, title))''')

          replace_exact('src/UI/SaveSelectScreen.cpp',
              '''            drawGlyphButton(fb, DETAIL_X + 366, buttonY, 332, 58, "ZR", launchLabel,\n                            launchActionable ? Colors::Info : Colors::PanelAlt,\n                            launchActionable ? Colors::White : Colors::TextMuted);''',
              '''            drawGlyphButton(fb, DETAIL_X + 366, buttonY, 332, 58, "ZR", launchLabel,\n                            launchActionable ? Colors::Info : Colors::PanelAlt,\n                            launchActionable ? Colors::White : Colors::TextMuted);\n            actionRects.push_back({DETAIL_X + 22, buttonY, 322, 58, 0});\n            actionRects.push_back({DETAIL_X + 366, buttonY, 332, 58, 1});''')

          replace_exact('src/UI/SaveSelectScreen.cpp',
              '''        drawFocusedCard(fb, vaultX, vaultY, featureW, featureH, vaultFocused, 18);\n        drawFocusedCard(fb, dexX, dexY, featureW, featureH, dexFocused, 18);''',
              '''        drawFocusedCard(fb, vaultX, vaultY, featureW, featureH, vaultFocused, 18);\n        drawFocusedCard(fb, dexX, dexY, featureW, featureH, dexFocused, 18);\n        actionRects.push_back({vaultX, vaultY, featureW, featureH, 10});\n        actionRects.push_back({dexX, dexY, featureW, featureH, 11});''')

          replace_exact('src/UI/SaveSelectScreen.cpp',
              '''                    drawFocusedCard(fb, bx, by, tileW, tileH, selected, 14);\n                    if (titleFavorite(*u, title))''',
              '''                    drawFocusedCard(fb, bx, by, tileW, tileH, selected, 14);\n                    overlayRects.push_back({bx, by, tileW, tileH, i});\n                    if (titleFavorite(*u, title))''')

          replace_exact('src/UI/SaveSelectScreen.cpp',
              '''                drawFocusedCard(fb, x + 24, rowY, w - 48, rowH - 8, selected, 14);\n\n                const IconImage* avatar =''',
              '''                drawFocusedCard(fb, x + 24, rowY, w - 48, rowH - 8, selected, 14);\n                overlayRects.push_back({x + 24, rowY, w - 48, rowH - 8, i});\n\n                const IconImage* avatar =''')

          replace_exact('src/UI/SaveSelectScreen.cpp',
              '''                drawFocusedCard(fb, cx, cy, cardW, cardH, focused, 14);\n                fb.drawText(cx + 20, cy + 14, labels[i],''',
              '''                drawFocusedCard(fb, cx, cy, cardW, cardH, focused, 14);\n                overlayRects.push_back({cx, cy, cardW, cardH, i});\n                fb.drawText(cx + 20, cy + 14, labels[i],''')

          replace_exact('src/UI/SaveSelectScreen.cpp',
              '''                drawFocusedCard(fb, x + 24, rowY, w - 48, rowH - 6, selected, 10);\n                fb.drawText(x + 44, rowY + 13,''',
              '''                drawFocusedCard(fb, x + 24, rowY, w - 48, rowH - 6, selected, 10);\n                overlayRects.push_back({x + 24, rowY, w - 48, rowH - 6, i});\n                fb.drawText(x + 44, rowY + 13,''')

          replace_exact('src/UI/SaveSelectScreen.cpp',
              '''            drawSaveInstanceRows(fb, parent.legacyInstances, legacyInstanceIndex, first,\n                                 x, y + 122, w, rowH, LEGACY_INSTANCE_VISIBLE_ROWS, true);\n            if (!legacyNotice.empty())''',
              '''            drawSaveInstanceRows(fb, parent.legacyInstances, legacyInstanceIndex, first,\n                                 x, y + 122, w, rowH, LEGACY_INSTANCE_VISIBLE_ROWS, true);\n            for (int i = first; i < std::min<int>(static_cast<int>(parent.legacyInstances.size()),\n                                                  first + LEGACY_INSTANCE_VISIBLE_ROWS); ++i)\n                overlayRects.push_back({x + 24, y + 122 + (i - first) * rowH,\n                                        w - 48, rowH - 6, i});\n            if (!legacyNotice.empty())''')

          replace_exact('src/UI/SaveSelectScreen.cpp',
              '''                drawFocusedCard(fb, x + 24, rowY, w - 48, rowH - 6,\n                                index == legacyAssignmentIndex, 10);\n                fb.drawText(x + 44, rowY + 7,''',
              '''                drawFocusedCard(fb, x + 24, rowY, w - 48, rowH - 6,\n                                index == legacyAssignmentIndex, 10);\n                overlayRects.push_back({x + 24, rowY, w - 48, rowH - 6, index});\n                fb.drawText(x + 44, rowY + 7,''')

          replace_exact('src/UI/SaveSelectScreen.cpp',
              '''                drawFocusedCard(fb, x + 24, ry, w - 48, rowH - 8, i == gen4SetupIndex, 10);\n                fb.drawText(x + 44, ry + 15, rows[i],''',
              '''                drawFocusedCard(fb, x + 24, ry, w - 48, rowH - 8, i == gen4SetupIndex, 10);\n                overlayRects.push_back({x + 24, ry, w - 48, rowH - 8, i});\n                fb.drawText(x + 44, ry + 15, rows[i],''')

          replace_exact('src/UI/SaveSelectScreen.cpp',
              '''            drawSaveInstanceRows(fb, gen4Instances, gen4CandidateIndex, first,\n                                 x, y + 108, w, rowH, visibleRows, false);\n            if (!gen4Notice.empty())''',
              '''            drawSaveInstanceRows(fb, gen4Instances, gen4CandidateIndex, first,\n                                 x, y + 108, w, rowH, visibleRows, false);\n            for (int i = first; i < std::min<int>(static_cast<int>(gen4Instances.size()),\n                                                  first + visibleRows); ++i)\n                overlayRects.push_back({x + 24, y + 108 + (i - first) * rowH,\n                                        w - 48, rowH - 6, i});\n            if (!gen4Notice.empty())''')

          replace_exact('src/UI/SaveSelectScreen.cpp',
              '''                drawFocusedCard(fb, x + 22, ry, w - 44, rowH - 8, i == optionsIndex, 12);\n                fb.drawText(x + 44, ry + 15, rows[i],''',
              '''                drawFocusedCard(fb, x + 22, ry, w - 44, rowH - 8, i == optionsIndex, 12);\n                overlayRects.push_back({x + 22, ry, w - 44, rowH - 8, i});\n                fb.drawText(x + 44, ry + 15, rows[i],''')

          replace_exact('src/UI/SaveSelectScreen.cpp',
              '''            | navTouchButton(touch);\n\n        if (overlay == Overlay::GamesDrawer) {''',
              '''            | navTouchButton(touch);\n\n        if (touch.justPressed() && overlay != Overlay::None &&\n            overlay != Overlay::Help && overlay != Overlay::LegacyDetails) {\n            const int tx = touch.x(), ty = touch.y();\n            for (const auto& r : overlayRects) {\n                if (tx < r.x || tx >= r.x + r.w || ty < r.y || ty >= r.y + r.h) continue;\n                switch (overlay) {\n                    case Overlay::GamesDrawer:      gamesDrawerIndex = r.idx; break;\n                    case Overlay::ProfilePicker:    profilePickerIndex = r.idx; break;\n                    case Overlay::GameWorkspace:    gameWorkspaceIndex = r.idx; break;\n                    case Overlay::GameFilePicker:   launchFileIndex = r.idx; break;\n                    case Overlay::LegacyInstances:  legacyInstanceIndex = r.idx; break;\n                    case Overlay::LegacyAssignment: legacyAssignmentIndex = r.idx; break;\n                    case Overlay::Gen4Setup:        gen4SetupIndex = r.idx; break;\n                    case Overlay::Gen4Candidates:   gen4CandidateIndex = r.idx; break;\n                    case Overlay::Options:          optionsIndex = r.idx; break;\n                    default: break;\n                }\n                kDown |= HidNpadButton_A;\n                break;\n            }\n        }\n\n        if (overlay == Overlay::GamesDrawer) {''')

          replace_exact('src/UI/SaveSelectScreen.cpp',
              '''        if (classicGamesActive) {\n            if (kDown & HidNpadButton_B) {''',
              '''        if (classicGamesActive) {\n            if (touch.justPressed()) {\n                const int tx = touch.x(), ty = touch.y();\n                for (const auto& r : headerRects) {\n                    if (tx >= r.x && tx < r.x + r.w && ty >= r.y && ty < r.y + r.h) {\n                        profilePickerIndex = userIndex;\n                        overlay = Overlay::ProfilePicker;\n                        return;\n                    }\n                }\n                for (const auto& r : titleRects) {\n                    if (tx >= r.x && tx < r.x + r.w && ty >= r.y && ty < r.y + r.h) {\n                        titleIndex = r.idx;\n                        scrollClassicSelectionIntoView();\n                        openIntent = OpenIntent::Default;\n                        selectCurrentTitle();\n                        return;\n                    }\n                }\n            }\n            if (kDown & HidNpadButton_B) {''')

          replace_exact('src/UI/SaveSelectScreen.cpp',
              '''            for (const auto& r : titleRects) {\n                if (tx >= r.x && tx < r.x + r.w && ty >= r.y && ty < r.y + r.h) {''',
              '''            for (const auto& r : actionRects) {\n                if (tx < r.x || tx >= r.x + r.w || ty < r.y || ty >= r.y + r.h) continue;\n                if (r.idx == 0) {\n                    openIntent = OpenIntent::Default;\n                    selectCurrentTitle();\n                } else if (r.idx == 1) {\n                    launchCurrentTitle();\n                } else if (r.idx == 10) {\n                    requestedMainMenuDestination = MainMenuDestination::MasterVault;\n                    exitRequested = true;\n                } else if (r.idx == 11) {\n                    requestedMainMenuDestination = MainMenuDestination::Pokedex;\n                    exitRequested = true;\n                }\n                return;\n            }\n            for (const auto& r : titleRects) {\n                if (tx >= r.x && tx < r.x + r.w && ty >= r.y && ty < r.y + r.h) {''', 1)

          replace_exact('include/UI/ClassicInventoryOverlay.h',
              '''class TrainerViewScreen;\nclass PKSEFramebuffer;''',
              '''class TrainerViewScreen;\nclass PKSEFramebuffer;\nclass TouchInput;''')
          replace_exact('include/UI/ClassicInventoryOverlay.h',
              '''[[nodiscard]] bool handleInput(TrainerViewScreen& screen, uint64_t down);''',
              '''[[nodiscard]] bool handleInput(TrainerViewScreen& screen, uint64_t down, const TouchInput& touch);''')
          replace_exact('src/UI/TrainerViewScreenBase.inc',
              '''        if (ClassicInventory::handleInput(*this, kDown)) return;''',
              '''        if (ClassicInventory::handleInput(*this, kDown, touch)) return;''')
          replace_exact('src/UI/ClassicInventoryOverlay.cpp',
              '''#include "UI/ScreenChrome.h"\n#include "UI/PKSEFramebuffer.h"''',
              '''#include "UI/ScreenChrome.h"\n#include "UI/TouchInput.h"\n#include "UI/PKSEFramebuffer.h"''')
          replace_exact('src/UI/ClassicInventoryOverlay.cpp',
              '''bool handleInput(TrainerViewScreen& screen, uint64_t down) {\n    if (!isClassicSource(screen)) return false;\n    auto& state = stateFor(screen);''',
              '''bool handleInput(TrainerViewScreen& screen, uint64_t down, const TouchInput& touch) {\n    if (!isClassicSource(screen)) return false;\n    auto& state = stateFor(screen);\n\n    int touched = -1;\n    if (touch.justPressed()) {\n        for (const auto& button : screen.touchButtons) {\n            if (touch.x() >= button.x && touch.x() < button.x + button.w &&\n                touch.y() >= button.y && touch.y() < button.y + button.h) {\n                touched = button.id;\n                break;\n            }\n        }\n    }''')
          replace_exact('src/UI/ClassicInventoryOverlay.cpp',
              '''    if (state.pickerActive) {\n        const int count = static_cast<int>(state.pickerItems.size());\n        if (count == 0) { state.pickerActive = false; return true; }''',
              '''    if (state.pickerActive) {\n        const int count = static_cast<int>(state.pickerItems.size());\n        if (count == 0) { state.pickerActive = false; return true; }\n        if (touched >= 0 && touched < count) {\n            state.pickerRow = touched;\n            selectPickerItem(screen);\n            return true;\n        }''')
          replace_exact('src/UI/ClassicInventoryOverlay.cpp',
              '''    if (state.reviewActive) {\n        const auto lines = pendingLines(screen);\n        const int count = static_cast<int>(lines.size());''',
              '''    if (state.reviewActive) {\n        const auto lines = pendingLines(screen);\n        const int count = static_cast<int>(lines.size());\n        if (touched >= 200 && touched < 200 + count)\n            state.reviewRow = touched - 200;''')
          replace_exact('src/UI/ClassicInventoryOverlay.cpp',
              '''    if (state.optionsActive) {\n        constexpr int optionCount = 4;''',
              '''    if (state.optionsActive) {\n        constexpr int optionCount = 4;\n        if (touched >= 100 && touched < 100 + optionCount) {\n            state.optionsRow = touched - 100;\n            down |= HidNpadButton_A;\n        }''')
          replace_exact('src/UI/ClassicInventoryOverlay.cpp',
              '''            drawRow(fb, x + 30, rowY, width - 60, rows[static_cast<std::size_t>(i)], i == state.optionsRow);\n            rowY += 62;''',
              '''            drawRow(fb, x + 30, rowY, width - 60, rows[static_cast<std::size_t>(i)], i == state.optionsRow);\n            screen.touchButtons.push_back({100 + i, x + 30, rowY, width - 60, 48});\n            rowY += 62;''')
          replace_exact('src/UI/ClassicInventoryOverlay.cpp',
              '''                drawRow(fb, x + 30, rowY, width - 60, lines[static_cast<std::size_t>(i)], i == state.reviewRow);\n                rowY += 57;''',
              '''                drawRow(fb, x + 30, rowY, width - 60, lines[static_cast<std::size_t>(i)], i == state.reviewRow);\n                screen.touchButtons.push_back({200 + i, x + 30, rowY, width - 60, 48});\n                rowY += 57;''')
          PY

      - name: Restore MAIN workflow and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/gen4-full-editor-20260928
          git show 587b346f8494e5aee36ac84720b50ef30d0d434f:.github/workflows/one-time-hardware-regressions-20261005.yml \
            > .github/workflows/one-time-hardware-regressions-20261005.yml
          rm -f .github/workflows/one-time-proper-touch-direct-targets.yml

      - name: Commit touch-only runtime changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(touch): add direct content touch targets'
          git push origin HEAD:feature/touch-controls-20261005

name: Gen II Semantic Roundtrip Diagnostic V3

on:
  push:
    branches:
      - dev/gen2-pokemon-editor-20260912

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Identity
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Reuse field-level diagnostic patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          src = Path('.github/workflows/gen2-semantic-diagnostic.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(src) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          code = textwrap.dedent('\n'.join(src[start:end])) + '\n'
          Path('/tmp/gen2_diag.py').write_text(code)
          PY
          python3 /tmp/gen2_diag.py
      - name: Build focused test
        run: make -f Makefile.host build-host/test_gsc_pokemon_editor
      - name: Run focused diagnostic
        run: |
          set -o pipefail
          ./build-host/test_gsc_pokemon_editor 2>&1 | tee /tmp/gen2-diagnostic.log
          grep -F 'GEN2_COMPOUND_ROUNDTRIP_FAILURE:' /tmp/gen2-diagnostic.log

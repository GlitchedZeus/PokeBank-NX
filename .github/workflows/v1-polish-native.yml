name: PokeBank NX v1 Polish Native

on:
  pull_request:
    branches:
      - audit/full-project-hardening-20260923
    paths:
      - 'include/UI/ScreenChrome.h'
      - 'src/UI/SystemIcons.cpp'
      - 'include/UI/SystemIcons.h'
      - 'src/UI/SaveSelectScreen.cpp'
      - 'src/UI/TrainerViewScreenBase.inc'
      - 'Makefile'
      - 'tests/test_v1_polish_contract.py'
      - '.github/workflows/host-tests.yml'
      - '.github/workflows/v1-polish-native.yml'
      - 'docs/V1_POLISH_AUDIT_2026-09-28.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  RECOVERY_SHA: 5bfc27a10de1eeaf52cb92316c1453df3d4fb613

jobs:
  native:
    name: devkitA64 full compile/link/package
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact application head
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact application identity and polish contract
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check HEAD^ HEAD
          python3 tests/test_v1_polish_contract.py
          echo "APPLICATION_SHA=$EXPECTED_SHA"
          echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')"

      - name: Checkout permanent recovery snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RECOVERY_SHA }}
          path: recovery-work
          fetch-depth: 1

      - name: Recover complete RomFS and run asset preflight
        run: |
          set -euo pipefail
          test "$(git -C recovery-work rev-parse HEAD)" = "$RECOVERY_SHA"
          (cd recovery-work && python3 tools/recover_workspace.py)
          rm -rf romfs
          cp -a recovery-work/romfs romfs
          for f in gold_gbc silver_gbc crystal_gbc diamond_nds pearl_nds platinum_nds heartgold_nds soulsilver_nds; do
            test -s "assets/game_cards/$f.png"
            cp "assets/game_cards/$f.png" "romfs/game_cards/$f.png"
          done
          python3 tools/check_device_assets.py

      - name: Clean devkitA64 compile and link
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work devkitpro/devkita64:latest bash -lc '
            set -euo pipefail
            : "${DEVKITPRO:?DEVKITPRO is not set}"
            git config --global --add safe.directory /work
            make clean || true
            make -j1
            test -s PokeBankNX.elf
            test -s PokeBankNX.nro
          ' 2>&1 | tee polish-native-build.log

      - name: Package polish hardware artifact
        id: package
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=8 HEAD)"
          out="polish-artifact"
          mkdir -p "$out"
          cp PokeBankNX.nro "$out/PokeBank-NX-V1-Polish-$short.nro"
          sha256sum "$out/PokeBank-NX-V1-Polish-$short.nro" > "$out/SHA256SUMS.txt"
          printf 'APPLICATION_SHA=%s\nTREE_SHA=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" > "$out/BUILD_IDENTITY.txt"

      - name: Upload polish NRO and native log
        uses: actions/upload-artifact@v4
        with:
          name: PokeBank-NX-V1-Polish-${{ github.run_id }}
          path: |
            polish-artifact/
            polish-native-build.log
          if-no-files-found: error
          retention-days: 30


  packed-regressions:
    name: Packed Move and Multi-Move regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact application head
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact application identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Packed Move host regression
        run: |
          set -euo pipefail
          mkdir -p build-host
          SOURCES="tests/test_gen12_packed_move.cpp \
            src/Integration/Gen1/Gen1StagedPokemonEditor.cpp \
            src/Integration/Gen1/Gen1PackedMove.cpp \
            src/Integration/Gen1/Gen1ReadOnlySave.cpp \
            src/Integration/Gen2/Gen2StagedEditor.cpp \
            src/Integration/Gen2/Gen2PackedMove.cpp \
            src/Integration/Gen2/Gen2ReadOnlySave.cpp \
            src/Integration/Gen2/Gen2ReadOnlyInventory.cpp \
            src/Integration/Gen2/Gen2PersonalData.cpp \
            src/Pokemon/Experience.cpp \
            src/Utils/StringHelpers.cpp \
            src/Utils/HelperUtilities.cpp \
            src/Names/SpeciesNames.cpp"
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -O2 \
            -I. -Iinclude $SOURCES -o build-host/test_gen12_packed_move
          ./build-host/test_gen12_packed_move
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I. -Iinclude $SOURCES -o build-host/test_gen12_packed_move_sanitize
          ASAN_OPTIONS=detect_leaks=0 ./build-host/test_gen12_packed_move_sanitize

      - name: Packed Multi-Move host regression
        run: |
          set -euo pipefail
          SOURCES="tests/test_gen12_packed_multimove.cpp \
            src/Integration/Gen1/Gen1StagedPokemonEditor.cpp \
            src/Integration/Gen1/Gen1PackedMove.cpp \
            src/Integration/Gen1/Gen1ReadOnlySave.cpp \
            src/Integration/Gen2/Gen2StagedEditor.cpp \
            src/Integration/Gen2/Gen2PackedMove.cpp \
            src/Integration/Gen2/Gen2ReadOnlySave.cpp \
            src/Integration/Gen2/Gen2ReadOnlyInventory.cpp \
            src/Integration/Gen2/Gen2PersonalData.cpp \
            src/Pokemon/Experience.cpp \
            src/Utils/StringHelpers.cpp \
            src/Utils/HelperUtilities.cpp \
            src/Names/SpeciesNames.cpp"
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -O2 \
            -I. -Iinclude $SOURCES -o build-host/test_gen12_packed_multimove
          ./build-host/test_gen12_packed_multimove
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I. -Iinclude $SOURCES -o build-host/test_gen12_packed_multimove_sanitize
          ASAN_OPTIONS=detect_leaks=0 ./build-host/test_gen12_packed_multimove_sanitize

name: LeafGreen exact-source physical retest build

on:
  push:
    branches: [feature/pokebank-playable]
    paths: [.github/workflows/leafgreen-device-build.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokebank-leafgreen-device-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out recovery infrastructure
        uses: actions/checkout@v4
        with:
          ref: feature/pokebank-playable
          path: recovery-work
      - name: Require committed snapshot and recover
        working-directory: recovery-work
        run: |
          test -f recovery/assets_snapshot/manifest.json
          python3 tools/recover_workspace.py
      - name: Check out exact application source
        uses: actions/checkout@v4
        with:
          ref: d78b76503f02ae26309855970fc5ce0b35c12bcb
          path: application
          submodules: recursive
      - name: Verify application identity and supply recovered assets
        run: |
          test "$(git -C application rev-parse HEAD)" = d78b76503f02ae26309855970fc5ce0b35c12bcb
          test "$(git -C application rev-parse 'HEAD^{tree}')" = 894500f09655d1fb8e37f27473021e6f091e2a98
          cp -a recovery-work/romfs application/romfs
          python3 application/tools/check_device_assets.py
          test -z "$(git -C application status --porcelain)"
      - name: Clean native no-exceptions build and link
        run: |
          set -euo pipefail
          docker pull devkitpro/devkita64:latest
          docker image inspect devkitpro/devkita64:latest --format '{{json .RepoDigests}}' > toolchain-image.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work/application devkitpro/devkita64:latest bash -lc '
            set -euo pipefail
            git config --global --add safe.directory /work/application
            dkp-pacman -Q > /work/toolchain-packages.txt
            echo "=== native toolchain ==="
            dkp-pacman -Q libnx devkitA64 switch-tools switch-sdl2 switch-glad switch-lz4 || true
            echo "=== installed fsdev declaration/export ==="
            grep -n -B2 -A2 "fsdevGetLastResult" /opt/devkitpro/libnx/include/switch/runtime/devices/fs_dev.h || true
            nm -g --defined-only /opt/devkitpro/libnx/lib/libnx.a | grep "fsdevGetLastResult" || true
            make -j1
            echo "=== fixed LegacySourceBindings.o fsdev reference ==="
            find build -name LegacySourceBindings.o -print -exec nm {} \; | grep -E "LegacySourceBindings|fsdevGetLastResult" || true
          ' 2>&1 | tee native-build.log
      - name: Verify embedded RomFS and package exact binary
        run: |
          set -euo pipefail
          test -z "$(git -C application status --porcelain)"
          python3 application/tools/check_device_assets.py
          python3 recovery-work/tools/verify_embedded_romfs.py \
            application/PokeBankNX.nro application/romfs \
            --application-source d78b76503f02ae26309855970fc5ce0b35c12bcb \
            > embedded-romfs.json
          python3 application/tools/package_device_build.py application/PokeBankNX.nro \
            --label FRLG-Persistence-Retest \
            --out-dir "$GITHUB_WORKSPACE/device-artifact" --zip
          cp embedded-romfs.json toolchain-image.json toolchain-packages.txt native-build.log device-artifact/
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          out = Path('device-artifact')
          application_source = 'd78b76503f02ae26309855970fc5ce0b35c12bcb'
          application_tree = '894500f09655d1fb8e37f27473021e6f091e2a98'
          recovery_source = subprocess.check_output(
              ['git', '-C', 'recovery-work', 'rev-parse', 'HEAD'], text=True).strip()
          record = {
              'application_source': application_source,
              'application_tree': application_tree,
              'recovery_snapshot': 'a2adac94f15504b90a83a295e77ad54154da4206',
              'documentation_recovery_branch_source': recovery_source,
              'device_tested': False,
              'device_accepted': False,
          }
          files = {}
          for p in sorted(out.iterdir()):
              if p.is_file():
                  files[p.name] = {
                      'bytes': p.stat().st_size,
                      'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
                  }
          record['files'] = files
          (out / 'BUILD_MANIFEST.json').write_text(json.dumps(record, indent=2) + '\n')
          sums = []
          for p in sorted(out.iterdir()):
              if p.is_file() and p.name != 'SHA256SUMS.txt':
                  sums.append(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n')
          (out / 'SHA256SUMS.txt').write_text(''.join(sums))
          PY
      - name: Preserve artifact immediately
        uses: actions/upload-artifact@v4
        with:
          name: FRLG-Persistence-Retest-d78b7650
          path: device-artifact/
          if-no-files-found: error
          retention-days: 90
      - name: Publish private device-test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: GlitchedZeus/PokeBank-NX
          RUN_ID: ${{ github.run_id }}
        run: |
          tag="device-frlg-persistence-d78b7650-$RUN_ID"
          gh release create "$tag" device-artifact/* \
            --target d78b76503f02ae26309855970fc5ce0b35c12bcb \
            --prerelease \
            --title "FRLG persistence retest — d78b7650" \
            --notes "Application source d78b76503f02ae26309855970fc5ce0b35c12bcb contains the 92bde34d LeafGreen persistence fix plus the narrow fsdevGetLastResult C-linkage compatibility fix. RomFS was restored from committed recovery snapshot a2adac94f15504b90a83a295e77ad54154da4206 and verified byte-for-byte at 3283 files. DEVICE TESTED: NO. DEVICE ACCEPTED: NO. Stop for physical Switch test."
          gh release view "$tag" --json url,assets > release-record.json
          cat release-record.json >> "$GITHUB_STEP_SUMMARY"
          cat device-artifact/BUILD_MANIFEST.json >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FRLG-Persistence-Retest-build-diagnostics
          path: |
            native-build.log
            embedded-romfs.json
            release-record.json
            toolchain-image.json
            toolchain-packages.txt
          if-no-files-found: ignore

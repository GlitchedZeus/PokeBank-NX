name: L2 Stage 6 Original Parent Lineage
on:
  push:
    branches:
      - feature/legality-l2-breeding-20261012
  workflow_dispatch:

concurrency:
  group: l2-stage6-lineage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  original-lineage:
    name: Original traded evolved migrated sources ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - name: Checkout exact repository and source submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Record and verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Exact source HEAD: $(git rev-parse HEAD)"
          "${{ matrix.cxx }}" --version
      - name: Run original lineage and full original-source joint regressions
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          test -f include/Legality/Gen34EggMoveData.inc
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          sources=(
            tests/fixtures/legality_l2_original_parent_lineage.cpp
            tests/fixtures/legality_l2_lineage_alternative_routes.cpp
            tests/test_legality_l2_stage6_gen3_traded_parents.cpp
            tests/test_legality_l2_stage6_dp_palpark_parents.cpp
            tests/test_legality_l2_stage6_pt_hgss_lineage.cpp
          )
          for mode in normal sanitizer; do
            flags=(-std=c++20 -Wall -Wextra -Wpedantic -Werror
                   -Wno-unused-parameter -Iinclude)
            if [[ "$mode" == sanitizer ]]; then
              flags+=(-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer)
            else
              flags+=(-O2)
            fi
            for file in "${sources[@]}"; do
              name="$(basename "$file" .cpp)"
              "$CXX" "${flags[@]}" "$file" -o "$tmp/$name"
              ASAN_OPTIONS=halt_on_error=1:detect_leaks=1 \
                UBSAN_OPTIONS=halt_on_error=1 "$tmp/$name"
            done
          done

name: PokeBank NX Gen VIII Focused Host

on:
  push:
    branches:
      - claude/gen8-native-20261015
    paths:
      - 'include/Integration/Gen8/**'
      - 'src/Integration/Gen8/**'
      - 'tests/test_gen8_*'
      - 'tests/fixtures/gen8/**'
      - 'include/Integration/Common/VerifiedStagedExport.h'
      - 'src/Integration/Common/VerifiedStagedExport.cpp'
      - 'include/UI/ExactFormatEditorProvider.h'
      - 'include/UI/SharedPokemonEditorContract.h'
      - 'include/Source/SaveInstance.h'
      - 'include/Utils/SHA256.h'
      - 'src/Utils/SHA256.cpp'
      - 'vendor/PKSM-Core'
      - 'Makefile.host'
      - 'Makefile.host.gen8'
      - 'docs/gen8/**'
      - '.github/workflows/gen8-focused-host.yml'
  pull_request:
    paths:
      - 'include/Integration/Gen8/**'
      - 'src/Integration/Gen8/**'
      - 'tests/test_gen8_*'
      - 'tests/fixtures/gen8/**'
      - 'include/Integration/Common/VerifiedStagedExport.h'
      - 'src/Integration/Common/VerifiedStagedExport.cpp'
      - 'include/UI/ExactFormatEditorProvider.h'
      - 'include/UI/SharedPokemonEditorContract.h'
      - 'include/Source/SaveInstance.h'
      - 'include/Utils/SHA256.h'
      - 'src/Utils/SHA256.cpp'
      - 'vendor/PKSM-Core'
      - 'Makefile.host'
      - 'Makefile.host.gen8'
      - 'docs/gen8/**'
      - '.github/workflows/gen8-focused-host.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pokebank-gen8-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gen8-host:
    name: Gen VIII PK8/SwishCrypto contracts (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    env:
      APPLICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASAN_OPTIONS: detect_leaks=1
      CXX: ${{ matrix.compiler }}
    steps:
      - name: Checkout exact Gen VIII head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPLICATION_SHA }}
          fetch-depth: 2
          submodules: recursive
      - name: Verify exact Git identity and whitespace
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPLICATION_SHA"
          git diff --check HEAD^ HEAD
          echo "APPLICATION_SHA=$APPLICATION_SHA"
          echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')"
          echo "PKSM_CORE=$(git -C vendor/PKSM-Core rev-parse HEAD)"
          $CXX --version
      - name: Guard Gen VIII ownership and source immutability
        run: |
          set -euo pipefail
          # Gen VIII code must never open a file for writing outside the shared verified exporter.
          if grep -nE 'fopen\([^)]*"(w|a|r\+)' src/Integration/Gen8/*.cpp; then exit 1; fi
          if grep -nE 'ofstream|O_WRONLY|O_RDWR' src/Integration/Gen8/*.cpp include/Integration/Gen8/*.h; then exit 1; fi
          # The Gen VIII lane takes bytes from an app-owned copy only: no mount, commit or inject path.
          if grep -nE 'fsdevMountSaveData|fsdevCommitDevice|fsOpenSaveDataFileSystem|restoreBackupToTitle|saveTrainerInfo|injectToTitle' \
               src/Integration/Gen8/*.cpp include/Integration/Gen8/*.h; then exit 1; fi
          # Fixtures are synthetic source code only: no committed binary saves.
          if find tests/fixtures/gen8 -type f ! -name '*.h' | grep .; then exit 1; fi
      - name: Build and run Gen VIII host contracts
        run: make -f Makefile.host CXX="$CXX" gen8-host-test
      - name: Build and run Gen VIII ASan/UBSan contracts
        run: |
          set -euo pipefail
          make -f Makefile.host CXX="$CXX" gen8-host-sanitize
          echo "Gen VIII exact-head $CXX + ASan/UBSan PASS"

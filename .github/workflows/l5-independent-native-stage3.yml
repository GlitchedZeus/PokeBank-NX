name: L5 Independent Gen III-IV Native Fuzz QA

on:
  push:
    branches:
      - audit/legality-l5-research-qa-20261012
      # Gen I-V integration branch (PR #314): run on its exact pushed head.
      - 'claude/gen1-5-legality-**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l5-stage3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-stage3:
    # ubuntu-24.04 (clang 18): on ubuntu-22.04, clang 14 links the full-checkout entity
    # build against a libstdc++ that lacks std::u16string's _M_construct<const char16_t*>
    # (used by src/Utils/StringHelpers.cpp), so the Clang entity step cannot link there.
    # The host-tests L5 lane already runs this tool and the GCC entity build on 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Verify immutable source HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git hash-object tests/fixtures/legality_l5_stage3_native_entity_boundary.cpp)" = "a0135799e4e30318e118f3767ffd8b5af684d751"
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Independently verify committed PK3/PK4 crypto source pins and negative controls
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_legality_l5_stage3_native_fuzz.py --self-test
      - name: Actual original PK3/PK4 codec fuzz, GCC+Clang normal plus sanitizers
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_legality_l5_stage3_native_fuzz.py --timeout 900
      - name: Actual linked PK3/PK4 entities GCC and Clang optimized / ASan+UBSan
        shell: bash
        run: |
          set -euo pipefail
          expected="L5 Stage3 actual PK3/PK4 entity quarantine: 17310 PASS (synthetic; full-checkout production linkage)"
          for compiler in g++ clang++; do
            flags=()
            if [ "$compiler" = "clang++" ]; then
              variant=-clang
              # Clang only: the linked production PK3 sources carry GCC-only
              # diagnostic pragmas (src/Encryption/Encryption3FRLG.cpp) and an
              # unused inline helper (unownFormValue in src/Pokemon/Pokemon3FRLG.cpp)
              # that Clang rejects under -Werror. Same two flags as the other
              # Clang legality gates (tools/audit_legality_l6_stage5.py,
              # tools/audit_legality_stage2_native_formats.py). GCC keeps the
              # Makefile.host default CXXFLAGS untouched.
              flags=(CXXFLAGS="-std=c++20 -Wall -Wextra -Wpedantic -Werror -O2 -Wno-unknown-warning-option -Wno-unused-function")
            else
              variant=-gcc
            fi
            for mode in optimized sanitized; do
              if [ "$mode" = sanitized ]; then
                target=l5-stage3-entity-sanitize
              else
                target=l5-stage3-entity
              fi
              log="/tmp/l5-stage3-entity-${compiler}-${mode}.log"
              make -f Makefile.host -f tools/audit_legality_l5_stage3_entities.mk \
                CXX="$compiler" "${flags[@]}" L5_STAGE3_ENTITY_VARIANT="$variant" "$target" | tee "$log"
              grep -Fx "$expected" "$log"
            done
          done
      - name: Reject tracked source mutation by the QA jobs
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

name: standalone-candidate-validation

on:
  push:
    branches:
      - ci/standalone-validation-20260912

permissions:
  contents: read

env:
  APP_SHA: a1b1d7f32de2c65c2215f2287c39d9860820f480
  APP_TREE: 2452d77b556d59736aa3603b21b6c64a6994ed1f
  PROD_SHA: 3618f2423ba48be4fcaee138beb1fadec36792bd
  RECOVERY_SHA: 5bfc27a10de1eeaf52cb92316c1453df3d4fb613
  EXPECTED_RECOVERY_ROMFS: 3289
  EXPECTED_FINAL_ROMFS: 3292

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact standalone candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
          fetch-depth: 4
          submodules: recursive
      - name: Verify exact identity and application-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$APP_TREE"
          git cat-file -e "$PROD_SHA^{commit}"
          git diff --check "$PROD_SHA" "$APP_SHA"
          git diff --name-only "$PROD_SHA" "$APP_SHA" | sort > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          CURRENT_STATUS.md
          Makefile.host
          Makefile.host.standalone
          README.md
          docs/CLASSIC_SAVE_EDITOR_ARCHITECTURE.md
          docs/STANDALONE_RUNTIME.md
          docs/UI_OWNERSHIP_STATUS.md
          include/Globals.h
          include/Trainer/Bank.h
          include/UI/TrainerViewScreenBase.h
          include/Utils/FileUtilities.h
          include/Utils/Logger.h
          include/Utils/PokeBankPaths.h
          include/Utils/Settings.h
          src/Trainer/Bank.cpp
          src/UI/BackupSelectionScreen.cpp
          src/UI/TrainerViewScreenBase.inc
          src/UI/TrainerViewScreenGSCOverlay.cpp
          src/UI/UI.cpp
          src/Utils/FileUtilities.cpp
          src/Utils/Logger.cpp
          src/Utils/Settings.cpp
          src/main.cpp
          tests/test_clean_install_runtime.cpp
          tests/test_pokebank_paths.cpp
          tests/test_runtime_dependency_contract.cpp
          EOF
          sed -i 's/^          //' /tmp/expected-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          test -z "$(git diff --name-only "$PROD_SHA" "$APP_SHA" -- .github/workflows)"
      - name: Runtime dependency, path and safety invariants
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -n -I -F 'sdmc:/PKSE' -- src include
          grep -q 'sdmc:/switch/PokeBank-NX' include/Utils/PokeBankPaths.h
          grep -q 'exports/gen2' docs/STANDALONE_RUNTIME.md
          grep -q '0x01008F6008C5E000ULL' src/Games/GameIdentity.cpp
          grep -q 'return source == SourceKind::BackupOrStaged || source == SourceKind::AppOwnedStorage;' include/Safety/SourceMutationPolicy.h
          grep -q 'LIVE_RETROARCH_WRITE=DISABLED' src/UI/TrainerViewScreenGSCOverlay.cpp
          grep -q 'LIVE_INSTALLED_GAME_WRITE=DISABLED' src/UI/TrainerViewScreenGSCOverlay.cpp
          echo '--- inherited/reference symbols intentionally retained ---'
          git grep -n -I -E 'PKSE|PKSM|PokeVault|PKHeX|JKSV|Checkpoint|pkDex|pkHouse' -- src include docs README.md CURRENT_STATUS.md || true
      - name: Full host suite including standalone/no-PKSE/path tests
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.host host-clean
          make -f Makefile.host host-test
          ./build-host/test_pokebank_paths
          ./build-host/test_clean_install_runtime
          ./build-host/test_runtime_dependency_contract
          ./build-host/test_write_policy
          ./build-host/test_source_mutation_policy
          ./build-host/test_gsc_staged_editor
          ./build-host/test_gsc_gen2_adapter
          ./build-host/test_gsc_inventory
          ./build-host/test_gsc_readonly_bridge
          ./build-host/test_rby_gen1_adapter
          ./build-host/test_rby_inventory
          ./build-host/test_rby_discovery
          ./build-host/test_rby_source_browser
          ./build-host/test_rby_readonly_bridge
          ./build-host/test_retroarch_frlg_discovery
          ./build-host/test_legacy_frlg_browse
          ./build-host/test_legacy_source_bindings
          ./build-host/test_pksm_gen3_adapter
          ./build-host/test_gen3_native_slice
          ./build-host/test_rse_gen3_adapter
          ./build-host/test_rse_gen3_native_slice
      - name: Focused RSE save-open regression
        shell: bash
        run: |
          set -euo pipefail
          SOURCES="tests/test_rse_open_regression.cpp \
            src/Integration/Gen3/PKSMGen3NativeAdapter.cpp src/Integration/Gen3/FRLGReadModel.cpp \
            src/Legacy/FRLGReadOnlyTrainer.cpp src/Pokemon/Pokemon3FRLG.cpp \
            src/Pokemon/BaseStatsGen89.cpp src/Pokemon/PersonalInfoTable.cpp src/Pokemon/Experience.cpp \
            src/Encryption/Encryption3FRLG.cpp src/Names/ItemNames.cpp src/Names/SpeciesNames.cpp \
            src/Names/NatureNames.cpp src/Names/AbilityNames.cpp src/Utils/StringHelpers.cpp \
            src/Utils/HelperUtilities.cpp src/Utils/SHA256.cpp src/Games/GameIdentity.cpp"
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Wno-unused-parameter -O2 \
            -DPOKEBANK_GEN3_SELECTIVE_PORT_TEST -Iinclude $SOURCES \
            -o build-host/test_rse_open_regression
          ./build-host/test_rse_open_regression
      - name: ASan and UBSan full host suite
        run: make -f Makefile.host host-sanitize

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact standalone candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SHA }}
          path: application
          fetch-depth: 4
          submodules: recursive
      - name: Checkout recovery snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RECOVERY_SHA }}
          path: recovery-work
          fetch-depth: 1
      - name: Recover exact RomFS and run device asset preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C application rev-parse HEAD)" = "$APP_SHA"
          test "$(git -C application rev-parse 'HEAD^{tree}')" = "$APP_TREE"
          (cd recovery-work && python3 tools/recover_workspace.py)
          test "$(find recovery-work/romfs -type f | wc -l)" -eq "$EXPECTED_RECOVERY_ROMFS"
          rm -rf application/romfs
          cp -a recovery-work/romfs application/romfs
          for f in gold_gbc silver_gbc crystal_gbc; do
            cp "application/assets/game_cards/$f.png" "application/romfs/game_cards/$f.png"
          done
          test "$(find application/romfs -type f | wc -l)" -eq "$EXPECTED_FINAL_ROMFS"
          python3 application/tools/check_device_assets.py 2>&1 | tee asset-preflight.log
          grep -q 'DEVICE ASSET PREFLIGHT: PASS' asset-preflight.log
      - name: Native devkitA64 compile, affected probes and final link
        shell: bash
        run: |
          set -euo pipefail
          docker pull devkitpro/devkita64:latest
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work/application devkitpro/devkita64:latest bash -lc '
            set -euo pipefail
            git config --global --add safe.directory /work/application
            make clean || true
            make -j1
            test -s PokeBankNX.nro
            for obj in Gen2StagedEditor.o GSCReadOnlyTrainer.o TrainerViewScreenGSCOverlay.o TrainerViewScreen.o Logger.o Settings.o FileUtilities.o Bank.o BackupSelectionScreen.o UI.o; do
              find build -name "$obj" -type f | grep -q . || { echo "missing native object: $obj"; exit 1; }
            done
          ' 2>&1 | tee native-build.log
          grep -q 'linking PokeBankNX.elf' native-build.log
          grep -q '0x01008F6008C5E000ULL' application/src/Games/GameIdentity.cpp
          grep -q 'return source == SourceKind::BackupOrStaged || source == SourceKind::AppOwnedStorage;' application/include/Safety/SourceMutationPolicy.h
          echo 'PATH/FILESYSTEM NATIVE COMPILE: PASS'
          echo 'GEN II EDITOR NATIVE COMPILE: PASS'
          echo 'GSC BRIDGE/UI NATIVE COMPILE: PASS'
          echo 'TRAINER/AFFECTED UI NATIVE COMPILE: PASS'
          echo 'NATIVE FINAL LINK: PASS'

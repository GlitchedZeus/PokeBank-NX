name: One-time Product performance no-behavior patch

on:
  push:
    branches:
      - feature/gen4-full-editor-20260928
    paths:
      - .github/workflows/one-time-product-performance-no-behavior.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gen4-full-editor-20260928
          fetch-depth: 2

      - name: Verify exact staging head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 408a56446f9dda611732c8186d6ce4148100d65f HEAD
          git merge-base --is-ancestor 46e3af0a2d023de9587a297d9cc93ba78a184591 HEAD

      - name: Apply behavior-preserving performance patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Startup: remove the always-on Pikachu decode that existed only as a loader self-test.
          p = Path('src/main.cpp')
          s = p.read_text()
          old = '''    Utils::logInfoToFile("Testing sprite loading...");
              UI::Sprite* testSprite = UI::SpriteManager::getSprite(25, false); // Pikachu
              if (testSprite && testSprite->data) {
                  logInfoToFile(("SUCCESS: Test sprite loaded! (" +
                      std::to_string(testSprite->width) + "x" +
                      std::to_string(testSprite->height) + ")").c_str());
              } else {
                  Utils::logInfoToFile("WARNING: Test sprite failed to load - sprites may not be available");
              }

          '''.replace('              ', '    ')
          if old not in s:
              raise SystemExit('startup sprite self-test block changed; refuse blind patch')
          p.write_text(s.replace(old, '', 1))

          # 2) HOME forwarders: enumerate installed application metadata once per PokeBank session.
          p = Path('src/UI/GameLauncher.cpp')
          s = p.read_text()
          old = '''#ifdef __SWITCH__
          uint64_t installedGameForwarderTitle(std::string_view gameId) {
              static std::map<std::string, uint64_t> cache;
              const std::string key(gameId);
              if (const auto found = cache.find(key); found != cache.end()) return found->second;

              if (!PokeVault::Games::findGame(gameId)) { cache[key] = 0; return 0; }

              uint64_t unique = 0;
              int matches = 0;
              s32 offset = 0;
              while (offset < 2048) {
                  NsApplicationRecord records[32]{};
                  s32 count = 0;
                  if (R_FAILED(nsListApplicationRecord(records, 32, offset, &count)) || count <= 0) break;
                  for (s32 i = 0; i < count; ++i) {
                      auto* control = static_cast<NsApplicationControlData*>(
                          std::malloc(sizeof(NsApplicationControlData)));
                      if (!control) continue;
                      u64 outSize = 0;
                      const Result rc = nsGetApplicationControlData(
                          NsApplicationControlSource_Storage, records[i].application_id,
                          control, sizeof(NsApplicationControlData), &outSize);
                      if (R_SUCCEEDED(rc) && outSize != 0) {
                          NacpLanguageEntry* language = nullptr;
                          if (R_SUCCEEDED(nacpGetLanguageEntry(&control->nacp, &language)) && language) {
                              const std::string name = compactGameTitle(language->name);
                              if (installedForwarderNameMatches(gameId, name)) {
                                  unique = records[i].application_id;
                                  ++matches;
                              }
                          }
                      }
                      std::free(control);
                      if (matches > 1) break;
                  }
                  if (matches > 1 || count < 32) break;
                  offset += count;
              }
              if (matches != 1) unique = 0;
              cache[key] = unique;
              return unique;
          }
          #endif
          '''.replace('          ', '')
          new = '''#ifdef __SWITCH__
          struct InstalledApplicationName {
              uint64_t titleId = 0;
              std::string normalizedName;
          };

          const std::vector<InstalledApplicationName>& installedApplicationNames() {
              // HOME application metadata is console-global for the lifetime of this process. Build
              // it once, then let every legacy game identity match against memory instead of asking
              // ns for the same application-control records again for FireRed, Emerald, Platinum, etc.
              static const std::vector<InstalledApplicationName> applications = [] {
                  std::vector<InstalledApplicationName> found;
                  s32 offset = 0;
                  while (offset < 2048) {
                      NsApplicationRecord records[32]{};
                      s32 count = 0;
                      if (R_FAILED(nsListApplicationRecord(records, 32, offset, &count)) || count <= 0)
                          break;
                      for (s32 i = 0; i < count; ++i) {
                          auto* control = static_cast<NsApplicationControlData*>(
                              std::malloc(sizeof(NsApplicationControlData)));
                          if (!control) continue;
                          u64 outSize = 0;
                          const Result rc = nsGetApplicationControlData(
                              NsApplicationControlSource_Storage, records[i].application_id,
                              control, sizeof(NsApplicationControlData), &outSize);
                          if (R_SUCCEEDED(rc) && outSize != 0) {
                              NacpLanguageEntry* language = nullptr;
                              if (R_SUCCEEDED(nacpGetLanguageEntry(&control->nacp, &language)) && language) {
                                  const std::string name = compactGameTitle(language->name);
                                  if (!name.empty())
                                      found.push_back({records[i].application_id, name});
                              }
                          }
                          std::free(control);
                      }
                      if (count < 32) break;
                      offset += count;
                  }
                  return found;
              }();
              return applications;
          }

          uint64_t installedGameForwarderTitle(std::string_view gameId) {
              static std::map<std::string, uint64_t> cache;
              const std::string key(gameId);
              if (const auto found = cache.find(key); found != cache.end()) return found->second;

              if (!PokeVault::Games::findGame(gameId)) { cache[key] = 0; return 0; }

              uint64_t unique = 0;
              int matches = 0;
              for (const auto& application : installedApplicationNames()) {
                  if (!installedForwarderNameMatches(gameId, application.normalizedName)) continue;
                  unique = application.titleId;
                  if (++matches > 1) break;
              }
              if (matches != 1) unique = 0;
              cache[key] = unique;
              return unique;
          }
          #endif
          '''.replace('          ', '')
          if old not in s:
              raise SystemExit('installed forwarder lookup block changed; refuse blind patch')
          p.write_text(s.replace(old, new, 1))

          # 3) Quick Games X is Save/Source setup. Do not mount/parse the party or resolve a launch
          # target just to open that same setup UI; use the already-loaded card metadata instead.
          p = Path('src/UI/SaveSelectScreen.cpp')
          s = p.read_text()
          old = '''                    titleIndex = gamesDrawerIndex;
                              scrollSelectionIntoView();
                              refreshHubPreview();
                              openSaveSourceForCurrentTitle(true, false);
          '''.replace('                              ', '                    ')
          new = '''                    titleIndex = gamesDrawerIndex;
                              scrollSelectionIntoView();
                              refreshHubSelectionFromCache();
                              openSaveSourceForCurrentTitle(true, false);
          '''.replace('                              ', '                    ')
          if s.count(old) != 1:
              raise SystemExit(f'Quick Games X block count changed: {s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          # Lock the no-behavior-change performance boundaries with a focused source contract.
          Path('tests/test_product_performance_contract.py').write_text(r'''from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          main = (ROOT / "src/main.cpp").read_text(encoding="utf-8")
          launcher = (ROOT / "src/UI/GameLauncher.cpp").read_text(encoding="utf-8")
          home = (ROOT / "src/UI/SaveSelectScreen.cpp").read_text(encoding="utf-8")

          def require(cond: bool, message: str) -> None:
              if not cond:
                  raise SystemExit(message)

          require('Testing sprite loading...' not in main and 'getSprite(25, false)' not in main,
                  'normal startup must not decode Pikachu only as a sprite-loader self-test')
          require('installedApplicationNames()' in launcher and
                  'static const std::vector<InstalledApplicationName> applications' in launcher,
                  'installed HOME application metadata must be cached once per process')
          lookup_start = launcher.index('uint64_t installedGameForwarderTitle')
          lookup_end = launcher.index('#endif', lookup_start)
          lookup = launcher[lookup_start:lookup_end]
          require('nsListApplicationRecord' not in lookup and 'nsGetApplicationControlData' not in lookup,
                  'per-game forwarder lookup must not re-enumerate HOME applications')
          drawer_start = home.index('if (overlay == Overlay::GamesDrawer)')
          drawer_end = home.index('if (overlay == Overlay::ProfilePicker)', drawer_start)
          drawer = home[drawer_start:drawer_end]
          x_start = drawer.index('if (kDown & HidNpadButton_X)')
          x_end = drawer.index('if (count > 0)', x_start)
          x_block = drawer[x_start:x_end]
          require('refreshHubSelectionFromCache();' in x_block and 'refreshHubPreview();' not in x_block,
                  'Quick Games X / Save-Source must stay off full preview I/O')
          require('openSaveSourceForCurrentTitle(true, false);' in x_block,
                  'Quick Games X must keep the same Save/Source action')
          print('product performance source contract passed')
          '''.replace('          ', ''), encoding='utf-8')
          PY

      - name: Validate focused contracts
        run: |
          set -euo pipefail
          python3 tests/test_product_performance_contract.py
          python3 tests/test_game_hub_contract.py
          python3 tests/test_ci_repository_safety_contract.py
          python3 tests/test_engineering_authority_contract.py
          git diff --check

      - name: Commit and push runtime patch
        run: |
          set -euo pipefail
          git config user.name GlitchedZeus
          git config user.email user91746@protonmail.com
          git add src/main.cpp src/UI/GameLauncher.cpp src/UI/SaveSelectScreen.cpp tests/test_product_performance_contract.py
          git commit -m "perf(ui): remove redundant Product Home I/O"
          git push origin HEAD:feature/gen4-full-editor-20260928

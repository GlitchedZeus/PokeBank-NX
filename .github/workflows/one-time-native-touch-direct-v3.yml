name: One-time native touch direct v3

on:
  push:
    branches: [feature/touch-controls-20261005]
    paths:
      - .github/workflows/one-time-native-touch-direct-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact branch head
        run: |
          set -euo pipefail
          git fetch origin feature/touch-controls-20261005
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/feature/touch-controls-20261005)" = "$GITHUB_SHA"
      - name: Apply reviewed v2 patch with exact final card-clear removal
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/one-time-native-touch-direct-v2.yml').read_text().splitlines()
          body=[]; capture=False
          for line in src:
              if line == "          python3 - <<'PY'": capture=True; continue
              if capture and line == '          PY': break
              if capture: body.append(line[10:] if line.startswith('          ') else line)
          script='\n'.join(body)+'\n'
          needle="bad = [x for x in stale if x in s]\n"
          fix="s = s.replace('        g_touchCardHits.clear();\\n', '')\ns = s.replace('        g_touchCardAccum.clear();\\n', '')\n"
          if needle not in script: raise SystemExit('v2 guard anchor missing')
          script=script.replace(needle,fix+needle,1)
          Path('/tmp/direct_touch_v3.py').write_text(script)
          PY
          python3 /tmp/direct_touch_v3.py
          git diff --check
          ! grep -R -n -E 'TouchCardHit|g_touchCardAccum|g_touchCardHits|g_productHomeCardTap|g_cardTapQueue|queueSpatialCardTap|emitQueuedCardTap|coordinateRank' include/UI src/UI
      - name: Commit direct-touch runtime and remove staging workflows
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-native-touch-direct-v3.yml
          rm -f .github/workflows/one-time-native-touch-direct-v2.yml .github/workflows/one-time-native-touch-current.yml
          cat > .github/workflows/one-time-product-freeze-party-cleanup.yml <<'EOF'
          name: Disabled one-time Product Home freeze + party cleanup

          on:
            workflow_dispatch:

          jobs:
            disabled:
              runs-on: ubuntu-latest
              steps:
                - run: echo "Broad Product Home cleanup disabled; use focused hardware fixes only."
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include/UI/ScreenChrome.h include/UI/AppShellScreen.h src/UI/AppShellScreen.cpp src/UI/SaveSelectScreen.cpp src/UI/ClassicInventoryOverlay.cpp .github/workflows/one-time-native-touch-direct-v3.yml .github/workflows/one-time-native-touch-direct-v2.yml .github/workflows/one-time-native-touch-current.yml .github/workflows/one-time-product-freeze-party-cleanup.yml
          git diff --cached --quiet && { echo 'No direct-touch changes'; exit 1; }
          git commit -m 'feat(ui): replace controller-emulated touch with direct touch'
          git push origin HEAD:feature/touch-controls-20261005

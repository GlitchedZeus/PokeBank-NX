name: Classic Inventory Correction

on:
  push:
    branches:
      - ci/classic-inventory-correction-20260913

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout carrier
        uses: actions/checkout@v4
        with:
          ref: ci/classic-inventory-correction-20260913
          path: carrier

      - name: Checkout preserved development branch
        uses: actions/checkout@v4
        with:
          ref: dev/classic-inventory-20260912
          fetch-depth: 0
          path: work
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify preserved starting point
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "947d996804a359c10d6bceee2f0612059ea89c61"
          test "$(git rev-parse HEAD^{tree})" = "0670ee0ccc341b61445fdac5fc273d1708b1cf8c"
          git diff --quiet
          git diff --cached --quiet

      - name: Apply and validate authoritative controls
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          python3 ../carrier/.github/scripts/apply_classic_inventory_correction.py controls
          git diff --check
          make -f Makefile.host.classic_inventory host-classic-inventory
          ! git grep -n -E 'Y: Add Item.*X: Remove Item|Y Add Item.*X Remove Item|\+: Pending Changes' -- \
            src/UI/ClassicInventoryOverlay.cpp src/UI/TrainerViewScreenBase.inc docs/CONTROLS.md
          git config user.name "PokeBank NX CI"
          git config user.email "actions@users.noreply.github.com"
          git add include/UI/ClassicInventoryUIModel.h src/UI/ClassicInventoryUIModel.cpp \
                  tests/test_classic_inventory_ui_model.cpp src/UI/ClassicInventoryOverlay.cpp \
                  src/UI/TrainerViewScreenBase.inc src/UI/TrainerViewScreenGSCOverlay.cpp docs/CONTROLS.md
          git commit -m "ui: correct classic inventory controls and options"

      - name: Fix and validate permanent host linkage
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          python3 ../carrier/.github/scripts/apply_classic_inventory_correction.py build
          python3 ../carrier/.github/scripts/update_rby_bridge_expectations.py
          git diff --check
          rm -rf build-host
          make -f Makefile.host.base build-host/test_legacy_frlg_browse
          ./build-host/test_legacy_frlg_browse
          make -f Makefile.host.base build-host/test_rby_readonly_bridge
          ./build-host/test_rby_readonly_bridge
          make -f Makefile.host.classic_inventory host-classic-inventory
          make -f Makefile.host.base build-host/test_classic_inventory_ui_model
          ./build-host/test_classic_inventory_ui_model
          git add Makefile.host.base tests/test_rby_readonly_bridge.cpp
          git commit -m "build: link staged classic inventory into host regressions"

      - name: Push corrected development branch
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          git log -2 --oneline
          git push origin HEAD:dev/classic-inventory-20260912
